spring.application.name=TheCasualWear

#SQL connect
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#JPA
#spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=10
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#luu anh len cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#Mail cho forgot password
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.default-encoding=UTF-8

#Vnpay
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}

app.base-url=http://localhost:8080

#GHN (Giao Hang Nhanh) - tinh phi ship + master data dia chi
ghn.token=${GHN_TOKEN}
ghn.shop-id=${GHN_SHOP_ID}
ghn.api-base-url=https://dev-online-gateway.ghn.vn/shiip/public-api
# Dia chi lay hang cua shop (dung lam from_district_id/from_ward_code khi goi Calculate Fee)
ghn.from-district-id=${GHN_FROM_DISTRICT_ID}
ghn.from-ward-code=${GHN_FROM_WARD_CODE}
# Timeout ngan de khong lam cham trang checkout neu GHN cham/down - fallback ve region-based
ghn.connect-timeout-ms=3000
ghn.read-timeout-ms=4000

