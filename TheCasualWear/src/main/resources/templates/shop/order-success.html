<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Đặt hàng thành công</title></head>
<body>

<div class="ord-success-wrap">
    <div class="ord-check-box">
        <svg class="ord-check" viewBox="0 0 80 80" width="72" height="72">
            <circle class="ord-check-circle" cx="40" cy="40" r="36" fill="none" stroke-width="2"/>
            <path class="ord-check-mark" d="M24 41 L35 52 L57 28" fill="none"
                  stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <h1 class="ord-success-title">Đặt hàng thành công</h1>
    <p class="ord-success-sub">Cảm ơn bạn đã mua sắm tại The Casual Wear</p>

    <div class="ord-success-line"></div>

    <div class="ord-success-meta">
        <div class="ord-success-row">
            <span>Mã đơn hàng</span>
            <strong th:text="'#' + ${order.id}"></strong>
        </div>
        <div class="ord-success-row">
            <span>Trạng thái</span>
            <span th:switch="${order.status.name()}">
                <span th:case="'PENDING'"   class="ord-status ord-status--pending">Chờ xác nhận</span>
                <span th:case="'CONFIRMED'" class="ord-status ord-status--confirmed">Đã xác nhận</span>
                <span th:case="'SHIPPING'"  class="ord-status ord-status--shipping">Đang giao</span>
                <span th:case="'COMPLETED'" class="ord-status ord-status--completed">Hoàn thành</span>
                <span th:case="'CANCELLED'" class="ord-status ord-status--cancelled">Đã hủy</span>
                <span th:case="'RETURNED'"  class="ord-status ord-status--returned">Đã hoàn hàng</span>
            </span>
        </div>
    </div>

    <div class="ord-success-actions">
        <a th:href="@{/order/detail/__${order.id}__}" class="ord-btn">Xem đơn hàng</a>
        <a th:href="@{/shop}" class="ord-btn ord-btn--outline">Tiếp tục mua sắm</a>
    </div>
</div>

<style>
    /* ═══ Design tokens dùng chung — khớp shop-layout.html ═══ */
    .ord-success-wrap {
        --ink: #111111;
        --paper: #ffffff;
        --line: #e5e2dc;
        --mute: #8a8a8a;
        max-width: 420px;
        margin: 5.5rem auto;
        padding: 0 1rem;
        text-align: center;
        animation: ord-fade-up .5s ease both;
    }

    .ord-check-box { display: flex; justify-content: center; margin-bottom: 1.5rem; }
    .ord-check-circle {
        stroke: var(--ink);
        stroke-dasharray: 226;
        stroke-dashoffset: 226;
        animation: ord-draw .6s ease forwards .1s;
    }
    .ord-check-mark {
        stroke: var(--ink);
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: ord-draw .35s ease forwards .65s;
    }
    @keyframes ord-draw { to { stroke-dashoffset: 0; } }
    @keyframes ord-fade-up {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .ord-success-title {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--ink);
        margin: 0 0 .4rem;
    }
    .ord-success-sub {
        font-size: .82rem;
        color: var(--mute);
        margin: 0;
    }
    .ord-success-line {
        width: 40px;
        height: 1px;
        background: var(--line);
        margin: 1.6rem auto;
    }

    .ord-success-meta { text-align: left; margin-bottom: 2rem; }
    .ord-success-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: .6rem 0;
        border-bottom: 1px solid var(--line);
        font-size: .82rem;
    }
    .ord-success-row span:first-child {
        color: var(--mute);
        text-transform: uppercase;
        letter-spacing: .06em;
        font-size: .68rem;
    }
    .ord-success-row strong { font-weight: 700; color: var(--ink); }

    .ord-success-actions { display: flex; flex-direction: column; gap: .6rem; }

    /* ═══ Nút dùng chung cho các trang đơn hàng ═══ */
    .ord-btn {
        display: block;
        width: 100%;
        padding: .8rem 1rem;
        background: var(--ink);
        color: #fff;
        border: 1px solid var(--ink);
        font-size: .74rem;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        text-decoration: none;
        text-align: center;
        transition: opacity .2s;
    }
    .ord-btn:hover { opacity: .8; color: #fff; }
    .ord-btn--outline {
        background: var(--paper);
        color: var(--ink);
        border: 1px solid var(--ink);
    }
    .ord-btn--outline:hover { background: var(--ink); color: #fff; opacity: 1; }

    /* ═══ Badge trạng thái phẳng — dùng chung cho cả 3 trang ═══ */
    .ord-status {
        display: inline-block;
        font-size: .64rem;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        padding: .25rem .55rem;
        border: 1px solid currentColor;
    }
    .ord-status--pending   { color: #a8760a; }
    .ord-status--confirmed { color: #2f6fed; }
    .ord-status--shipping  { color: #6c3fc9; }
    .ord-status--completed { color: #1e7d34; }
    .ord-status--cancelled { color: #c0392b; }
    .ord-status--returned  { color: #6a6a6a; }

    @media (max-width: 480px) {
        .ord-success-wrap { margin: 3rem auto; }
    }
</style>
</body>
</html>
