<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trang chủ</title>
    <style>
        /* ── TOKENS ── mô phỏng đúng smaker.vn: nền trắng, chữ đen, không bo
           góc, không đổ bóng, chữ hoa cho nhãn, "shop now" là mô-típ lặp lại
           dưới mọi tile danh mục. */
        :root {
            --ink: #111111;
            --paper: #ffffff;
            --line: #eceae5;
            --mute: #8a8a8a;
        }
        * { box-sizing: border-box; }
        body { color: var(--ink); -webkit-font-smoothing: antialiased; }
        a { color: inherit; }

        .sec-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin: 0 0 1.6rem;
        }
        .shop-now {
            display: inline-block;
            font-size: .72rem;
            font-weight: 500;
            letter-spacing: .04em;
            text-transform: lowercase;
            text-decoration: none;
            color: var(--mute);
            border-bottom: 1px solid transparent;
            transition: color .2s, border-color .2s;
        }
        .shop-now:hover { color: var(--ink); border-color: var(--ink); }
        .shop-now::after { content: " →"; }

        /* ── HERO — 1 ảnh full-bleed, giống banner tĩnh của smaker.vn ── */
        .hero {
            position: relative;
            height: 78vh;
            min-height: 420px;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            background: #efece6;
        }
        .hero__bg {
            position: absolute; inset: 0;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .hero__overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,.55) 22%, rgba(0,0,0,0) 65%);
        }
        .hero__content { position: relative; padding: 0 6vw 5vh; }
        .hero__eyebrow {
            font-size: .68rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: rgba(255,255,255,.7);
            margin-bottom: .6rem;
        }
        .hero__title {
            font-size: clamp(2rem, 4.6vw, 3.4rem);
            font-weight: 700;
            text-transform: uppercase;
            color: #fff;
            line-height: 1.08;
            margin: 0 0 1.1rem;
        }
        .hero__btn {
            display: inline-block;
            padding: .7rem 2.2rem;
            background: #fff;
            color: #111;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            text-decoration: none;
            transition: background .2s, color .2s;
        }
        .hero__btn:hover { background: #111; color: #fff; }

        /* ── SECTION ── */
        .home-section { padding: 3.4rem 0; }

        /* ── TILE DANH MỤC (Featured Collections / What's New) ── */
        .cat-tile { display: block; text-decoration: none; color: var(--ink); }
        .cat-tile__img {
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #f4f2ef;
            margin-bottom: .9rem;
        }
        .cat-tile__img img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .5s ease;
        }
        .cat-tile:hover .cat-tile__img img { transform: scale(1.05); }
        .cat-tile__name {
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
            margin: 0 0 .3rem;
        }

        /* ── BANNER FULL-BLEED XEN GIỮA (không chữ) ── */
        .split-banner {
            display: block;
            height: 46vh;
            min-height: 300px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* ── LƯỚI SẢN PHẨM THẬT — tag góc trái kiểu "New", tên hoa, giá đơn
           giản, KHÔNG hiện tên danh mục trên card (đúng /san-pham thật) ── */
        .p-card { display: block; text-decoration: none; color: var(--ink); }
        .p-card__img-wrap { position: relative; overflow: hidden; background: #f4f2ef; aspect-ratio: 3/4; }
        .p-card__img-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .5s ease;
        }
        .p-card:hover .p-card__img-wrap img { transform: scale(1.04); }
        .p-card__tag {
            position: absolute;
            top: 10px; left: 10px;
            z-index: 2;
            background: var(--ink);
            color: #fff;
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 3px 9px;
        }
        .p-card__body { padding: .85rem .05rem 0; }
        .p-card__name {
            font-size: .8rem;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: .3rem;
        }
        .p-card__price { font-size: .8rem; font-weight: 500; color: var(--ink); }
        .p-card__price-original {
            font-size: .72rem;
            color: var(--mute);
            text-decoration: line-through;
            margin-right: 6px;
        }

        @media (max-width: 576px) {
            .home-section { padding: 2.2rem 0; }
        }
    </style>
</head>
<body>

<!-- ═══ HERO ═══ -->
<div class="hero">
    <div class="hero__bg" style="background-image:url('/images/banner2.jpg')"></div>
    <div class="hero__overlay"></div>
    <div class="hero__content">
        <p class="hero__eyebrow">The Casual Wear</p>
        <h1 class="hero__title">Freeship toàn quốc<br/>mọi đơn hàng</h1>
        <a th:href="@{/shop}" class="hero__btn">Shop now</a>
    </div>
</div>

<div class="container py-2">

    <!-- ═══ FEATURED COLLECTIONS — 6 danh mục đầu tiên ═══ -->
    <div class="home-section"
         th:if="${productsByCategory != null and !#maps.isEmpty(productsByCategory)}">
        <p class="sec-title">Featured Collections</p>
        <div class="row row-cols-2 row-cols-md-4 g-4">
            <div class="col" th:each="entry, eStat : ${productsByCategory}" th:if="${eStat.index < 6}">
                <a th:href="@{/shop(category=${entry.value[0].category.id})}" class="cat-tile">
                    <div class="cat-tile__img">
                        <img th:if="${entry.value[0].images != null and !entry.value[0].images.isEmpty()}"
                             th:src="${entry.value[0].images[0].imageUrl}" th:alt="${entry.key}"/>
                        <img th:unless="${entry.value[0].images != null and !entry.value[0].images.isEmpty()}"
                             src="/images/no-image.png" alt=""/>
                    </div>
                    <p class="cat-tile__name" th:text="${entry.key}"></p>
                    <span class="shop-now">shop now</span>
                </a>
            </div>
        </div>
    </div>

    <!-- ═══ BANNER FULL-BLEED (xen giữa, không chữ) ═══ -->
    <a th:href="@{/shop}" class="split-banner" style="background-image:url('/images/banner2.jpg')"></a>

    <!-- ═══ WHAT'S NEW — các danh mục còn lại + ô Sale ═══ -->
    <div class="home-section"
         th:if="${productsByCategory != null and !#maps.isEmpty(productsByCategory)}">
        <p class="sec-title">What's New</p>
        <div class="row row-cols-2 row-cols-md-4 g-4">
            <div class="col" th:each="entry, eStat : ${productsByCategory}" th:if="${eStat.index >= 6}">
                <a th:href="@{/shop(category=${entry.value[0].category.id})}" class="cat-tile">
                    <div class="cat-tile__img">
                        <img th:if="${entry.value[0].images != null and !entry.value[0].images.isEmpty()}"
                             th:src="${entry.value[0].images[0].imageUrl}" th:alt="${entry.key}"/>
                        <img th:unless="${entry.value[0].images != null and !entry.value[0].images.isEmpty()}"
                             src="/images/no-image.png" alt=""/>
                    </div>
                    <p class="cat-tile__name" th:text="${entry.key}"></p>
                    <span class="shop-now">shop now</span>
                </a>
            </div>
            <div class="col" th:if="${saleProducts != null and !#lists.isEmpty(saleProducts)}">
                <a th:href="@{/clearance}" class="cat-tile">
                    <div class="cat-tile__img">
                        <img th:if="${saleProducts[0].images != null and !saleProducts[0].images.isEmpty()}"
                             th:src="${saleProducts[0].images[0].imageUrl}" alt="Sale"/>
                        <img th:unless="${saleProducts[0].images != null and !saleProducts[0].images.isEmpty()}"
                             src="/images/no-image.png" alt=""/>
                    </div>
                    <p class="cat-tile__name">Sale</p>
                    <span class="shop-now">shop now</span>
                </a>
            </div>
        </div>
    </div>

    <!-- ═══ BANNER FULL-BLEED THỨ 2 ═══ -->
    <a th:href="@{/clearance}" class="split-banner" style="background-image:url('/images/banner2.jpg')"></a>

    <!-- ═══ MỚI VỀ — lưới sản phẩm thật, tag "New" như /san-pham ═══ -->
    <div class="home-section"
         th:if="${newestProducts != null and !#lists.isEmpty(newestProducts)}">
        <p class="sec-title">Mới về</p>
        <div class="row row-cols-2 row-cols-md-4 g-4">
            <div class="col" th:each="p : ${newestProducts}"
                 th:with="sale=${activeSales != null ? activeSales.get(p.id) : null}">
                <a th:href="@{'/product/' + ${p.id}}" class="p-card">
                    <div class="p-card__img-wrap">
                        <span th:if="${sale == null}" class="p-card__tag">New</span>
                        <span th:if="${sale != null}" class="p-card__tag"
                              th:text="'-' + ${#numbers.formatDecimal(sale.discountPercent,1,0)} + '%'"></span>
                        <img th:if="${p.images != null and !p.images.isEmpty()}"
                             th:src="${p.images[0].imageUrl}" th:alt="${p.name}"/>
                        <img th:unless="${p.images != null and !p.images.isEmpty()}"
                             src="/images/no-image.png" alt=""/>
                    </div>
                    <div class="p-card__body">
                        <p class="p-card__name" th:text="${p.name}"></p>
                        <p th:if="${sale != null}" class="p-card__price mb-0">
                            <span class="p-card__price-original"
                                  th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></span>
                            <span th:text="${#numbers.formatInteger(
                                    p.price - (p.price * sale.discountPercent / 100), 0, 'COMMA') + ' đ'}"></span>
                        </p>
                        <p th:unless="${sale != null}" class="p-card__price"
                           th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- ═══ ĐANG SALE — lưới sản phẩm thật ═══ -->
    <div class="home-section" style="padding-top:0"
         th:if="${saleProducts != null and !#lists.isEmpty(saleProducts)}">
        <div class="d-flex justify-content-between align-items-baseline">
            <p class="sec-title">Đang sale</p>
            <a th:href="@{/clearance}" class="shop-now mb-3">shop now</a>
        </div>
        <div class="row row-cols-2 row-cols-md-4 g-4">
            <div class="col" th:each="p : ${saleProducts}"
                 th:with="sale=${activeSales != null ? activeSales.get(p.id) : null}">
                <a th:href="@{'/product/' + ${p.id}}" class="p-card">
                    <div class="p-card__img-wrap">
                        <span th:if="${sale != null}" class="p-card__tag"
                              th:text="'-' + ${#numbers.formatDecimal(sale.discountPercent,1,0)} + '%'"></span>
                        <img th:if="${p.images != null and !p.images.isEmpty()}"
                             th:src="${p.images[0].imageUrl}" th:alt="${p.name}"/>
                        <img th:unless="${p.images != null and !p.images.isEmpty()}"
                             src="/images/no-image.png" alt=""/>
                    </div>
                    <div class="p-card__body">
                        <p class="p-card__name" th:text="${p.name}"></p>
                        <p th:if="${sale != null}" class="p-card__price mb-0">
                            <span class="p-card__price-original"
                                  th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></span>
                            <span th:text="${#numbers.formatInteger(
                                    p.price - (p.price * sale.discountPercent / 100), 0, 'COMMA') + ' đ'}"></span>
                        </p>
                        <p th:unless="${sale != null}" class="p-card__price"
                           th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></p>
                    </div>
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
