<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Đơn hàng của tôi</title></head>
<body>

<div class="ord-page">
    <h1 class="ord-page-title">Đơn hàng của tôi</h1>
    <div class="ord-page-line"></div>

    <!-- Trống -->
    <div th:if="${#lists.isEmpty(orders)}" class="ord-empty">
        <p>Bạn chưa có đơn hàng nào</p>
        <a th:href="@{/shop}" class="ord-btn" style="max-width:220px;margin:1rem auto 0">Mua sắm ngay</a>
    </div>

    <!-- Danh sách đơn -->
    <div th:unless="${#lists.isEmpty(orders)}" class="ord-list">
        <div th:each="order, i : ${orders}" class="ord-card"
             th:style="'animation-delay:' + ${i.index * 0.06} + 's'">

            <div class="ord-card-top">
                <div>
                    <p class="ord-card-id">Đơn hàng <strong th:text="'#' + ${order.id}"></strong></p>
                    <p class="ord-card-date" th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></p>
                </div>
                <span th:switch="${order.status.name()}">
                    <span th:case="'PENDING'"   class="ord-status ord-status--pending">Chờ xác nhận</span>
                    <span th:case="'CONFIRMED'" class="ord-status ord-status--confirmed">Đã xác nhận</span>
                    <span th:case="'SHIPPING'"  class="ord-status ord-status--shipping">Đang giao</span>
                    <span th:case="'COMPLETED'" class="ord-status ord-status--completed">Hoàn thành</span>
                    <span th:case="'CANCELLED'" class="ord-status ord-status--cancelled">Đã hủy</span>
                    <span th:case="'RETURNED'"  class="ord-status ord-status--returned">Đã hoàn hàng</span>
                </span>
            </div>

            <div class="ord-card-mid">
                <div class="ord-thumb-row">
                    <img th:each="detail, di : ${order.orderDetails}" th:if="${di.index < 4}"
                         th:src="${(detail.variant.product.images != null and !detail.variant.product.images.isEmpty()) ? detail.variant.product.images[0].imageUrl : '/images/no-image.png'}"
                         class="ord-thumb"/>
                    <span th:if="${#lists.size(order.orderDetails) > 4}"
                          class="ord-thumb-more"
                          th:text="'+' + ${#lists.size(order.orderDetails) - 4}"></span>
                </div>
                <span class="ord-item-count"
                      th:text="${#lists.size(order.orderDetails)} + ' sản phẩm'"></span>
            </div>

            <div class="ord-card-bottom">
                <span class="ord-total" th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA') + ' đ'}"></span>
                <a th:href="@{'/order/detail/' + ${order.id}}" class="ord-btn ord-btn--outline ord-btn--sm">
                    Xem chi tiết
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .ord-page {
        --ink: #111111;
        --paper: #ffffff;
        --line: #e5e2dc;
        --mute: #8a8a8a;
        max-width: 780px;
        margin: 0 auto;
        padding: 2.5rem 1rem 4rem;
    }
    .ord-page-title {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        margin: 0 0 1rem;
        color: var(--ink);
    }
    .ord-page-line { width: 100%; height: 1px; background: var(--line); margin-bottom: 2rem; }

    .ord-empty { text-align: center; padding: 3rem 0; color: var(--mute); font-size: .85rem; }

    .ord-list { display: flex; flex-direction: column; gap: 1rem; }

    .ord-card {
        border: 1px solid var(--line);
        padding: 1.1rem 1.2rem;
        animation: ord-fade-up .45s ease both;
    }
    @keyframes ord-fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .ord-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: .75rem;
        flex-wrap: wrap;
    }
    .ord-card-id { font-size: .82rem; font-weight: 600; color: var(--ink); margin: 0; }
    .ord-card-id strong { font-weight: 700; }
    .ord-card-date { font-size: .7rem; color: var(--mute); margin: .1rem 0 0; }

    .ord-card-mid {
        display: flex;
        align-items: center;
        gap: .8rem;
        margin: .9rem 0;
        padding: .9rem 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
    }
    .ord-thumb-row { display: flex; gap: 6px; }
    .ord-thumb { width: 48px; height: 48px; object-fit: cover; border: 1px solid var(--line); }
    .ord-thumb-more {
        width: 48px; height: 48px;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid var(--line);
        font-size: .72rem;
        color: var(--mute);
    }
    .ord-item-count { font-size: .72rem; color: var(--mute); }

    .ord-card-bottom { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .ord-total { font-size: .92rem; font-weight: 700; color: var(--ink); }

    /* ═══ Nút & badge dùng chung ═══ */
    .ord-btn {
        display: inline-block;
        padding: .8rem 1rem;
        background: var(--ink);
        color: #fff;
        border: 1px solid var(--ink);
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        text-decoration: none;
        text-align: center;
        transition: opacity .2s, background .2s, color .2s;
    }
    .ord-btn:hover { opacity: .8; color: #fff; }
    .ord-btn--outline { background: var(--paper); color: var(--ink); }
    .ord-btn--outline:hover { background: var(--ink); color: #fff; opacity: 1; }
    .ord-btn--sm { padding: .5rem .9rem; font-size: .66rem; }

    .ord-status {
        display: inline-block;
        font-size: .62rem;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        padding: .25rem .55rem;
        border: 1px solid currentColor;
        white-space: nowrap;
    }
    .ord-status--pending   { color: #a8760a; }
    .ord-status--confirmed { color: #2f6fed; }
    .ord-status--shipping  { color: #6c3fc9; }
    .ord-status--completed { color: #1e7d34; }
    .ord-status--cancelled { color: #c0392b; }
    .ord-status--returned  { color: #6a6a6a; }
</style>
</body>
</html>
