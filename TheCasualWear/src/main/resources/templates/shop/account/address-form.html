<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Địa chỉ</title></head>
<body>
<div class="container py-4">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/account-menu :: account-menu}"></div>
        </div>
        <div class="col-md-9">
            <div class="card border-0 shadow-sm overflow-hidden">

                <!-- Header đen giống các trang khác -->
                <div class="d-flex align-items-center gap-3 px-4 py-3" style="background:#000;color:#fff;">
                    <i class="bi bi-geo-alt-fill fs-4"></i>
                    <div>
                        <h5 class="mb-0 fw-bold"
                            th:text="${address.id == null ? 'Thêm địa chỉ mới' : 'Cập nhật địa chỉ'}"></h5>
                        <small class="text-white-50">Địa chỉ này sẽ được dùng khi giao hàng</small>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form th:action="${address.id == null ? '/account/address/add' : '/account/address/edit/' + address.id}"
                          th:object="${address}" method="post" id="address-form">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Họ tên</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                <input type="text" th:field="*{fullName}" class="form-control"
                                       placeholder="Nhập họ tên người nhận" required/>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Số điện thoại</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-telephone"></i></span>
                                <input type="text" th:field="*{phone}" class="form-control"
                                       placeholder="0901234567"
                                       pattern="\d{10}"
                                       maxlength="10"
                                       title="Số điện thoại phải đúng 10 chữ số"
                                       required/>
                            </div>
                            <div class="form-text text-muted">
                                <i class="bi bi-info-circle me-1"></i>Nhập đúng 10 chữ số
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Địa chỉ</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-house"></i></span>
                                <input type="text" th:field="*{street}" class="form-control"
                                       placeholder="Số nhà, tên đường" required/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Tỉnh/Thành phố</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-geo-alt"></i></span>
                                    <select th:field="*{city}" th:attr="data-current=*{city}"
                                            id="citySelect" class="form-select" required>
                                        <option value="">-- Chọn Tỉnh/Thành phố --</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Phường/Xã</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-signpost-split"></i></span>
                                    <select th:field="*{district}" th:attr="data-current=*{district}"
                                            id="districtSelect" class="form-select" disabled>
                                        <option value="">-- Chọn Tỉnh/Thành phố trước --</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/account/address}" class="btn btn-outline-secondary rounded-pill px-4">Hủy</a>
                            <button type="submit" class="btn btn-dark rounded-pill px-4">
                                <i class="bi bi-save me-1"></i>Lưu
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/address-cascade.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        initAddressCascade('citySelect', 'districtSelect');
    });

    const phoneInput = document.querySelector('[name="phone"]');

    function validatePhone() {
        const phone = phoneInput.value.trim();
        phoneInput.value = phone.replace(/\D/g, '');

        if (!phone) {
            phoneInput.classList.remove('is-invalid', 'is-valid');
            return;
        }

        if (/^\d{10}$/.test(phone)) {
            phoneInput.classList.remove('is-invalid');
            phoneInput.classList.add('is-valid');
        } else {
            phoneInput.classList.remove('is-valid');
            phoneInput.classList.add('is-invalid');
        }
    }

    phoneInput.addEventListener('input', validatePhone);

    if (phoneInput.value) validatePhone();
</script>
</body>
</html>
