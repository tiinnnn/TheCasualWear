<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Tài khoản</title></head>
<body>
<div class="container py-4">
<div class="row g-4">
    <div class="col-md-3">
        <div th:replace="~{fragments/account-menu :: account-menu}"></div>
    </div>
    <div class="col-md-9">
        <div class="card border-0 shadow-sm overflow-hidden">

            <!-- Header đen giống ảnh mẫu -->
            <div class="d-flex align-items-center gap-3 px-4 py-3" style="background:#000;color:#fff;">
                <i class="bi bi-person-vcard fs-4"></i>
                <div>
                    <h5 class="mb-0 fw-bold">Thông tin cá nhân</h5>
                    <small class="text-white-50">Quản lý thông tin liên hệ của bạn</small>
                </div>
            </div>

            <div class="card-body p-4">
                <form th:action="@{/account/update}" method="post" id="profileForm">

                    <!-- Tên đăng nhập -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-uppercase text-muted">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" th:value="${user.username}"
                                   class="form-control bg-light" disabled/>
                        </div>
                    </div>

                    <!-- Section: Thông tin liên hệ -->
                    <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
                        <i class="bi bi-envelope-fill"></i>
                        <span class="fw-bold text-uppercase small" style="letter-spacing:.5px;">Thông tin liên hệ</span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Email
                                <span class="text-muted small">(* cần ít nhất Email hoặc SĐT)</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" name="email"
                                       th:value="${user != null ? user.email : ''}"
                                       class="form-control"
                                       placeholder="example@gmail.com"
                                       pattern="[a-zA-Z0-9._%+\-]+@gmail\.com"
                                       title="Email phải có đuôi @gmail.com"/>
                            </div>
                            <div class="form-text text-muted">
                                <i class="bi bi-info-circle me-1"></i>Chỉ chấp nhận email @gmail.com
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Điện thoại
                                <span class="text-muted small">(* cần ít nhất Email hoặc SĐT)</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="text" id="phone" name="phone"
                                       th:value="${user != null ? user.phone : ''}"
                                       class="form-control"
                                       placeholder="0901234567"
                                       pattern="\d{10}"
                                       maxlength="10"
                                       title="Số điện thoại phải đúng 10 chữ số"/>
                            </div>
                            <div class="form-text text-muted">
                                <i class="bi bi-info-circle me-1"></i>Nhập đúng 10 chữ số
                            </div>
                        </div>
                    </div>

                    <div class="text-end mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-dark rounded-pill px-4">
                            <i class="bi bi-save me-1"></i>Cập nhật
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
<script>
    document.getElementById('profileForm').addEventListener('submit', function(e) {
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        if (!email && !phone) {
            e.preventDefault();
            alert('Vui lòng giữ ít nhất Email hoặc Số điện thoại!');
        }
    });
    document.getElementById('email').addEventListener('input', function() {
        const email = this.value.trim();

        if (!email) {
            this.classList.remove('is-invalid', 'is-valid');
            return;
        }

        if (email.toLowerCase().endsWith('@gmail.com')) {
            this.classList.remove('is-invalid');
            this.classList.add('is-valid');
        } else {
            this.classList.remove('is-valid');
            this.classList.add('is-invalid');
        }
    });
    document.getElementById('phone').addEventListener('input', function() {
        const phone = this.value.trim();

        this.value = phone.replace(/\D/g, '');

        if (!phone) {
            this.classList.remove('is-invalid', 'is-valid');
            return;
        }

        if (/^\d{10}$/.test(phone)) {
            this.classList.remove('is-invalid');
            this.classList.add('is-valid');
        } else {
            this.classList.remove('is-valid');
            this.classList.add('is-invalid');
        }
    });
</script>
</body>
</html>
