<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Đổi mật khẩu</title></head>
<body>
<div class="container py-4">
<div class="row g-4">
    <div class="col-md-3">
        <div th:replace="~{fragments/account-menu :: account-menu}"></div>
    </div>
    <div class="col-md-9">
        <div class="card border-0 shadow-sm overflow-hidden">

            <!-- Header đen giống ảnh mẫu -->
            <div class="d-flex align-items-center gap-3 px-4 py-3" style="background:#000;color:#fff;">
                <i class="bi bi-shield-lock-fill fs-4"></i>
                <div>
                    <h5 class="mb-0 fw-bold">Đổi mật khẩu</h5>
                    <small class="text-white-50">Bảo vệ tài khoản bằng mật khẩu mạnh, khó đoán</small>
                </div>
            </div>

            <div class="card-body p-4">

                <!-- Box mẹo bảo mật -->
                <div class="d-flex align-items-start gap-3 p-3 mb-4 rounded-3" style="background:#f5f5f5;">
                    <i class="bi bi-info-circle-fill fs-5 text-dark"></i>
                    <div>
                        <div class="fw-semibold">Mẹo bảo mật</div>
                        <div class="text-muted small">Dùng ít nhất 6 ký tự, kết hợp chữ và số. Không chia sẻ mật khẩu với người khác.</div>
                    </div>
                </div>

                <form th:action="@{/account/change-password}" method="post" id="changePasswordForm">

                    <!-- Mật khẩu cũ -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Mật khẩu cũ</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" name="oldPassword" id="oldPassword"
                                   class="form-control" placeholder="Nhập mật khẩu hiện tại" required/>
                            <button type="button" class="btn btn-outline-secondary toggle-pw" data-target="oldPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Mật khẩu mới -->
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-semibold">Mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                                <input type="password" name="newPassword" id="newPassword"
                                       class="form-control" placeholder="Nhập mật khẩu mới"
                                       minlength="6" required/>
                                <button type="button" class="btn btn-outline-secondary toggle-pw" data-target="newPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Nhập lại mật khẩu mới -->
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-semibold">Nhập lại mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-check-circle"></i></span>
                                <input type="password" name="confirmPassword" id="confirmPassword"
                                       class="form-control" placeholder="Nhập lại mật khẩu mới"
                                       minlength="6" required/>
                                <button type="button" class="btn btn-outline-secondary toggle-pw" data-target="confirmPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="form-text text-danger d-none" id="mismatchHint">
                                <i class="bi bi-exclamation-circle me-1"></i>Mật khẩu nhập lại không khớp
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-3 pt-3 border-top">
                        <a th:href="@{/account}" class="btn btn-outline-secondary rounded-pill px-4">Hủy</a>
                        <button type="submit" class="btn btn-dark rounded-pill px-4">
                            <i class="bi bi-save me-1"></i>Cập nhật
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
<script>
    // Hiện/ẩn mật khẩu
    document.querySelectorAll('.toggle-pw').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const input = document.getElementById(this.dataset.target);
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });
    });

    // Cảnh báo nhập lại mật khẩu không khớp (chặn submit nếu sai)
    const form = document.getElementById('changePasswordForm');
    const newPw = document.getElementById('newPassword');
    const confirmPw = document.getElementById('confirmPassword');
    const mismatchHint = document.getElementById('mismatchHint');

    function checkMatch() {
        if (confirmPw.value && newPw.value !== confirmPw.value) {
            mismatchHint.classList.remove('d-none');
            confirmPw.classList.add('is-invalid');
        } else {
            mismatchHint.classList.add('d-none');
            confirmPw.classList.remove('is-invalid');
        }
    }
    newPw.addEventListener('input', checkMatch);
    confirmPw.addEventListener('input', checkMatch);

    form.addEventListener('submit', function (e) {
        if (newPw.value !== confirmPw.value) {
            e.preventDefault();
            mismatchHint.classList.remove('d-none');
            confirmPw.classList.add('is-invalid');
        }
    });
</script>
</body>
</html>
