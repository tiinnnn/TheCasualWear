<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Tra cứu đơn hàng</title></head>
<body>
<div class="container py-5" style="max-width:480px;">
    <h3 class="mb-2 fw-bold">Tra cứu đơn hàng</h3>
    <p class="text-muted mb-4">Nhập mã đơn hàng đã dùng khi đặt hàng.</p>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/order/lookup-guest}" th:object="${lookupForm}" method="post">
        <div class="mb-4">
            <label class="form-label">Mã đơn hàng</label>
            <input type="text" th:field="*{orderCode}" class="form-control"
                   placeholder="VD: A1B2C3D4" style="text-transform:uppercase"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('orderCode')}" th:errors="*{orderCode}"></div>
        </div>

        <button type="submit" class="btn btn-dark w-100 rounded-pill py-2">Tra cứu</button>
    </form>

    <p class="text-muted small text-center mt-4">
        Đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a> để xem toàn bộ lịch sử đơn hàng.
    </p>
</div>
</body>
</html>
