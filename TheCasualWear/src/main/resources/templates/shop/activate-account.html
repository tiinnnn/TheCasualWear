<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Kích hoạt tài khoản - TheCasualWear</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container" style="max-width:420px; margin-top:80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-3 text-center">Kích hoạt tài khoản</h4>
            <p class="text-muted small text-center">Đặt mật khẩu để hoàn tất kích hoạt tài khoản của bạn.</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/activate-account}" method="post">
                <input type="hidden" name="token" th:value="${token}"/>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu mới</label>
                    <input type="password" name="password" class="form-control" minlength="6" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" name="confirmPassword" class="form-control" minlength="6" required/>
                </div>

                <button type="submit" class="btn btn-dark w-100">Kích hoạt tài khoản</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
