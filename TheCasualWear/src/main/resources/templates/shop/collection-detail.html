<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${collection.name}"></title></head>
<body>

<!-- Ảnh bìa + tên collection -->
<div class="col-hero" th:if="${collection.coverImage != null}">
    <img th:src="${collection.coverImage}" class="col-hero-img"/>
    <div class="col-hero-overlay"></div>
    <div class="col-hero-text">
        <h1 class="col-hero-name" th:text="${collection.name}"></h1>
        <p class="col-hero-desc" th:if="${collection.description != null}" th:text="${collection.description}"></p>
        <div th:if="${collection.startDate != null or collection.endDate != null}" class="col-hero-dates">
            <span th:if="${collection.startDate != null}"
                  th:text="'Từ ' + ${#temporals.format(collection.startDate, 'dd/MM/yyyy')}"></span>
            <span th:if="${collection.startDate != null and collection.endDate != null}"> — </span>
            <span th:if="${collection.endDate != null}"
                  th:text="'Kết thúc ' + ${#temporals.format(collection.endDate, 'dd/MM/yyyy')}"></span>
        </div>
    </div>
</div>

<!-- Tiêu đề khi không có ảnh -->
<div th:unless="${collection.coverImage != null}" class="col-header-plain">
    <h1 class="col-hero-name" th:text="${collection.name}"></h1>
    <p class="col-plain-desc" th:if="${collection.description != null}" th:text="${collection.description}"></p>
    <div th:if="${collection.startDate != null or collection.endDate != null}" class="col-hero-dates col-hero-dates--plain">
        <span th:if="${collection.startDate != null}"
              th:text="'Từ ' + ${#temporals.format(collection.startDate, 'dd/MM/yyyy')}"></span>
        <span th:if="${collection.startDate != null and collection.endDate != null}"> — </span>
        <span th:if="${collection.endDate != null}"
              th:text="'Kết thúc ' + ${#temporals.format(collection.endDate, 'dd/MM/yyyy')}"></span>
    </div>
</div>

<div class="col-page">
    <!-- Breadcrumb -->
    <nav class="col-breadcrumb-nav">
        <ol class="col-breadcrumb">
            <li><a th:href="@{/}">Trang chủ</a></li>
            <li><a th:href="@{/collections}">Collections</a></li>
            <li class="is-active" th:text="${collection.name}"></li>
        </ol>
    </nav>

    <p class="col-count" th:text="${#lists.size(products)} + ' sản phẩm'"></p>

    <!-- Trống -->
    <div th:if="${#lists.isEmpty(products)}" class="col-empty">
        Collection này chưa có sản phẩm.
    </div>

    <!-- Sản phẩm -->
    <div class="row row-cols-2 row-cols-md-4 g-4">
        <div th:each="p, i : ${products}" class="col">
            <a th:href="@{'/product/' + ${p.id}}" class="col-prod-card"
               th:style="${'animation-delay:' + (i.index * 0.05) + 's'}">
                <img th:if="${p.images != null and !p.images.isEmpty()}"
                     th:src="${p.images[0].imageUrl}" class="col-prod-img"/>
                <img th:unless="${p.images != null and !p.images.isEmpty()}"
                     src="/images/no-image.png" class="col-prod-img"/>
                <p class="col-prod-name" th:text="${p.name}"></p>
                <p class="col-prod-price" th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></p>
            </a>
        </div>
    </div>
</div>

<style>
    :root {
        --ink: #111111;
        --paper: #ffffff;
        --line: #e5e2dc;
        --mute: #8a8a8a;
    }

    /* ── Hero ── */
    .col-hero { position: relative; width: 100%; aspect-ratio: 21 / 9; max-height: 460px; overflow: hidden; margin-bottom: 3rem; background: #111; }
    .col-hero-img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; }
    .col-hero-overlay {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.45));
    }
    .col-hero-text {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; color: #fff; padding: 0 1rem;
        animation: col-fade-up .6s ease both;
    }
    .col-hero-name {
        font-size: 1.6rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 .7rem;
    }
    .col-hero-desc { font-size: .88rem; max-width: 480px; opacity: .9; margin: 0 0 .8rem; }
    .col-hero-dates {
        font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; opacity: .8;
        border-top: 1px solid rgba(255,255,255,.4); padding-top: .6rem; display: inline-block;
    }

    .col-header-plain { text-align: center; padding: 3rem 1rem 1rem; }
    .col-header-plain .col-hero-name { color: var(--ink); }
    .col-plain-desc { color: var(--mute); font-size: .85rem; max-width: 480px; margin: 0 auto .8rem; }
    .col-hero-dates--plain { color: var(--mute); border-top: 1px solid var(--line); }

    @keyframes col-fade-up {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Body ── */
    .col-page { max-width: 1140px; margin: 0 auto; padding: 0 1rem 4rem; }

    .col-breadcrumb-nav { margin-bottom: 1.2rem; }
    .col-breadcrumb { display: flex; list-style: none; padding: 0; margin: 0; font-size: .78rem; color: var(--mute); }
    .col-breadcrumb li + li::before { content: "›"; margin: 0 .5rem; color: #bbb; }
    .col-breadcrumb a { color: var(--mute); text-decoration: none; transition: color .15s; }
    .col-breadcrumb a:hover { color: var(--ink); }
    .col-breadcrumb .is-active { color: var(--ink); font-weight: 600; }

    .col-count {
        font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute);
        border-bottom: 1px solid var(--line); padding-bottom: 1.2rem; margin-bottom: 2rem;
    }
    .col-empty { text-align: center; padding: 3rem 0; color: var(--mute); font-size: .85rem; }

    /* ── Thẻ sản phẩm — đồng bộ với product-detail.html ── */
    .col-prod-card {
        display: block; text-decoration: none; color: var(--ink);
        animation: col-fade-up .45s ease both;
    }
    .col-prod-img { width: 100%; height: 260px; object-fit: cover; display: block; transition: opacity .2s; }
    .col-prod-card:hover .col-prod-img { opacity: .85; }
    .col-prod-name {
        font-size: .68rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink);
        margin: .7rem 0 .2rem;
    }
    .col-prod-price { font-size: .74rem; color: var(--mute); margin: 0; }

    @media (max-width: 576px) {
        .col-hero { aspect-ratio: 4 / 3; max-height: 320px; }
        .col-hero-name { font-size: 1.2rem; }
    }
</style>
</body>
</html>
