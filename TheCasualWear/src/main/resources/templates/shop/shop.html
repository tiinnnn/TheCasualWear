<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shop</title>
    <style>
        /* ── TOKENS (đồng bộ với home.html) ── */
        :root {
            --ink: #111111;
            --paper: #ffffff;
            --line: #eceae5;
            --mute: #8a8a8a;
        }
        * { box-sizing: border-box; }
        body { color: var(--ink); -webkit-font-smoothing: antialiased; }
        a { color: inherit; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .shop-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 1.1rem;
            margin-bottom: 1.6rem;
            border-bottom: 1px solid var(--line);
        }
        .sec-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin: 0;
        }
        .sec-title small {
            font-size: .68rem;
            font-weight: 500;
            letter-spacing: .02em;
            text-transform: none;
            color: var(--mute);
        }

        /* ===== Toolbar: tìm kiếm + sắp xếp — phẳng, đơn sắc ===== */
        .shop-toolbar { margin-bottom: 2.4rem; }
        .shop-toolbar .form-control,
        .shop-toolbar .form-select {
            border: 1px solid var(--line);
            border-radius: 0;
            font-size: .85rem;
            padding: .6rem .9rem;
        }
        .shop-toolbar .form-control:focus,
        .shop-toolbar .form-select:focus {
            border-color: var(--ink);
            box-shadow: none;
        }
        .shop-toolbar .btn-dark {
            background: var(--ink);
            border: 1px solid var(--ink);
            border-radius: 0;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            padding: .6rem 1.6rem;
            transition: background-color .2s ease, color .2s ease;
        }
        .shop-toolbar .btn-dark:hover { background: var(--paper); color: var(--ink); }
        .shop-toolbar .btn-outline-secondary {
            border: 1px solid var(--line);
            border-radius: 0;
            color: var(--mute);
            padding: .6rem .9rem;
            transition: all .2s ease;
        }
        .shop-toolbar .btn-outline-secondary:hover {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
        }

        /* ===== Product card — đúng bố cục /san-pham thật:
           tag đơn sắc góc trái ("New" hoặc "-X%"), không nhãn danh mục,
           tên hoa, giá đơn giản, không khung/không đổ bóng ===== */
        .p-card {
            display: block;
            text-decoration: none;
            color: var(--ink);
            opacity: 0;
            animation: fadeInUp .5s ease forwards;
        }
        .p-card__img-wrap { position: relative; overflow: hidden; background: #f4f2ef; aspect-ratio: 3/4; }
        .p-card__img-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .5s ease;
        }
        .p-card:hover .p-card__img-wrap img { transform: scale(1.04); }
        .p-card__tag {
            position: absolute;
            top: 10px; left: 10px;
            z-index: 2;
            background: var(--ink);
            color: #fff;
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 3px 9px;
        }
        .p-card__body { padding: .85rem .05rem 0; }
        .p-card__name {
            font-size: .8rem;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: .3rem;
            transition: opacity .2s;
        }
        .p-card:hover .p-card__name { opacity: .55; }
        .p-card__price { font-size: .8rem; font-weight: 500; color: var(--ink); }
        .p-card__price-original {
            font-size: .72rem;
            color: var(--mute);
            text-decoration: line-through;
            margin-right: 6px;
        }

        /* ===== Empty state ===== */
        .empty-state { padding: 5rem 0; }
        .empty-state i { font-size: 2.2rem; color: var(--mute); }
        .empty-state p { color: var(--mute); letter-spacing: .04em; }
        .empty-state .btn-outline-dark {
            border-radius: 0;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            padding: .6rem 1.8rem;
            transition: all .2s ease;
        }
        .empty-state .btn-outline-dark:hover { background: var(--ink); color: #fff; }
    </style>
</head>
<body>
<div class="container py-3">

    <!-- ═══ TIÊU ĐỀ ═══ -->
    <div class="shop-head">
        <p class="sec-title">
            Sản phẩm
            <small th:text="'(' + ${totalItems} + ')'"></small>
        </p>
    </div>

    <!-- ═══ TÌM KIẾM + SẮP XẾP ═══ -->
    <form th:action="@{/shop}" method="get" class="d-flex gap-2 shop-toolbar">
        <input type="hidden" name="category" th:value="${selectedCategory}"
               th:if="${selectedCategory != null}"/>
        <input type="text" name="keyword" th:value="${keyword}"
               class="form-control" placeholder="Tìm kiếm sản phẩm..."/>
        <select name="sort" class="form-select w-auto" onchange="this.form.submit()">
            <option value="newest"
                    th:selected="${sort == 'newest' or sort == null}">Mới nhất</option>
            <option value="price_asc"
                    th:selected="${sort == 'price_asc'}">Giá: thấp → cao</option>
            <option value="price_desc"
                    th:selected="${sort == 'price_desc'}">Giá: cao → thấp</option>
        </select>
        <button type="submit" class="btn btn-dark">Tìm</button>
        <!-- Reset filter -->
        <a th:if="${keyword != null or selectedCategory != null}"
           th:href="@{/shop}" class="btn btn-outline-secondary">✕</a>
    </form>

    <!-- ═══ DANH SÁCH SẢN PHẨM ═══ -->
    <div th:if="${#lists.isEmpty(products)}" class="text-center empty-state">
        <i class="bi bi-emoji-frown d-block mb-3"></i>
        <p class="mb-3">Không tìm thấy sản phẩm nào</p>
        <a th:href="@{/shop}" class="btn btn-outline-dark">Xem tất cả</a>
    </div>

    <div class="row row-cols-2 row-cols-md-4 g-4"
         th:unless="${#lists.isEmpty(products)}">
        <div class="col" th:each="p, iterStat : ${products}"
             th:with="sale=${activeSales.get(p.id)}">
            <a th:href="@{'/product/' + ${p.id}}" class="p-card"
               th:style="'animation-delay:' + ${iterStat.index % 8 * 0.06} + 's'">
                <div class="p-card__img-wrap">
                    <span th:if="${sale == null}" class="p-card__tag">New</span>
                    <span th:if="${sale != null}" class="p-card__tag"
                          th:text="'-' + ${#numbers.formatDecimal(sale.discountPercent,1,0)} + '%'"></span>
                    <img th:if="${p.images != null and !p.images.isEmpty()}"
                         th:src="${p.images[0].imageUrl}" th:alt="${p.name}"/>
                    <img th:unless="${p.images != null and !p.images.isEmpty()}"
                         src="/images/no-image.png" alt=""/>
                </div>
                <div class="p-card__body">
                    <p class="p-card__name" th:text="${p.name}"></p>

                    <!-- Còn sale: giá gốc gạch ngang + giá sau giảm -->
                    <p th:if="${sale != null}" class="p-card__price mb-0">
                        <span class="p-card__price-original"
                              th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></span>
                        <span th:text="${#numbers.formatInteger(
                                p.price - (p.price * sale.discountPercent / 100), 0, 'COMMA') + ' đ'}"></span>
                    </p>
                    <!-- Không sale: giá thường -->
                    <p th:unless="${sale != null}" class="p-card__price mb-0"
                       th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></p>
                </div>
            </a>
        </div>
    </div>

    <!-- ═══ PHÂN TRANG ═══
         Dùng nguyên class .pagination của shop-layout.html (đã theo tông
         đen-trắng flat sẵn, giống dãy số đơn giản của /san-pham thật). -->
    <div th:if="${totalPages > 1}"
         class="d-flex justify-content-center mt-5">
        <nav>
            <ul class="pagination">
                <li class="page-item"
                    th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/shop(page=${currentPage-1},
                                       keyword=${keyword},
                                       sort=${sort},
                                       category=${selectedCategory})}">←</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                    class="page-item"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{/shop(page=${i},
                                       keyword=${keyword},
                                       sort=${sort},
                                       category=${selectedCategory})}"
                       th:text="${i + 1}"></a>
                </li>
                <li class="page-item"
                    th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/shop(page=${currentPage+1},
                                       keyword=${keyword},
                                       sort=${sort},
                                       category=${selectedCategory})}">→</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
