<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${product.name}"></title></head>
<body>
<div class="container">
    <div class="row">
        <!-- ==================== ẢNH SẢN PHẨM ==================== -->
        <div class="col-md-6">
            <div th:if="${product.images != null and !product.images.isEmpty()}">
                <div id="productCarousel" class="carousel slide mb-2" data-bs-ride="false">
                    <div class="carousel-inner">
                        <div th:each="img, i : ${product.images}"
                             th:classappend="${i.index == 0} ? 'active'"
                             class="carousel-item">
                            <img th:src="${img.imageUrl}"
                                 class="d-block w-100 rounded"
                                 style="height:450px;object-fit:cover"/>
                        </div>
                    </div>
                    <div th:if="${product.images.size() > 1}">
                        <button class="carousel-control-prev" type="button"
                                data-bs-target="#productCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>
                        <button class="carousel-control-next" type="button"
                                data-bs-target="#productCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>
                    </div>
                </div>
                <!-- Thumbnails -->
                <div th:if="${product.images.size() > 1}" class="d-flex gap-2 flex-wrap">
                    <img th:each="img, i : ${product.images}"
                         th:src="${img.imageUrl}"
                         th:attr="data-index=${i.index}"
                         class="rounded border border-2"
                         style="width:70px;height:70px;object-fit:cover;cursor:pointer;opacity:0.6"/>
                </div>
            </div>
            <img th:unless="${product.images != null and !product.images.isEmpty()}"
                 src="/images/no-image.png"
                 class="img-fluid rounded" style="height:450px;object-fit:cover;width:100%"/>
        </div>

        <!-- ==================== THÔNG TIN SẢN PHẨM ==================== -->
        <div class="col-md-6">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/shop}">Shop</a></li>
                    <li class="breadcrumb-item active" th:text="${product.name}"></li>
                </ol>
            </nav>

            <h2 class="fw-bold" th:text="${product.name}"></h2>
            <p class="text-muted mb-1"
               th:text="${product.category != null ? product.category.name : ''}"></p>

            <!-- Giá — thay đổi theo variant được chọn -->
            <h3 class="text-danger fw-bold my-3" id="displayPrice"
                th:text="${#numbers.formatInteger(product.price, 0, 'COMMA') + ' đ'}"></h3>

            <hr/>

            <!-- ==================== CHỌN MÀU ==================== -->
            <div class="mb-3" id="colorSection">
                <small class="text-muted d-block mb-2 fw-bold">Màu sắc:</small>
                <div id="colorBtns" class="d-flex gap-2 flex-wrap"></div>
            </div>

            <!-- ==================== CHỌN SIZE ==================== -->
            <div class="mb-3" id="sizeSection">
                <small class="text-muted d-block mb-2 fw-bold">Size:</small>
                <div id="sizeBtns" class="d-flex gap-2 flex-wrap"></div>
            </div>

            <!-- Tình trạng tồn kho -->
            <div class="mb-3">
                <span id="stockBadge" class="badge bg-secondary">Chọn size và màu</span>
            </div>

            <p class="text-muted" th:text="${product.description}"></p>

            <hr/>

            <!-- Form thêm vào giỏ -->
            <form th:action="@{/cart/add}" method="post" id="addToCartForm">
                <input type="hidden" name="productId" th:value="${product.id}"/>
                <input type="hidden" name="variantId" id="selectedVariantId" value=""/>

                <div class="d-flex gap-2 align-items-center mb-3">
                    <label class="form-label mb-0 fw-bold">Số lượng:</label>
                    <div class="input-group" style="width:130px">
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="changeQty(-1)">-</button>
                        <input type="number" id="qtyInput" name="quantity"
                               value="1" min="1" max="1"
                               class="form-control text-center"/>
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="changeQty(1)">+</button>
                    </div>
                </div>

                <button type="submit" id="addToCartBtn"
                        class="btn btn-dark w-100 py-2" disabled>
                    <i class="bi bi-cart-plus me-2"></i>Chọn size và màu trước
                </button>
            </form>

            <!-- Validate trước khi submit -->
            <div id="variantError" class="text-danger small mt-2" style="display:none">
                Vui lòng chọn size và màu sắc!
            </div>
        </div>
    </div>

    <!-- ==================== SẢN PHẨM LIÊN QUAN ==================== -->
    <div th:if="${relatedProducts != null and !relatedProducts.isEmpty()}" class="mt-5">
        <h4 class="mb-3 fw-bold">Sản phẩm liên quan</h4>
        <div class="row row-cols-2 row-cols-md-4 g-4">
            <div class="col" th:each="p : ${relatedProducts}">
                <a th:href="@{'/product/' + ${p.id}}" class="text-decoration-none text-dark">
                    <div class="card h-100 border-0 shadow-sm"
                         style="cursor:pointer;transition:transform 0.2s"
                         onmouseover="this.style.transform='translateY(-4px)'"
                         onmouseout="this.style.transform='translateY(0)'">
                        <img th:if="${p.images != null and !p.images.isEmpty()}"
                             th:src="${p.images[0].imageUrl}"
                             class="card-img-top" style="height:220px;object-fit:cover"/>
                        <img th:unless="${p.images != null and !p.images.isEmpty()}"
                             src="/images/no-image.png"
                             class="card-img-top" style="height:220px;object-fit:cover"/>
                        <div class="card-body">
                            <h6 class="card-title" th:text="${p.name}"></h6>
                            <p class="text-danger fw-bold mb-0"
                               th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // ── Dữ liệu variant từ server ──────────────────────────────────
    const variants     = /*[[${variantData}]]*/ [];
    const basePrice    = /*[[${product.price}]]*/ 0;

    let selectedColorId = null;
    let selectedSizeId  = null;
    let selectedVariant = null;

    // ── Khởi tạo ──────────────────────────────────────────────────

    function init() {
        // Lấy danh sách màu unique
        const colorMap = new Map();
        variants.forEach(v => {
            if (v.color && !colorMap.has(v.color.id)) {
                colorMap.set(v.color.id, v.color.name);
            }
        });

        // Render nút màu
        const colorDiv = document.getElementById('colorBtns');
        if (colorMap.size === 0) {
            document.getElementById('colorSection').style.display = 'none';
        }
        colorMap.forEach((name, id) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-sm btn-outline-dark';
            btn.textContent = name;
            btn.dataset.colorId = id;
            btn.onclick = () => selectColor(id, btn);
            colorDiv.appendChild(btn);
        });

        // Nếu chỉ có 1 màu → tự chọn
        if (colorMap.size === 1) {
            const firstBtn = colorDiv.querySelector('button');
            selectColor(parseInt(firstBtn.dataset.colorId), firstBtn);
        }

        // Render nút size ban đầu (tất cả size của product)
        renderSizes(null);
    }

    // ── Chọn màu ──────────────────────────────────────────────────

    function selectColor(colorId, btn) {
        selectedColorId = colorId;
        selectedSizeId  = null;
        selectedVariant = null;

        // Highlight nút màu
        document.querySelectorAll('#colorBtns button').forEach(b => {
            b.classList.remove('btn-dark');
            b.classList.add('btn-outline-dark');
        });
        btn.classList.remove('btn-outline-dark');
        btn.classList.add('btn-dark');

        // Render lại size theo màu đã chọn
        renderSizes(colorId);
        updateUI();
    }

    // ── Render size ────────────────────────────────────────────────

    function renderSizes(colorId) {
        const sizeDiv = document.getElementById('sizeBtns');
        sizeDiv.innerHTML = '';

        // Lọc variant theo màu (nếu có)
        const filtered = colorId
            ? variants.filter(v => v.color && v.color.id === colorId)
            : variants;

        // Lấy size unique
        const sizeMap = new Map();
        filtered.forEach(v => {
            if (v.size && !sizeMap.has(v.size.id)) {
                sizeMap.set(v.size.id, { name: v.size.name, stock: v.stock });
            }
        });

        if (sizeMap.size === 0) {
            document.getElementById('sizeSection').style.display = 'none';
            return;
        }
        document.getElementById('sizeSection').style.display = '';

        sizeMap.forEach((info, id) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.sizeId = id;

            if (info.stock === 0) {
                btn.className = 'btn btn-sm btn-outline-secondary';
                btn.style.textDecoration = 'line-through';
                btn.style.opacity = '0.5';
                btn.disabled = true;
                btn.title = 'Hết hàng';
            } else {
                btn.className = 'btn btn-sm btn-outline-dark';
                btn.onclick = () => selectSize(id, btn);
            }
            btn.textContent = info.name;
            sizeDiv.appendChild(btn);
        });
    }

    // ── Chọn size ─────────────────────────────────────────────────

    function selectSize(sizeId, btn) {
        selectedSizeId = sizeId;

        // Highlight nút size
        document.querySelectorAll('#sizeBtns button').forEach(b => {
            b.classList.remove('btn-dark');
            b.classList.add('btn-outline-dark');
        });
        btn.classList.remove('btn-outline-dark');
        btn.classList.add('btn-dark');

        // Tìm variant khớp
        selectedVariant = variants.find(v =>
            (!selectedColorId || (v.color && v.color.id === selectedColorId)) &&
            (v.size && v.size.id === selectedSizeId)
        ) || null;

        updateUI();
    }

    // ── Cập nhật UI theo variant đã chọn ──────────────────────────

    function updateUI() {
        const stockBadge  = document.getElementById('stockBadge');
        const addBtn      = document.getElementById('addToCartBtn');
        const variantInput= document.getElementById('selectedVariantId');
        const qtyInput    = document.getElementById('qtyInput');
        const priceEl     = document.getElementById('displayPrice');

        if (!selectedVariant) {
            stockBadge.className  = 'badge bg-secondary';
            stockBadge.textContent= 'Chọn size và màu';
            addBtn.disabled       = true;
            addBtn.textContent    = 'Chọn size và màu trước';
            variantInput.value    = '';
            return;
        }

        // Cập nhật giá
        const adj = selectedVariant.priceAdjustment || 0;
        const actualPrice = basePrice + adj;
        priceEl.textContent = actualPrice.toLocaleString('vi-VN') + ' đ';

        // Cập nhật stock
        const stock = selectedVariant.stock;
        if (stock > 0) {
            stockBadge.className   = 'badge bg-success';
            stockBadge.textContent = 'Còn ' + stock + ' sản phẩm';
            addBtn.disabled        = false;
            addBtn.innerHTML       = '<i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ hàng';
            qtyInput.max           = stock;
            if (parseInt(qtyInput.value) > stock) qtyInput.value = stock;
        } else {
            stockBadge.className   = 'badge bg-danger';
            stockBadge.textContent = 'Hết hàng';
            addBtn.disabled        = true;
            addBtn.innerHTML       = '<i class="bi bi-x-circle me-2"></i>Hết hàng';
        }

        variantInput.value = selectedVariant.id;
    }

    // ── Validate trước submit ──────────────────────────────────────

    document.getElementById('addToCartForm').addEventListener('submit', function(e) {
        const variantId = document.getElementById('selectedVariantId').value;
        if (!variantId) {
            e.preventDefault();
            document.getElementById('variantError').style.display = 'block';
        } else {
            document.getElementById('variantError').style.display = 'none';
        }
    });

    // ── Tăng giảm số lượng ────────────────────────────────────────

    function changeQty(delta) {
        const input = document.getElementById('qtyInput');
        const max   = parseInt(input.max) || 1;
        let val     = parseInt(input.value) + delta;
        if (val < 1)   val = 1;
        if (val > max) val = max;
        input.value = val;
    }

    // ── Thumbnail carousel ─────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', function() {
        init();

        const carouselEl = document.getElementById('productCarousel');
        if (!carouselEl) return;

        const carousel = new bootstrap.Carousel(carouselEl, { ride: false });

        document.querySelectorAll('[data-index]').forEach(thumb => {
            thumb.addEventListener('click', function() {
                carousel.to(parseInt(this.dataset.index));
                updateThumbnail(parseInt(this.dataset.index));
            });
        });

        carouselEl.addEventListener('slid.bs.carousel', e => updateThumbnail(e.to));

        function updateThumbnail(index) {
            document.querySelectorAll('[data-index]').forEach(img => {
                img.style.opacity = '0.5';
                img.style.border  = '2px solid transparent';
            });
            const active = document.querySelector('[data-index="' + index + '"]');
            if (active) {
                active.style.opacity = '1';
                active.style.border  = '2px solid #000';
            }
        }
        updateThumbnail(0);
    });
</script>
</body>
</html>
