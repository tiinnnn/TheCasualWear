<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${product.name}"></title></head>
<body>
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <div class="d-flex gap-2 align-items-start pdp-gallery">
                <div style="position:relative;flex-shrink:0">
                    <button id="thumb-prev" onclick="scrollThumbs(-1)"
                            style="display:none;position:absolute;top:0;left:50%;transform:translateX(-50%);
                                   z-index:2;background:var(--paper,#fff);border:1px solid var(--line,#e5e2dc);
                                   width:70px;height:20px;cursor:pointer;font-size:.7rem;
                                   align-items:center;justify-content:center">
                        <i class="bi bi-chevron-up"></i>
                    </button>
                    <div id="thumbnailRow" class="pdp-thumb-col"></div>
                    <button id="thumb-next" onclick="scrollThumbs(1)"
                            style="display:none;position:absolute;bottom:0;left:50%;transform:translateX(-50%);
                                   z-index:2;background:var(--paper,#fff);border:1px solid var(--line,#e5e2dc);
                                   width:70px;height:20px;cursor:pointer;font-size:.7rem;
                                   align-items:center;justify-content:center">
                        <i class="bi bi-chevron-down"></i>
                    </button>
                </div>

                <!-- Ảnh chính -->
                <div id="productCarousel" class="carousel slide flex-grow-1" data-bs-ride="false">
                    <div class="carousel-inner">

                        <div th:each="img, i : ${product.images}"
                             th:classappend="${i.index == 0} ? 'active'"
                             class="carousel-item"
                             th:attr="data-type='product'">
                            <img th:src="${img.imageUrl}"
                                 class="d-block w-100 pdp-main-img carousel-zoomable"
                                 style="cursor:zoom-in"/>
                        </div>

                        <th:block th:each="v : ${variants}">
                            <div th:each="img : ${v.images}"
                                 class="carousel-item"
                                 th:attr="data-type='variant',
                                          data-color-id=${v.color != null ? v.color.id : 0},
                                          data-variant-id=${v.id}">
                                <img th:src="${img.imageUrl}"
                                     class="d-block w-100 pdp-main-img carousel-zoomable"
                                     style="cursor:zoom-in"/>
                            </div>
                        </th:block>

                        <!-- Fallback nếu không có ảnh nào -->
                        <div th:if="${(product.images == null or product.images.isEmpty())}"
                             class="carousel-item active"
                             th:unless="${variants != null and !variants.isEmpty() and variants[0].images != null and !variants[0].images.isEmpty()}">
                            <img src="/images/no-image.png"
                                 class="d-block w-100 pdp-main-img"/>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button"
                            data-bs-target="#productCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button"
                            data-bs-target="#productCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>

            <style>
                /* ── Gallery kiểu smaker.vn: thumbnail dọc, ảnh chính vuông, không bo góc ── */
                .pdp-main-img { height: 560px; object-fit: cover; }
                .pdp-thumb-col {
                    display: flex;
                    flex-direction: column;
                    gap: 6px;
                    width: 70px;
                    max-height: 560px;
                    overflow-y: auto;
                    scrollbar-width: none;
                    -ms-overflow-style: none;
                }
                .pdp-thumb-col::-webkit-scrollbar { display: none; }
                .thumb-img { border-radius: 0 !important; }
                @media (max-width: 767px) {
                    .pdp-main-img { height: 380px; }
                    .pdp-thumb-col { width: 54px; max-height: 380px; }
                }

                /* ── Cột thông tin sản phẩm — chữ hoa tracked-out, vuông vắn ── */
                .pdp-title {
                    font-size: 1.15rem;
                    font-weight: 700;
                    letter-spacing: .04em;
                    text-transform: uppercase;
                }
                .pdp-icon-btn {
                    width: 40px; height: 40px;
                    border: 1px solid var(--line, #e5e2dc);
                    background: var(--paper, #fff);
                    color: var(--ink, #111);
                    display: flex; align-items: center; justify-content: center;
                    transition: opacity .2s;
                }
                .pdp-icon-btn:hover { opacity: .6; }
                .pdp-category {
                    font-size: .72rem;
                    letter-spacing: .08em;
                    text-transform: uppercase;
                    color: var(--mute, #8a8a8a);
                    margin: .4rem 0 0;
                }
                .pdp-price {
                    font-size: .95rem;
                    font-weight: 600;
                    color: var(--ink, #111);
                }
                .pdp-price-strike {
                    font-size: .82rem;
                    color: var(--mute, #8a8a8a);
                    text-decoration: line-through;
                }
                .pdp-sale-badge {
                    font-size: .68rem;
                    font-weight: 700;
                    letter-spacing: .04em;
                    color: #c0392b;
                }
                .pdp-label {
                    font-size: .68rem;
                    font-weight: 700;
                    letter-spacing: .1em;
                    text-transform: uppercase;
                    color: var(--ink, #111);
                }
                .pdp-size-guide {
                    font-size: .68rem;
                    letter-spacing: .04em;
                    text-decoration: underline;
                    color: var(--mute, #8a8a8a);
                }
                .pdp-size-guide:hover { color: var(--ink, #111); }
                .pdp-stock {
                    font-size: .72rem;
                    letter-spacing: .04em;
                    color: var(--mute, #8a8a8a);
                }

                /* Nút màu / size do JS render — ép về style vuông, chữ hoa */
                #colorBtns .btn, #sizeBtns .btn {
                    border-radius: 0 !important;
                    font-size: .74rem !important;
                    letter-spacing: .04em;
                    text-transform: uppercase;
                    min-width: 44px;
                }
                #sizeBtns .btn {
                    min-width: 48px;
                    height: 40px;
                }
                #colorBtns .btn.btn-dark, #sizeBtns .btn.btn-dark {
                    background: var(--ink, #111) !important;
                    border-color: var(--ink, #111) !important;
                }
                #colorBtns .btn.btn-outline-dark, #sizeBtns .btn.btn-outline-dark {
                    color: var(--ink, #111);
                    border-color: var(--line, #e5e2dc);
                }

                .pdp-qty .btn { border-radius: 0; border-color: var(--line, #e5e2dc); color: var(--ink, #111); }
                .pdp-qty input { border-radius: 0; border-color: var(--line, #e5e2dc); }

                .pdp-add-btn {
                    width: 100%;
                    background: var(--ink, #111);
                    color: #fff;
                    border: none;
                    padding: .85rem 1rem;
                    font-size: .78rem;
                    font-weight: 700;
                    letter-spacing: .12em;
                    text-transform: uppercase;
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    transition: opacity .2s;
                }
                .pdp-add-btn:hover:not(:disabled) { opacity: .85; }
                .pdp-add-btn:disabled { background: var(--mute, #8a8a8a); }

                .pdp-accordion { border-top: 1px solid var(--line, #e5e2dc); }
                .pdp-accordion-toggle {
                    width: 100%;
                    background: none;
                    border: none;
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    padding: .85rem 0;
                    font-size: .72rem;
                    font-weight: 700;
                    letter-spacing: .1em;
                    text-transform: uppercase;
                    color: var(--ink, #111);
                    text-decoration: none;
                }
                .pdp-accordion-toggle .bi-chevron-down { transition: transform .2s; }
                .pdp-accordion-toggle[aria-expanded="false"] .bi-chevron-down { transform: rotate(-90deg); }
            </style>
        </div>
        <div class="col-md-6">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb align-items-center" style="font-size:0.82rem">
                    <li class="breadcrumb-item">
                        <a th:href="@{/}" class="text-decoration-none text-secondary"
                           style="transition:color .15s" onmouseover="this.style.color='#000'" onmouseout="this.style.color=''">
                            Trang chủ
                        </a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/shop}" class="text-decoration-none text-secondary"
                           style="transition:color .15s" onmouseover="this.style.color='#000'" onmouseout="this.style.color=''">
                            Shop
                        </a>
                    </li>
                    <li class="breadcrumb-item active fw-semibold" aria-current="page"
                        th:text="${product.name}"></li>
                </ol>
            </nav>

            <div class="d-flex align-items-start justify-content-between gap-3">
                <h1 class="pdp-title mb-0" th:text="${product.name}"></h1>

                <!-- Nút yêu thích — đã đăng nhập -->
                <form sec:authorize="isAuthenticated()"
                      th:action="@{/wishlist/toggle/{id}(id=${product.id})}"
                      method="post" class="flex-shrink-0">
                    <button type="submit"
                            class="pdp-icon-btn"
                            th:title="${isWishlisted} ? 'Bỏ yêu thích' : 'Thêm vào yêu thích'">
                        <i class="bi fs-5"
                           th:classappend="${isWishlisted} ? 'bi-heart-fill text-danger' : 'bi-heart'"></i>
                    </button>
                </form>

                <a sec:authorize="!isAuthenticated()"
                   th:href="@{/auth/login}"
                   class="pdp-icon-btn flex-shrink-0"
                   title="Đăng nhập để yêu thích">
                    <i class="bi bi-heart fs-5"></i>
                </a>
            </div>

            <p class="pdp-category" th:text="${product.category != null ? product.category.name : ''}"></p>

            <div th:if="${activeSale != null}" class="d-flex align-items-center gap-2 mt-2">
                <span class="pdp-sale-badge"
                      th:text="'-' + ${#numbers.formatDecimal(activeSale.discountPercent,1,0)} + '%'"></span>
                <span class="pdp-price-strike"
                      th:text="${#numbers.formatInteger(product.price, 0, 'COMMA') + ' đ'}"></span>
            </div>
            <p class="pdp-price mb-0"
               th:classappend="${activeSale != null} ? 'text-danger mt-1' : 'mt-2'"
               id="displayPrice"
               th:text="${#numbers.formatInteger(effectivePrice, 0, 'COMMA') + ' đ'}"></p>

            <div class="mt-4" id="colorSection">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="pdp-label">Màu sắc</span>
                </div>
                <div id="colorBtns" class="d-flex gap-2 flex-wrap pdp-color-row"></div>
            </div>

            <div class="mt-4" id="sizeSection">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="pdp-label">Kích thước</span>
                </div>
                <div id="sizeBtns" class="d-flex gap-2 flex-wrap pdp-size-row"></div>
            </div>

            <div class="mt-3">
                <span id="stockBadge" class="pdp-stock">Chọn size và màu</span>
            </div>

            <!-- Form thêm vào giỏ — chỉ cần variantId -->
            <form th:action="@{/cart/add}" method="post" id="addToCartForm" class="mt-3">
                <input type="hidden" name="variantId" id="selectedVariantId" value=""/>

                <div class="d-flex gap-3 align-items-center mb-3">
                    <span class="pdp-label mb-0">Số lượng</span>
                    <div class="input-group pdp-qty" style="width:130px">
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="changeQty(-1)">-</button>
                        <input type="number" id="qtyInput" name="quantity"
                               value="1" min="1" max="1"
                               class="form-control text-center"/>
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="changeQty(1)">+</button>
                    </div>
                </div>

                <button type="submit" id="addToCartBtn"
                        class="pdp-add-btn" disabled>
                    <span>Chọn size và màu trước</span>
                    <i class="bi bi-bag"></i>
                </button>
            </form>

            <div id="variantError" class="text-danger small mt-2" style="display:none">
                Vui lòng chọn size và màu sắc!
            </div>

            <!-- Details — thu gọn kiểu smaker.vn -->
            <div class="pdp-accordion mt-4">
                <button class="pdp-accordion-toggle" type="button"
                        data-bs-toggle="collapse" data-bs-target="#pdpDetails">
                    <span>Chi tiết</span>
                    <i class="bi bi-chevron-down"></i>
                </button>
                <div id="pdpDetails" class="collapse show">
                    <div class="product-description-container pt-2 pb-2">
                        <span id="rawDescription" th:text="${product.description}" style="display:none;"></span>
                        <div id="formattedDescription" class="product-description-content"></div>
                    </div>
                </div>
            </div>

            <div class="pdp-accordion">
                <a class="pdp-accordion-toggle" th:href="@{/chinh-sach-doi-tra}">
                    <span>Chính sách đổi trả</span>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </div>
        </div>
    </div>
    <!-- SẢN PHẨM LIÊN QUAN — kiểu "MORE LIKE THIS" của smaker.vn -->
    <div th:if="${relatedProducts != null and !relatedProducts.isEmpty()}" class="pdp-related mt-5 pt-4 border-top">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="pdp-related-title">Sản phẩm tương tự</span>
            <a th:if="${product.category != null}"
               th:href="@{/shop(category=${product.category.id})}"
               class="pdp-related-link">Xem tất cả <i class="bi bi-arrow-right"></i></a>
        </div>
        <div class="row row-cols-2 row-cols-md-4 g-4">
            <div class="col" th:each="p : ${relatedProducts}"
                 th:with="relSale=${relatedActiveSales != null ? relatedActiveSales.get(p.id) : null}">
                <a th:href="@{'/product/' + ${p.id}}" class="text-decoration-none pdp-related-card">
                    <div class="position-relative">
                        <span th:if="${relSale != null}"
                              class="pdp-sale-flag position-absolute"
                              th:text="'-' + ${#numbers.formatDecimal(relSale.discountPercent,1,0)} + '%'"></span>
                        <img th:if="${p.images != null and !p.images.isEmpty()}"
                             th:src="${p.images[0].imageUrl}"
                             class="pdp-related-img" />
                        <img th:unless="${p.images != null and !p.images.isEmpty()}"
                             src="/images/no-image.png"
                             class="pdp-related-img" />
                    </div>
                    <p class="pdp-related-name" th:text="${p.name}"></p>
                    <p th:if="${relSale != null}" class="pdp-related-price mb-0">
                        <span class="pdp-price-strike me-1"
                              th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></span>
                        <span class="text-danger"
                              th:text="${#numbers.formatInteger(
                                    p.price - (p.price * relSale.discountPercent / 100),
                                    0, 'COMMA') + ' đ'}"></span>
                    </p>
                    <p th:unless="${relSale != null}" class="pdp-related-price mb-0"
                       th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></p>
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .pdp-related-title {
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
    }
    .pdp-related-link {
        font-size: .7rem;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--ink, #111);
        text-decoration: none;
    }
    .pdp-related-link:hover { opacity: .6; }
    .pdp-related-card { display: block; color: var(--ink, #111); transition: opacity .2s; }
    .pdp-related-card:hover { opacity: .8; }
    .pdp-related-img { width: 100%; height: 260px; object-fit: cover; display: block; }
    .pdp-sale-flag {
        top: 8px; left: 8px; z-index: 2;
        background: #fff;
        color: #c0392b;
        font-size: .66rem;
        font-weight: 700;
        padding: .15rem .4rem;
    }
    .pdp-related-name {
        font-size: .68rem;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: var(--ink, #111);
        margin: .6rem 0 .2rem;
    }
    .pdp-related-price {
        font-size: .74rem;
        color: var(--mute, #8a8a8a);
    }
</style>

<script th:inline="javascript">
    const variants  = /*[[${variantData}]]*/ [];
    const basePrice = /*[[${effectivePrice}]]*/ 0; // đã áp sale nếu đang có sale chạy

    let selectedColorId = null;
    let selectedSizeId  = null;
    let selectedVariant = null;
    let carousel        = null;

    //  Xây bảng: colorId → index đầu tiên của variant đó trong carousel
    // Thymeleaf render: product.images trước, rồi variant images theo thứ tự variants
    // JS tính lại đúng index dựa trên data-color-id của từng carousel-item
    function buildColorIndexMap() {
        const items = document.querySelectorAll('#productCarousel .carousel-item');
        const map   = {};  // colorId → index đầu tiên
        items.forEach((el, idx) => {
            if (el.dataset.type === 'variant') {
                const cid = el.dataset.colorId;
                if (!(cid in map)) map[cid] = idx;  // chỉ lưu index đầu tiên
            }
        });
        return map;
    }

    function scrollThumbs(dir) {
        const row = document.getElementById('thumbnailRow');
        row.scrollBy({ top: dir * 160, behavior: 'smooth' });
    }
    window.scrollThumbs = scrollThumbs;

    function updateThumbArrows() {
        const row  = document.getElementById('thumbnailRow');
        const prev = document.getElementById('thumb-prev');
        const next = document.getElementById('thumb-next');
        if (!prev || !next) return;
        const scrollable = row.scrollHeight > row.clientHeight + 4;
        prev.style.display = scrollable ? 'flex' : 'none';
        next.style.display = scrollable ? 'flex' : 'none';
    }

    // Khởi tạo thumbnails từ carousel items
    function buildThumbnails() {
        const items    = document.querySelectorAll('#productCarousel .carousel-item');
        const thumbRow = document.getElementById('thumbnailRow');
        thumbRow.innerHTML = '';

        if (items.length <= 1) return;

        items.forEach((el, idx) => {
            const img = el.querySelector('img');
            if (!img) return;
            const thumb = document.createElement('img');
            thumb.src               = img.src;
            thumb.dataset.index     = idx;
            thumb.className         = 'border thumb-img';
            thumb.style.cssText     = 'width:100%;aspect-ratio:1/1;object-fit:cover;cursor:pointer;opacity:0.6;flex-shrink:0';
            thumb.addEventListener('click', function () {
                carousel.to(idx);
                highlightThumb(idx);
            });
            thumbRow.appendChild(thumb);
        });
        setTimeout(updateThumbArrows, 50);
    }

    function highlightThumb(index) {
        document.querySelectorAll('.thumb-img').forEach(img => {
            img.style.opacity = '0.6';
            img.style.border  = '2px solid transparent';
        });
        const active = document.querySelector(`.thumb-img[data-index="${index}"]`);
        if (active) {
            active.style.opacity = '1';
            active.style.border  = '2px solid #000';
            // Scroll thumbnail vào view
            active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        }
    }

    function init() {
        const carouselEl = document.getElementById('productCarousel');
        carousel = new bootstrap.Carousel(carouselEl, { ride: false });
        buildThumbnails();
        carouselEl.addEventListener('slid.bs.carousel', e => highlightThumb(e.to));
        highlightThumb(0);

        // Nút màu
        const colorMap = new Map();
        variants.forEach(v => {
            if (v.color && !colorMap.has(v.color.id))
                colorMap.set(v.color.id, v.color.name);
        });

        const colorDiv = document.getElementById('colorBtns');
        if (colorMap.size === 0) {
            document.getElementById('colorSection').style.display = 'none';
        }
        colorMap.forEach((name, id) => {
            const btn = document.createElement('button');
            btn.type            = 'button';
            btn.className       = 'btn btn-sm btn-outline-dark';
            btn.textContent     = name;
            btn.dataset.colorId = id;
            btn.onclick         = () => selectColor(id, btn);
            colorDiv.appendChild(btn);
        });

        // Tự chọn màu đầu tiên nếu chỉ có 1 màu
        if (colorMap.size === 1) {
            const firstBtn = colorDiv.querySelector('button');
            selectColor(parseInt(firstBtn.dataset.colorId), firstBtn);
        }

        renderSizes(null);
    }

    // Chọn màu
    function selectColor(colorId, btn) {
        selectedColorId = colorId;
        // KHÔNG reset selectedSizeId — giữ nguyên size người dùng đã chọn

        // Highlight nút màu
        document.querySelectorAll('#colorBtns button').forEach(b => {
            b.classList.remove('btn-dark');
            b.classList.add('btn-outline-dark');
        });
        btn.classList.remove('btn-outline-dark');
        btn.classList.add('btn-dark');

        // Đến ảnh đầu tiên của màu này trong slideshow
        const colorIndexMap = buildColorIndexMap();
        const targetIndex   = colorIndexMap[colorId];
        if (targetIndex !== undefined) {
            carousel.to(targetIndex);
            highlightThumb(targetIndex);
        }

        // Cập nhật trạng thái size (không rebuild lại list)
        renderSizes(colorId);

        // Cập nhật selectedVariant theo color + size hiện tại
        if (selectedSizeId) {
            selectedVariant = variants.find(v =>
                v.color && v.color.id === selectedColorId &&
                v.size  && v.size.id  === selectedSizeId
            ) || null;
        } else {
            selectedVariant = null;
        }

        updateUI();
    }

    const SIZE_ORDER = ['None', 'Free Size', 'XS', 'S', 'M', 'L', 'XL', 'XXL',
                        '3XL', '4XL', '5XL'];
    function sizeRank(name) {
        const idx = SIZE_ORDER.indexOf(name);
        return idx === -1 ? 99 : idx;
    }

    // ── Render size (union tất cả variant, state theo màu đang chọn) ──
    function renderSizes(colorId) {
        const sizeDiv = document.getElementById('sizeBtns');

        // Build union tất cả sizes từ mọi variant
        const allSizeMap = new Map();
        variants.forEach(v => {
            if (v.size && !allSizeMap.has(v.size.id))
                allSizeMap.set(v.size.id, v.size.name);
        });

        if (allSizeMap.size === 0) {
            document.getElementById('sizeSection').style.display = 'none';
            return;
        }
        document.getElementById('sizeSection').style.display = '';

        const sorted = [...allSizeMap.entries()]
            .sort((a, b) => sizeRank(a[1]) - sizeRank(b[1]));

        // Nếu đã có nút rồi thì chỉ update state, không rebuild
        const existingBtns = sizeDiv.querySelectorAll('button');
        if (existingBtns.length === sorted.length) {
            // Chỉ cập nhật trạng thái từng nút
            existingBtns.forEach((btn, i) => {
                const [id, name] = sorted[i];
                _applySizeState(btn, id, name, colorId);
            });
            return;
        }

        // Build lần đầu
        sizeDiv.innerHTML = '';
        sorted.forEach(([id, name]) => {
            const btn = document.createElement('button');
            btn.type           = 'button';
            btn.dataset.sizeId = id;
            _applySizeState(btn, id, name, colorId);
            sizeDiv.appendChild(btn);
        });
    }

    function _applySizeState(btn, sizeId, sizeName, colorId) {
        // Tìm variant khớp color + size
        const match = colorId
            ? variants.find(v => v.color && v.color.id === colorId
                               && v.size  && v.size.id  === sizeId)
            : variants.find(v => v.size && v.size.id === sizeId);

        btn.textContent     = sizeName;
        btn.dataset.sizeId  = sizeId;

        if (!match) {
            // Size không tồn tại trong color này → in mờ gạch ngang
            btn.className            = 'btn btn-sm btn-outline-secondary';
            btn.style.textDecoration = 'line-through';
            btn.style.opacity        = '0.4';
            btn.disabled             = true;
            btn.title                = 'Không có trong màu này';
            btn.onclick              = null;
        } else if (match.stock === 0) {
            // Có variant nhưng hết hàng
            btn.className            = 'btn btn-sm btn-outline-secondary';
            btn.style.textDecoration = 'line-through';
            btn.style.opacity        = '0.5';
            btn.disabled             = true;
            btn.title                = 'Hết hàng';
            btn.onclick              = null;
        } else {
            // Có hàng
            btn.className            = 'btn btn-sm btn-outline-dark';
            btn.style.textDecoration = '';
            btn.style.opacity        = '1';
            btn.disabled             = false;
            btn.title                = '';
            btn.onclick              = () => selectSize(sizeId, btn);
        }

        // Giữ highlight nếu đang được chọn
        if (sizeId === selectedSizeId && !btn.disabled) {
            btn.classList.remove('btn-outline-dark');
            btn.classList.add('btn-dark');
        }
    }

    function selectSize(sizeId, btn) {
        selectedSizeId = sizeId;

        document.querySelectorAll('#sizeBtns button').forEach(b => {
            b.classList.remove('btn-dark');
            b.classList.add('btn-outline-dark');
        });
        btn.classList.remove('btn-outline-dark');
        btn.classList.add('btn-dark');

        selectedVariant = variants.find(v =>
            (!selectedColorId || (v.color && v.color.id === selectedColorId)) &&
            (v.size && v.size.id === selectedSizeId)
        ) || null;
        if (selectedColorId && selectedVariant) {
            goToVariantImage(selectedColorId, selectedVariant.id);
        }

        updateUI();
    }

    function goToVariantImage(colorId, variantId) {
        const items = document.querySelectorAll('#productCarousel .carousel-item');
        let targetIdx = -1;

        // Ưu tiên 1: tìm item có data-variant-id = variantId
        items.forEach((el, idx) => {
            if (targetIdx === -1 && el.dataset.variantId == variantId) {
                targetIdx = idx;
            }
        });
        // Ưu tiên 2: fallback về ảnh đầu tiên của màu
        if (targetIdx === -1) {
            items.forEach((el, idx) => {
                if (targetIdx === -1
                        && el.dataset.type === 'variant'
                        && el.dataset.colorId == colorId) {
                    targetIdx = idx;
                }
            });
        }

        if (targetIdx !== -1) {
            carousel.to(targetIdx);
            highlightThumb(targetIdx);
        }
    }
    function updateUI() {
        const stockBadge   = document.getElementById('stockBadge');
        const addBtn       = document.getElementById('addToCartBtn');
        const variantInput = document.getElementById('selectedVariantId');
        const qtyInput     = document.getElementById('qtyInput');
        const priceEl      = document.getElementById('displayPrice');

        if (!selectedVariant) {
            stockBadge.className   = 'badge bg-secondary';
            stockBadge.textContent = 'Chọn size và màu';
            addBtn.disabled        = true;
            addBtn.textContent     = 'Chọn size và màu trước';
            variantInput.value     = '';
            return;
        }

        priceEl.textContent = basePrice.toLocaleString('vi-VN') + ' đ';

        const stock = selectedVariant.stock;
        if (stock > 0) {
            stockBadge.className   = 'badge bg-success';
            stockBadge.textContent = 'Còn ' + stock + ' sản phẩm';
            addBtn.disabled        = false;
            addBtn.innerHTML       = '<i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ hàng';
            qtyInput.max           = stock;
            if (parseInt(qtyInput.value) > stock) qtyInput.value = stock;
        } else {
            stockBadge.className   = 'badge bg-danger';
            stockBadge.textContent = 'Hết hàng';
            addBtn.disabled        = true;
            addBtn.innerHTML       = '<i class="bi bi-x-circle me-2"></i>Hết hàng';
        }
        variantInput.value = selectedVariant.id;
    }

    document.getElementById('addToCartForm').addEventListener('submit', function (e) {
        if (!document.getElementById('selectedVariantId').value) {
            e.preventDefault();
            document.getElementById('variantError').style.display = 'block';
        } else {
            document.getElementById('variantError').style.display = 'none';
        }
    });

    function changeQty(delta) {
        const input = document.getElementById('qtyInput');
        const max   = parseInt(input.max) || 1;
        let val     = parseInt(input.value) + delta;
        if (val < 1)   val = 1;
        if (val > max) val = max;
        input.value = val;
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

<!-- Lightbox HTML -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Phóng to ảnh">
    <div id="lb-backdrop"></div>
    <div id="lb-img-wrap">
        <img id="lb-img" src="" alt=""/>
    </div>
    <div id="lb-hint">Cuộn để zoom · Kéo để di chuyển · ESC để đóng</div>
    <button id="lb-close"  title="Đóng"><i class="bi bi-x-lg"></i></button>
    <button id="lb-prev"   class="lb-arrow" title="Ảnh trước"><i class="bi bi-chevron-left"></i></button>
    <button id="lb-next"   class="lb-arrow" title="Ảnh tiếp theo"><i class="bi bi-chevron-right"></i></button>
    <div id="lb-controls">
        <button class="lb-btn" id="lb-reset" title="Reset zoom"><i class="bi bi-arrow-counterclockwise"></i></button>
        <button class="lb-btn" id="lb-out"   title="Thu nhỏ"><i class="bi bi-dash-lg"></i></button>
        <span   id="lb-zoom-level">100%</span>
        <button class="lb-btn" id="lb-in"    title="Phóng to"><i class="bi bi-plus-lg"></i></button>
        <div class="lb-sep"></div>
        <span id="lb-counter">1 / 1</span>
    </div>
</div>

<script>
    (function () {
      const lb        = document.getElementById('lightbox');
      const lbImg     = document.getElementById('lb-img');
      const lbWrap    = document.getElementById('lb-img-wrap');
      const lbLevel   = document.getElementById('lb-zoom-level');
      const lbCounter = document.getElementById('lb-counter');
      const lbPrev    = document.getElementById('lb-prev');
      const lbNext    = document.getElementById('lb-next');

      let allSrcs   = [];   // danh sách src từ tất cả carousel-item
      let curIdx    = 0;
      let scale     = 1;
      let tx = 0, ty = 0;
      let dragging  = false, dragSX, dragSY, dragTX, dragTY;
      let maxScale  = 5;

      /* ── Collect all carousel image srcs ── */
      function collectSrcs() {
        allSrcs = [];
        document.querySelectorAll('#productCarousel .carousel-item img').forEach(img => {
          allSrcs.push(img.src);
        });
      }

      /* ── Open ── */
      function openLightbox(startIdx) {
        collectSrcs();
        curIdx = startIdx;
        scale = 1; tx = 0; ty = 0;
        showSlide(curIdx, false);
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      /* ── Close ── */
      function closeLightbox() {
        lb.classList.remove('open');
        document.body.style.overflow = '';
        // Sync bootstrap carousel to current lightbox slide
        if (window._lbCarousel) window._lbCarousel.to(curIdx);
        const thumbs = document.querySelectorAll('.thumb-img');
        if (typeof highlightThumb === 'function') highlightThumb(curIdx);
      }

      /* ── Show slide (with optional fade) ── */
      function showSlide(idx, animate) {
        if (animate) {
          lbImg.style.opacity = '0';
          setTimeout(() => {
            lbImg.src = allSrcs[idx];
            scale = 1; tx = 0; ty = 0;
            applyTransform();
            lbImg.style.opacity = '1';
          }, 120);
        } else {
          lbImg.src = allSrcs[idx];
          applyTransform();
        }
        lbCounter.textContent = (idx + 1) + ' / ' + allSrcs.length;
        lbPrev.classList.toggle('hidden', allSrcs.length <= 1);
        lbNext.classList.toggle('hidden', allSrcs.length <= 1);
      }

      /* ── Navigate ── */
      lbPrev.onclick = e => {
        e.stopPropagation();
        curIdx = (curIdx - 1 + allSrcs.length) % allSrcs.length;
        showSlide(curIdx, true);
      };
      lbNext.onclick = e => {
        e.stopPropagation();
        curIdx = (curIdx + 1) % allSrcs.length;
        showSlide(curIdx, true);
      };

      /* ── Transform ── */
      function applyTransform() {
        lbImg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        lbLevel.textContent   = Math.round(scale * 100) + '%';
      }

      function clampTranslate() {
        const maxTX = Math.max(0, (scale - 1) * lbImg.offsetWidth  / 2 + 40);
        const maxTY = Math.max(0, (scale - 1) * lbImg.offsetHeight / 2 + 40);
        tx = Math.max(-maxTX, Math.min(maxTX, tx));
        ty = Math.max(-maxTY, Math.min(maxTY, ty));
      }

      function changeScale(delta, cx, cy) {
        const prev = scale;
        scale = Math.max(1, Math.min(maxScale, scale + delta));
        if (cx !== undefined && prev !== scale) {
          const r    = scale / prev;
          const rect = lbWrap.getBoundingClientRect();
          const ox   = cx - rect.left - rect.width  / 2;
          const oy   = cy - rect.top  - rect.height / 2;
          tx = ox + (tx - ox) * r;
          ty = oy + (ty - oy) * r;
        }
        if (scale === 1) { tx = 0; ty = 0; }
        clampTranslate();
        applyTransform();
      }

      /* ── Wheel zoom ── */
      lbWrap.addEventListener('wheel', e => {
        e.preventDefault();
        changeScale(e.deltaY < 0 ? 0.2 : -0.2, e.clientX, e.clientY);
      }, { passive: false });

      /* ── Button controls ── */
      document.getElementById('lb-in').onclick    = e => { e.stopPropagation(); changeScale(0.3); };
      document.getElementById('lb-out').onclick   = e => { e.stopPropagation(); changeScale(-0.3); };
      document.getElementById('lb-reset').onclick = e => {
        e.stopPropagation();
        scale = 1; tx = 0; ty = 0; applyTransform();
      };

      /* ── Drag (only when zoomed) ── */
      lbWrap.addEventListener('mousedown', e => {
        if (scale <= 1) return;
        dragging = true;
        dragSX = e.clientX; dragSY = e.clientY;
        dragTX = tx;        dragTY = ty;
        lbWrap.classList.add('dragging');
        e.preventDefault();
      });
      window.addEventListener('mousemove', e => {
        if (!dragging) return;
        tx = dragTX + (e.clientX - dragSX);
        ty = dragTY + (e.clientY - dragSY);
        clampTranslate();
        applyTransform();
      });
      window.addEventListener('mouseup', () => {
        dragging = false;
        lbWrap.classList.remove('dragging');
      });

      /* ── Touch pinch zoom ── */
      let lastDist = null;
      lbWrap.addEventListener('touchstart', e => {
        if (e.touches.length === 2)
          lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                e.touches[0].clientY - e.touches[1].clientY);
      }, { passive: true });
      lbWrap.addEventListener('touchmove', e => {
        if (e.touches.length !== 2) return;
        e.preventDefault();
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                e.touches[0].clientY - e.touches[1].clientY);
        if (lastDist) changeScale((dist - lastDist) * 0.012);
        lastDist = dist;
      }, { passive: false });
      lbWrap.addEventListener('touchend', () => { lastDist = null; });

      /* ── Keyboard ── */
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape')     closeLightbox();
        if (e.key === 'ArrowRight') lbNext.click();
        if (e.key === 'ArrowLeft')  lbPrev.click();
        if (e.key === '+')          changeScale(0.3);
        if (e.key === '-')          changeScale(-0.3);
      });

      /* ── Close triggers ── */
      document.getElementById('lb-close').onclick    = e => { e.stopPropagation(); closeLightbox(); };
      document.getElementById('lb-backdrop').onclick = () => closeLightbox();

      /* ── Attach to carousel (DOMContentLoaded) ── */
      document.addEventListener('DOMContentLoaded', () => {
        // Save reference to Bootstrap carousel instance (set in init())
        const carouselEl = document.getElementById('productCarousel');
        carouselEl.addEventListener('click', e => {
          const img = e.target.closest('.carousel-zoomable');
          if (!img) return;
          // Figure out which index this img is in our list
          collectSrcs();
          const items = [...document.querySelectorAll('#productCarousel .carousel-item img')];
          const idx   = items.indexOf(img);
          openLightbox(idx >= 0 ? idx : 0);
        });
        // Expose carousel instance so closeLightbox can sync
        carouselEl.addEventListener('slid.bs.carousel', e => {
          window._lbCarousel = bootstrap.Carousel.getInstance(carouselEl);
        });
        window._lbCarousel = null;
        // Wait for init() to create the carousel instance
        setTimeout(() => {
          window._lbCarousel = bootstrap.Carousel.getInstance(carouselEl);
        }, 300);
      });
    })();

    document.addEventListener('DOMContentLoaded', function() {
    const rawTextEl = document.getElementById('rawDescription');
    const outputEl = document.getElementById('formattedDescription');

    if (rawTextEl && outputEl) {
        const rawText = rawTextEl.textContent;
        const lines = rawText.split('\n');
        let htmlResult = '';
        let inList = false;

        lines.forEach(line => {
            let trimmed = line.trim();
            if (!trimmed) return; // Bỏ qua dòng trống

            // Kiểm tra nếu dòng bắt đầu bằng các dấu gạch ngang, dấu chấm tròn, hoặc dấu sao
            if (trimmed.startsWith('-') || trimmed.startsWith('•') || trimmed.startsWith('*')) {
                if (!inList) {
                    htmlResult += '<ul class="ps-3 mb-3" style="list-style-type: disc;">';
                    inList = true;
                }

                // Cắt bỏ ký tự dấu chấm/gạch ở đầu dòng
                let content = trimmed.substring(1).trim();

                // Tự động tìm dấu hai chấm ":" để in đậm phần nhãn (Ví dụ: Chất liệu:)
                if (content.includes(':')) {
                    let parts = content.split(':');
                    let label = parts[0].trim();
                    let rest = parts.slice(1).join(':').trim();
                    content = `<strong>${label}:</strong> ${rest}`;
                }

                htmlResult += `<li class="mb-2" style="line-height: 1.6; color: #1a1a1a;">${content}</li>`;
            } else {
                // Nếu đang ở trong list mà gặp dòng thường thì đóng list lại
                if (inList) {
                    htmlResult += '</ul>';
                    inList = false;
                }

                // Nếu dòng viết hoa toàn bộ hoặc kết thúc bằng dấu hai chấm -> Biến thành Tiêu đề in đậm
                if (trimmed.endsWith(':') || trimmed === trimmed.toUpperCase()) {
                    htmlResult += `<h5 class="fw-bold text-uppercase mt-4 mb-2" style="color: #000; letter-spacing: 0.5px;">${trimmed}</h5>`;
                } else {
                    htmlResult += `<p class="mb-2" style="line-height: 1.6; color: #1a1a1a;">${trimmed}</p>`;
                }
            }
        });

        if (inList) htmlResult += '</ul>';

        // Đổ toàn bộ cấu trúc HTML đẹp đẽ vào giao diện
        outputEl.innerHTML = htmlResult;
    }
});
</script>
