<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Đơn giao hàng</title></head>
<body>
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">
        Đơn hàng của tôi
        <small class="text-muted fs-6" th:text="'(' + ${#lists.size(myAssignments)} + ' đơn)'"></small>
    </h4>

    <!-- Toggle nhan don -->
    <form th:action="@{/delivery/toggle-available}" method="post">
        <button type="submit"
                th:class="${isAvailable} ? 'btn btn-success btn-sm' : 'btn btn-secondary btn-sm'">
            <i th:class="${isAvailable} ? 'bi bi-toggle-on me-1' : 'bi bi-toggle-off me-1'"></i>
            <span th:text="${isAvailable} ? 'Sẵn sàng nhận đơn' : 'Đang tắt nhận đơn'"></span>
        </button>
    </form>
</div>

<!-- Bo loc -->
<form th:action="@{/delivery}" method="get" class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="d-flex flex-wrap gap-3 align-items-end">

            <!-- Loc trang thai -->
            <div>
                <label class="form-label small text-muted mb-1">Trạng thái</label>
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="status" id="sAll"
                           value="ALL" th:checked="${selectedStatus == 'ALL'}" onchange="this.form.submit()"/>
                    <label class="btn btn-outline-secondary btn-sm" for="sAll">Tất cả</label>

                    <input type="radio" class="btn-check" name="status" id="sAssigned"
                           value="ASSIGNED"
                           th:checked="${selectedStatus == 'ASSIGNED' or selectedStatus == null}"
                           onchange="this.form.submit()"/>
                    <label class="btn btn-outline-warning btn-sm" for="sAssigned">Đang giao</label>

                    <input type="radio" class="btn-check" name="status" id="sDelivered"
                           value="DELIVERED" th:checked="${selectedStatus == 'DELIVERED'}" onchange="this.form.submit()"/>
                    <label class="btn btn-outline-success btn-sm" for="sDelivered">Đã giao</label>

                    <input type="radio" class="btn-check" name="status" id="sFailed"
                           value="FAILED" th:checked="${selectedStatus == 'FAILED'}" onchange="this.form.submit()"/>
                    <label class="btn btn-outline-danger btn-sm" for="sFailed">Thất bại</label>
                </div>
            </div>

            <!-- Khoang thoi gian -->
            <div>
                <label class="form-label small text-muted mb-1">Từ ngày</label>
                <input type="date" name="fromDate" th:value="${fromDate}"
                       class="form-control form-control-sm"/>
            </div>
            <div>
                <label class="form-label small text-muted mb-1">Đến ngày</label>
                <input type="date" name="toDate" th:value="${toDate}"
                       class="form-control form-control-sm"/>
            </div>

            <div class="d-flex gap-2 align-self-end">
                <button type="submit" class="btn btn-dark btn-sm">
                    <i class="bi bi-search me-1"></i>Lọc
                </button>
                <a th:href="@{/delivery}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Mặc định
                </a>
            </div>

        </div>
        <small class="text-muted mt-2 d-block">
            <i class="bi bi-info-circle me-1"></i>
            Chỉ hiển thị đơn trong vòng 7 ngày gần nhất
        </small>
    </div>
</form>

<!-- Khong co don nao -->
<div th:if="${#lists.isEmpty(myAssignments)}" class="text-muted">
    Bạn chưa được phân công đơn nào.
</div>

<!-- Danh sách assignment -->
<div th:each="assignment : ${myAssignments}" class="card border-0 shadow-sm mb-3">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <h6 class="mb-1">
                Đơn #<span th:text="${assignment.order.id}"></span>
                <span th:switch="${assignment.status.name()}" class="ms-2">
                    <span th:case="'ASSIGNED'"  class="badge bg-warning text-dark">Đang giao</span>
                    <span th:case="'DELIVERED'" class="badge bg-success">Đã giao</span>
                    <span th:case="'FAILED'"    class="badge bg-danger">Giao thất bại</span>
                </span>
            </h6>
            <p class="mb-0 text-muted small"
               th:text="${assignment.order.shippingAddress.fullName
                          + ' - ' + assignment.order.shippingAddress.phone}"></p>
            <p class="mb-0 text-muted small"
               th:text="${assignment.order.shippingAddress.street
                          + ', ' + assignment.order.shippingAddress.city}"></p>
            <p class="mb-0 text-muted small">
                <i class="bi bi-clock me-1"></i>
                Phân công lúc:
                <span th:text="${#temporals.format(assignment.assignedAt, 'dd/MM/yyyy HH:mm')}"></span>
            </p>
        </div>
        <div class="text-end">
            <p class="text-danger fw-bold mb-2"
               th:text="${#numbers.formatInteger(assignment.order.totalPrice, 0, 'COMMA') + ' đ'}"></p>
            <span th:if="${assignment.order.paymentMethod == 'COD'}"
                  class="badge bg-danger mb-2 d-block">
                <i class="bi bi-cash-coin"></i> Cần thu hộ
            </span>
            <span th:if="${assignment.order.paymentMethod != 'COD'}"
                  class="badge bg-success mb-2 d-block">
                <i class="bi bi-credit-card"></i> VNPay - 0đ
            </span>
            <div class="d-flex gap-2 justify-content-end">
                <a th:href="@{'/delivery/orders/' + ${assignment.order.id}}"
                   class="btn btn-sm btn-outline-dark">Chi tiết</a>
                <a th:if="${assignment.order.status.name() == 'SHIPPING'
                            and assignment.status.name() != 'DELIVERED'
                            and assignment.status.name() != 'FAILED'}"
                   th:href="@{'/delivery/orders/' + ${assignment.order.id} + '/delivered'}"
                   class="btn btn-sm btn-success"
                   onclick="return confirm('Xác nhận đã giao hàng?')">
                    <i class="bi bi-check-lg"></i> Đã giao
                </a>
                <button th:if="${assignment.order.status.name() == 'SHIPPING'
                                 and assignment.status.name() != 'DELIVERED'
                                 and assignment.status.name() != 'FAILED'}"
                        class="btn btn-sm btn-danger"
                        th:attr="data-id=${assignment.order.id}"
                        onclick="openFailModal(this)">
                    <i class="bi bi-x-lg"></i> Thất bại
                </button>
            </div>
        </div>
    </div>
</div>
<!-- Modal nhập lý do thất bại -->
<div class="modal fade" id="failModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title fw-bold">
                    <i class="bi bi-x-circle text-danger me-1"></i>Giao hàng thất bại
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="failForm" method="post">
                <div class="modal-body">
                    <label class="form-label small text-muted">Lý do thất bại</label>
                    <select name="failReason" class="form-select mb-2" required>
                        <option value="" disabled selected>-- Chọn lý do --</option>
                        <option value="Khách không nghe máy">Khách không nghe máy</option>
                        <option value="Khách vắng nhà">Khách vắng nhà</option>
                        <option value="Địa chỉ không chính xác">Địa chỉ không chính xác</option>
                        <option value="Khách từ chối nhận hàng">Khách từ chối nhận hàng</option>
                        <option value="Khác">Khác</option>
                    </select>
                    <textarea name="failReason" class="form-control d-none"
                              rows="2" placeholder="Nhập lý do..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm"
                            data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-x-circle me-1"></i>Xác nhận thất bại
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openFailModal(btn) {
        const orderId = btn.dataset.id;
        document.getElementById('failForm').action = '/delivery/orders/' + orderId + '/failed';
        const modal = new bootstrap.Modal(document.getElementById('failModal'));
        modal.show();
    }

    // Nếu chọn "Khác" thì hiện textarea
    document.addEventListener('DOMContentLoaded', function () {
        const select = document.querySelector('#failForm select');
        const textarea = document.querySelector('#failForm textarea');
        if (select) {
            select.addEventListener('change', function () {
                if (this.value === 'Khác') {
                    textarea.classList.remove('d-none');
                    textarea.setAttribute('name', 'failReason');
                    select.removeAttribute('name');
                } else {
                    textarea.classList.add('d-none');
                    textarea.removeAttribute('name');
                    select.setAttribute('name', 'failReason');
                }
            });
        }
    });
</script>
</body>
</html>
