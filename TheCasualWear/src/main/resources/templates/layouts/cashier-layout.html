<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Bán hàng tại quầy - The Casual Wear</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="icon" type="image/png" href="/images/footer.png"/>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/cashier}">
            <i class="bi bi-cash-coin"></i> Bán hàng tại quầy
        </a>
        <div class="d-flex align-items-center gap-3">
            <a class="text-white text-decoration-none" th:href="@{/cashier/orders}">
                <i class="bi bi-receipt"></i> Đơn đã bán
            </a>
            <a class="text-white text-decoration-none" sec:authorize="hasAnyRole('ADMIN','OWNER')"
               th:href="@{/admin}">
                <i class="bi bi-gear"></i> Về trang Admin
            </a>
            <span class="text-warning">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name"></span>
            </span>
            <a class="btn btn-outline-danger btn-sm" th:href="@{/auth/logout}">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-12 pt-4 px-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <div th:replace="~{${view}}"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
