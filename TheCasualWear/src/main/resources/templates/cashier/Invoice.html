<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hóa đơn #<span th:text="${order.id}"></span></title>
    <style>
        @media print {
            @page { size: 80mm auto; margin: 0; }
            body { margin: 0; }
            .no-print { display: none !important; }
        }
        body {
            font-family: 'Courier New', monospace;
            width: 280px;
            margin: 20px auto;
            font-size: 13px;
            color: #000;
        }
        .center { text-align: center; }
        .line { border-top: 1px dashed #000; margin: 8px 0; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 2px 0; vertical-align: top; }
        .qty { text-align: center; width: 30px; }
        .price { text-align: right; }
        .total-row td { font-weight: bold; font-size: 15px; }
        .btn-print {
            display: block; margin: 16px auto; padding: 8px 20px;
            font-size: 14px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="center">
    <strong>THE CASUAL WEAR</strong><br>
    Hóa đơn bán hàng tại quầy<br>
</div>
<div class="line"></div>

<div>
    Mã đơn: #<span th:text="${order.id}"></span><br>
    Ngày: <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span><br>
    Thu ngân: <span th:text="${order.cashier != null ? order.cashier.username : '-'}"></span><br>
    Khách hàng:
    <span th:if="${order.customer != null}" th:text="${order.customer.username}"></span>
    <span th:if="${order.customer == null}">Khách lẻ</span>
</div>
<div class="line"></div>

<table>
    <tr>
        <td>SP</td>
        <td class="qty">SL</td>
        <td class="price">T.Tiền</td>
    </tr>
    <tr th:each="d : ${order.orderDetails}">
        <td>
            <span th:text="${d.variant.product.name}"></span><br>
            <small th:text="${d.variant.size != null ? d.variant.size.name : ''} + ' / ' + ${d.variant.color != null ? d.variant.color.name : ''}"></small><br>
            <small th:if="${d.originalPrice != null and d.originalPrice.compareTo(d.price) > 0}"
                   th:text="'Giá gốc: ' + ${#numbers.formatDecimal(d.originalPrice, 0, 'COMMA', 0, 'POINT')}
                             + ' đ (-' + ${#numbers.formatInteger((d.originalPrice - d.price) * 100 / d.originalPrice, 0, 'COMMA')} + '%)'"></small>
        </td>
        <td class="qty" th:text="${d.quantity}"></td>
        <td class="price" th:text="${#numbers.formatDecimal(d.price * d.quantity, 0, 'COMMA', 0, 'POINT')}"></td>
    </tr>
</table>
<div class="line"></div>

<table th:with="discount=${order.orderVoucher != null ? order.orderVoucher.discountAmount : 0}, subtotal=${order.totalPrice + discount}">
    <tr th:if="${order.orderVoucher != null}">
        <td>Tạm tính</td>
        <td class="price" th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
    </tr>
    <tr th:if="${order.orderVoucher != null}">
        <td>
            Voucher
            <small th:text="'(' + ${order.orderVoucher.voucher.code} + ')'"></small>
        </td>
        <td class="price" th:text="'- ' + ${#numbers.formatDecimal(discount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
    </tr>
    <tr class="total-row">
        <td>TỔNG CỘNG</td>
        <td class="price" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
    </tr>
</table>
<div>
    Thanh toán:
    <span th:if="${order.paymentMethod == 'CASH'}">Tiền mặt</span>
    <span th:if="${order.paymentMethod == 'TRANSFER'}">Chuyển khoản</span>
    <span th:if="${order.paymentMethod == 'VNPAY'}">Chuyển khoản QR (VNPay)</span>
</div>
<div class="line"></div>

<div class="center">
    Cảm ơn quý khách đã mua hàng!<br>
    Hẹn gặp lại.
</div>

<button class="btn-print no-print" onclick="window.print()">In hóa đơn</button>
<button class="btn-print no-print" onclick="window.location.href='/cashier'">Quay lại bán hàng</button>

<!-- Hủy cần chọn lý do → dẫn vào trang chi tiết đơn (có modal xác nhận), không hủy thẳng từ hóa đơn -->
<a th:if="${order.status.name() == 'COMPLETED'}"
   th:href="@{'/cashier/orders/' + ${order.id}}"
   class="btn-print no-print" style="display:block;text-align:center;color:#b00020;border:1px solid #b00020;text-decoration:none">
    Hủy đơn này
</a>

</body>
</html>
