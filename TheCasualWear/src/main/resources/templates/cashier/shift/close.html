<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Đóng ca làm việc</title></head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold">Đóng ca làm việc</h4>
        <a th:href="@{/cashier}" class="btn btn-outline-secondary btn-sm">← Quay lại POS</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Thông tin ca</h6>
                    <div class="row g-2">
                        <div class="col-6 text-muted">Mở ca lúc</div>
                        <div class="col-6 text-end"
                             th:text="${#temporals.format(shift.openedAt, 'HH:mm dd/MM/yyyy')}"></div>
                        <div class="col-6 text-muted">Tiền quỹ đầu ca</div>
                        <div class="col-6 text-end"
                             th:text="${#numbers.formatInteger(shift.openingCash, 0, 'COMMA') + ' đ'}"></div>
                        <div class="col-6 text-muted">Tiền mặt đã bán trong ca</div>
                        <div class="col-6 text-end"
                             th:text="${#numbers.formatInteger(expectedCashPreview - shift.openingCash, 0, 'COMMA') + ' đ'}"></div>
                        <div class="col-6 fw-bold">Tiền mặt lẽ ra phải có</div>
                        <div class="col-6 text-end fw-bold text-primary"
                             th:text="${#numbers.formatInteger(expectedCashPreview, 0, 'COMMA') + ' đ'}"></div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <p class="text-muted">
                        Đếm tiền mặt thực tế trong quầy. Ô bên dưới đã điền sẵn số tiền
                        <strong>lẽ ra phải có</strong> — hãy sửa lại theo đúng số tiền đếm được thực tế.
                    </p>

                    <form th:action="@{/cashier/shift/close}" method="post" id="closeShiftForm">
                        <input type="hidden" name="shiftId" th:value="${shift.id}"/>

                        <div class="mb-3">
                            <label class="form-label">Tiền mặt đếm thực tế <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="text" id="actualCashDisplay" class="form-control text-end"
                                       inputmode="numeric" autocomplete="off" required autofocus
                                       oninput="formatMoneyInput(this, 'actualCash')"/>
                                <span class="input-group-text">đ</span>
                            </div>
                            <input type="hidden" name="actualCash" id="actualCash"/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ghi chú</label>
                            <textarea name="note" class="form-control" rows="2"
                                      placeholder="Ghi chú nếu có chênh lệch, sự cố trong ca..."></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg"
                                    onclick="return confirm('Xác nhận đóng ca?')">
                                <i class="bi bi-lock me-2"></i>Đóng ca
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

</div>

<script th:inline="javascript">
    // Cùng cơ chế format dấu phẩy như form mở ca
    function formatMoneyInput(displayEl, hiddenName) {
        let raw = displayEl.value.replace(/[^\d]/g, '');
        raw = raw.replace(/^0+(?=\d)/, '');
        if (raw === '') raw = '0';

        document.getElementById(hiddenName).value = raw;
        displayEl.value = Number(raw).toLocaleString('en-US');
        displayEl.setSelectionRange(displayEl.value.length, displayEl.value.length);
    }

    // Prefill sẵn số tiền "lẽ ra phải có" — cashier sẽ tự sửa lại theo số đếm thực tế.
    const expectedCashPreview = /*[[${expectedCashPreview}]]*/ 0;
    const actualDisplay = document.getElementById('actualCashDisplay');
    actualDisplay.value = Number(expectedCashPreview).toLocaleString('en-US');
    document.getElementById('actualCash').value = expectedCashPreview;
</script>
</body>
</html>
