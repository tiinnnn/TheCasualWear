<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Chọn quầy làm việc</title></head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold">Chọn quầy làm việc</h4>
        <a th:href="@{/cashier/shift/history}" class="btn btn-outline-secondary btn-sm">← Lịch sử ca</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <p class="text-muted">
                        Chọn quầy bạn sẽ đứng bán trong ca này. Nếu quầy đang có
                        người sử dụng, hệ thống sẽ báo và bạn cần chọn quầy khác.
                    </p>

                    <form th:action="@{/cashier/shift/select-counter}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Quầy <span class="text-danger">*</span></label>
                            <select name="counterId" class="form-select form-select-lg" required>
                                <option value="">-- Chọn quầy --</option>
                                <option th:each="c : ${counters}"
                                        th:value="${c.id}"
                                        th:text="${c.code + (c.name != null and !c.name.isBlank() ? ' — ' + c.name : '')}">
                                </option>
                            </select>
                        </div>

                        <div th:if="${#lists.isEmpty(counters)}" class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            Chưa có quầy nào được thiết lập. Liên hệ quản lý để thêm quầy
                            trong mục <strong>Quầy POS</strong> ở trang Admin.
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg"
                                    th:disabled="${#lists.isEmpty(counters)}">
                                <i class="bi bi-arrow-right-circle me-2"></i>Vào quầy
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
