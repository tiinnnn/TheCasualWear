<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
    <link rel="icon" type="image/png" href="/images/footer.png"/>
    <style>
        /* Ẩn icon mắt mặc định của Edge/Chrome/Safari */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear { display: none !important; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:500px">
    <div class="text-center mb-4">
        <a th:href="@{/}" class="text-dark text-decoration-none">
            <h3 class="fw-bold">The Casual Wear</h3>
        </a>
        <p class="text-muted">Đăng nhập để tiếp tục</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-500">
                        Tên đăng nhập / Email / Số điện thoại
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username"
                               class="form-control border-start-0"
                               placeholder="Username, email hoặc SĐT"
                               required autofocus/>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-500">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password" id="password"
                               class="form-control border-start-0"
                               placeholder="Nhập mật khẩu" required/>
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="togglePassword()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="text-end mb-3">
                    <a th:href="@{/forgot-password}" class="text-muted small">Quên mật khẩu?</a>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" name="remember-me"
                           class="form-check-input" id="rememberMe"/>
                    <label class="form-check-label text-muted small"
                           for="rememberMe">
                        Ghi nhớ đăng nhập (3 ngày)
                    </label>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2">
                    Đăng nhập
                </button>
            </form>
        </div>
    </div>

    <p class="text-center mt-3 text-muted">
        Chưa có tài khoản?
        <a th:href="@{/auth/register}" class="text-dark fw-bold">Đăng ký ngay</a>
    </p>
</div>

<script>
    function togglePassword() {
        const input   = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>
</body>
</html>
