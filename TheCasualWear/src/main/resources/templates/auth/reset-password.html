<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/footer.png"/>
    <style>
        :root {
            --cream: #FBF6EC;
            --paper: #FFFFFF;
            --ink: #1A1A1A;
            --mute: #7a7368;
            --line: #ECE3D2;
            --mustard: #F5C247;
            --mustard-dark: #E2AC1F;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--cream);
            color: var(--ink);
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }
        a { color: inherit; }

        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            z-index: 0;
        }
        body::before { width: 340px; height: 340px; background: var(--mustard); opacity: .35; top: -120px; left: -100px; filter: blur(10px); }
        body::after  { width: 240px; height: 240px; background: #f1ece0; bottom: -80px; right: -80px; }

        .auth-wrap { position: relative; z-index: 1; max-width: 420px; width: 100%; }
        .auth-icon {
            width: 64px; height: 64px; border-radius: 999px;
            background: var(--mustard);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: var(--ink);
            margin: 0 auto 1.2rem;
        }
        .auth-brand { text-decoration: none; display: block; text-align: center; margin-bottom: 1.6rem; }
        .auth-brand span { font-weight: 800; font-size: 1.05rem; }
        .auth-sub { color: var(--mute); font-size: .88rem; }

        .auth-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 2rem 1.8rem;
            box-shadow: 0 20px 45px rgba(0,0,0,.06);
            text-align: center;
        }
        .auth-card h2 { font-size: 1.3rem; font-weight: 800; margin: 0 0 .5rem; }

        .form-label { font-size: .82rem; font-weight: 600; margin-bottom: .4rem; text-align: left; display: block; }
        .form-control {
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: .9rem;
            padding: .7rem .9rem;
        }
        .form-control:focus {
            border-color: var(--mustard-dark);
            box-shadow: 0 0 0 .16rem rgba(245,194,71,.3);
        }
        .form-control.is-valid { border-color: #2f9e44; }
        .form-control.is-invalid { border-color: #e14b4b; }
        .form-text { font-size: .75rem; color: var(--mute) !important; text-align: left; }

        .btn-auth-primary {
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-weight: 700;
            font-size: .88rem;
            padding: .78rem 1rem;
            transition: background .2s, transform .2s, box-shadow .2s;
        }
        .btn-auth-primary:hover { background: var(--mustard-dark); color: var(--ink); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,.14); }

        .auth-link { color: var(--mute); font-size: .84rem; text-decoration: none; }
        .auth-link:hover { color: var(--mustard-dark); }
    </style>
</head>
<body>
<div class="auth-wrap">
    <a th:href="@{/}" class="auth-brand"><span>The Casual Wear</span></a>

    <div class="auth-card">
        <div class="auth-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h2>Đặt lại mật khẩu</h2>
        <p class="auth-sub mb-4">Nhập mật khẩu mới cho tài khoản của bạn.</p>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/forgot-password/reset}" method="post" class="text-start">
            <input type="hidden" name="token" th:value="${token}"/>

            <div class="mb-3">
                <label class="form-label">Mật khẩu mới <span class="text-danger">*</span></label>
                <input type="password" name="newPassword" id="newPassword" class="form-control" required/>
                <div class="form-text">
                    <i class="bi bi-info-circle me-1"></i>
                    Mật khẩu phải chứa ít nhất 6 ký tự và chứa ít nhất 1 chữ số
                </div>
                <div class="mt-1" id="pwStrength"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required/>
                <div class="invalid-feedback">Mật khẩu không khớp!</div>
            </div>

            <button type="submit" class="btn btn-auth-primary w-100">Xác nhận</button>
        </form>
    </div>

    <p class="mt-3 text-center mb-0">
        <a th:href="@{/auth/login}" class="auth-link">← Quay lại đăng nhập</a>
    </p>
</div>

<script>
    // Kiểm tra độ mạnh password
    document.getElementById('newPassword').addEventListener('input', function () {
        const pw = this.value;
        const div = document.getElementById('pwStrength');
        if (!pw) { div.innerHTML = ''; return; }

        const hasLength = pw.length >= 6;
        const hasNumber = /\d/.test(pw);

        if (hasLength && hasNumber) {
            div.innerHTML = '<small class="text-success">✓ Mật khẩu hợp lệ</small>';
        } else {
            let msg = [];
            if (!hasLength) msg.push('có 6 ký tự');
            if (!hasNumber) msg.push('có ít nhất 1 chữ số');
            div.innerHTML = '<small class="text-danger">✗ Cần: ' + msg.join(', ') + '</small>';
        }
    });

    // Kiểm tra confirm password
    document.getElementById('confirmPassword').addEventListener('input', function () {
        const pw = document.getElementById('newPassword').value;
        if (this.value !== pw) {
            this.classList.add('is-invalid');
            this.classList.remove('is-valid');
        } else {
            this.classList.remove('is-invalid');
            this.classList.add('is-valid');
        }
    });
</script>
</body>
</html>
