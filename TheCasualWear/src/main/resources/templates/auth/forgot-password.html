<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/footer.png"/>
    <style>
        :root {
            --cream: #FBF6EC;
            --paper: #FFFFFF;
            --ink: #1A1A1A;
            --mute: #7a7368;
            --line: #ECE3D2;
            --mustard: #F5C247;
            --mustard-dark: #E2AC1F;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--cream);
            color: var(--ink);
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }
        a { color: inherit; }

        /* Chấm trang trí phía sau — tạo điểm nhấn không gian */
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            z-index: 0;
        }
        body::before { width: 340px; height: 340px; background: var(--mustard); opacity: .35; top: -120px; right: -100px; filter: blur(10px); }
        body::after  { width: 240px; height: 240px; background: #f1ece0; top: 55%; left: -100px; }

        .auth-wrap { position: relative; z-index: 1; max-width: 420px; width: 100%; }
        .auth-icon {
            width: 64px; height: 64px; border-radius: 999px;
            background: var(--mustard);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: var(--ink);
            margin: 0 auto 1.2rem;
        }
        .auth-brand { text-decoration: none; display: block; text-align: center; margin-bottom: 1.6rem; }
        .auth-brand span { font-weight: 800; font-size: 1.05rem; }
        .auth-sub { color: var(--mute); font-size: .88rem; }

        .auth-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 2rem 1.8rem;
            box-shadow: 0 20px 45px rgba(0,0,0,.06);
            text-align: center;
        }
        .auth-card h2 { font-size: 1.3rem; font-weight: 800; margin: 0 0 .5rem; }

        .form-label { font-size: .82rem; font-weight: 600; margin-bottom: .4rem; text-align: left; display: block; }
        .form-control {
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: .9rem;
            padding: .7rem .9rem;
        }
        .form-control:focus {
            border-color: var(--mustard-dark);
            box-shadow: 0 0 0 .16rem rgba(245,194,71,.3);
        }

        .btn-auth-primary {
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-weight: 700;
            font-size: .88rem;
            padding: .78rem 1rem;
            transition: background .2s, transform .2s, box-shadow .2s;
        }
        .btn-auth-primary:hover { background: var(--mustard-dark); color: var(--ink); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,.14); }

        .auth-link { color: var(--mute); font-size: .84rem; text-decoration: none; }
        .auth-link:hover { color: var(--mustard-dark); }
    </style>
</head>
<body>
<div class="auth-wrap">
    <a th:href="@{/}" class="auth-brand"><span>The Casual Wear</span></a>

    <div class="auth-card">
        <div class="auth-icon"><i class="bi bi-key-fill"></i></div>
        <h2>Quên mật khẩu</h2>
        <p class="auth-sub mb-4">Nhập email tài khoản, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/forgot-password}" method="post" class="text-start">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                       placeholder="example@gmail.com" required/>
            </div>
            <button type="submit" class="btn btn-auth-primary w-100">Gửi link đặt lại mật khẩu</button>
        </form>
    </div>

    <p class="mt-3 text-center mb-0">
        <a th:href="@{/auth/login}" class="auth-link">← Quay lại đăng nhập</a>
    </p>
</div>
</body>
</html>
