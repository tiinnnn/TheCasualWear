<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Quản lý user</title></head>
<body>

<div class="dm-dash">
    <div class="dm-glow dm-glow--a"></div>
    <div class="dm-glow dm-glow--b"></div>

    <div class="dm-content">

        <!-- ==================== HEADER ==================== -->
        <div class="dm-header">
            <div>
                <p class="dm-eyebrow">Tài khoản</p>
                <h1 class="dm-title">
                    Quản lý người dùng
                    <span class="dm-text-faint dm-title-count" th:text="'(' + ${totalItems} + ' người dùng)'"></span>
                </h1>
            </div>
        </div>

        <!-- ==================== FILTER ==================== -->
        <div class="dm-card mb-4">
            <form th:action="@{/admin/users}" method="get" class="dm-filter-row">
                <div class="dm-form-group dm-form-group--grow">
                    <label class="dm-label">Tìm kiếm</label>
                    <input type="text" name="keyword" th:value="${keyword}" class="dm-input"
                           placeholder="Tên đăng nhập, email hoặc SĐT..."/>
                </div>
                <div class="dm-form-group">
                    <label class="dm-label">Role</label>
                    <select name="roleName" class="dm-select">
                        <option value="">Tất cả</option>
                        <option th:each="r : ${allRoles}"
                                th:value="${r.name}"
                                th:selected="${selectedRole == r.name}"
                                th:text="${r.name.replace('ROLE_', '')}"></option>
                    </select>
                </div>
                <div class="dm-filter-actions">
                    <button type="submit" class="dm-btn dm-btn--solid">
                        <i class="bi bi-search"></i>Tìm
                    </button>
                    <a th:if="${keyword != null or selectedRole != null}"
                       th:href="@{/admin/users}" class="dm-btn">
                        <i class="bi bi-x-lg"></i>Xóa lọc
                    </a>
                </div>
            </form>
        </div>

        <!-- ==================== TABLE ==================== -->
        <div class="dm-card">
            <div class="dm-table-wrap">
                <table class="dm-table">
                    <colgroup>
                        <col style="width:5%">
                        <col style="width:14%">
                        <col style="width:20%">
                        <col style="width:12%">
                        <col style="width:14%">
                        <col style="width:10%">
                        <col style="width:25%">
                    </colgroup>
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="dm-empty">Không tìm thấy người dùng nào</td>
                    </tr>
                    <tr th:each="u : ${users}">
                        <td class="dm-text-dim" th:text="${u.id}"></td>
                        <td class="dm-cell-strong dm-truncate" th:title="${u.username}" th:text="${u.username}"></td>
                        <td class="dm-text-dim dm-truncate" th:title="${u.email}" th:text="${u.email}"></td>
                        <td class="dm-text-dim dm-truncate" th:text="${u.phone}"></td>
                        <td>
                            <div class="dm-role-badges">
                                <span th:each="r : ${u.roles}" class="dm-pill dm-pill--muted"
                                      th:text="${r.name.replace('ROLE_', '')}"></span>
                            </div>
                        </td>
                        <td>
                            <span th:if="${u.enabled}" class="dm-pill dm-pill--good">Hoạt động</span>
                            <span th:unless="${u.enabled}" class="dm-pill dm-pill--bad">Đã khóa</span>
                        </td>
                        <td>
                            <div class="dm-action-stack">
                                <a th:if="${u.enabled}"
                                   th:href="@{'/admin/users/' + ${u.id} + '/lock'}"
                                   class="dm-btn dm-btn--bad-outline dm-btn--block dm-confirm-trigger"
                                   th:data-confirm-msg="'Khóa tài khoản ' + ${u.username} + '?'">
                                    <i class="bi bi-lock"></i>Khóa
                                </a>
                                <a th:unless="${u.enabled}"
                                   th:href="@{'/admin/users/' + ${u.id} + '/unlock'}"
                                   class="dm-btn dm-btn--good-outline dm-btn--block dm-confirm-trigger"
                                   th:data-confirm-msg="'Mở khóa tài khoản ' + ${u.username} + '?'">
                                    <i class="bi bi-unlock"></i>Mở khóa
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ==================== PAGINATION ==================== -->
        <div th:if="${totalPages > 1}" class="dm-pagination-wrap">
            <ul class="dm-pagination">
                <li>
                    <a th:if="${currentPage > 0}" class="dm-page-link"
                       th:href="@{/admin/users(page=${currentPage-1}, keyword=${keyword}, roleName=${selectedRole})}">&#x2190;</a>
                    <span th:unless="${currentPage > 0}" class="dm-page-link dm-page-link--disabled">&#x2190;</span>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                    <a class="dm-page-link" th:classappend="${i == currentPage} ? ' dm-page-link--active'"
                       th:href="@{/admin/users(page=${i}, keyword=${keyword}, roleName=${selectedRole})}"
                       th:text="${i + 1}"></a>
                </li>
                <li>
                    <a th:if="${currentPage < totalPages-1}" class="dm-page-link"
                       th:href="@{/admin/users(page=${currentPage+1}, keyword=${keyword}, roleName=${selectedRole})}">&#x2192;</a>
                    <span th:unless="${currentPage < totalPages-1}" class="dm-page-link dm-page-link--disabled">&#x2192;</span>
                </li>
            </ul>
        </div>

    </div>
</div>

<!-- ==================== MODAL XÁC NHẬN (thay cho confirm() của trình duyệt) ==================== -->
<div class="dm-confirm-overlay" id="dmConfirmOverlay">
    <div class="dm-confirm-box">
        <div class="dm-confirm-icon"><i class="bi bi-question-circle-fill"></i></div>
        <p class="dm-confirm-msg" id="dmConfirmMsg">Bạn có chắc chắn?</p>
        <div class="dm-confirm-actions">
            <button type="button" class="dm-btn" id="dmConfirmCancel">Hủy</button>
            <button type="button" class="dm-btn dm-btn--solid" id="dmConfirmOk">Xác nhận</button>
        </div>
    </div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    .dm-dash {
        --bg: #0b0d12;
        --surface: #12151d;
        --surface-2: #1a1e29;
        --border: rgba(255,255,255,.07);
        --border-strong: rgba(255,255,255,.14);
        --text: #f5f6f9;
        --text-dim: #d3d6e0;
        --text-faint: #a6abbd;
        --accent: #8b7cf6;
        --accent-soft: rgba(139,124,246,.14);
        --good: #34d399;
        --good-soft: rgba(52,211,153,.13);
        --bad: #f2637a;
        --bad-soft: rgba(242,99,122,.13);
        --warn: #f5b95c;
        --warn-soft: rgba(245,185,92,.13);
        --radius: 18px;

        position: relative;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        border-radius: 0px;
        padding: 32px;
        margin: -24px -24px 0;
        min-height: calc(100vh - 64px);
    }
    @media (max-width: 767px) { .dm-dash { padding: 18px; margin: -24px -24px 0; min-height: calc(100vh - 56px); } }

    .dm-glow {
        position: absolute; width: 480px; height: 480px; border-radius: 50%;
        filter: blur(110px); opacity: .16; pointer-events: none;
        animation: dmDrift 14s ease-in-out infinite alternate;
    }
    .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
    .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }
    @keyframes dmDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px, 25px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .dm-glow { animation: none !important; opacity: 1 !important; } }

    .dm-content { position: relative; z-index: 1; }

    .dm-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 12px; flex-wrap: wrap; }
    .dm-eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
    .dm-title { font-size: 1.7rem; font-weight: 800; margin: 0; letter-spacing: -.02em; }
    .dm-title-count { font-size: 1rem; font-weight: 600; margin-left: 6px; }

    .dm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .mb-4 { margin-bottom: 24px; }

    .dm-text-faint { color: var(--text-faint); font-size: .78rem; }
    .dm-text-dim { color: var(--text-dim); }
    .dm-cell-strong { font-weight: 700; }

    .dm-filter-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .dm-filter-actions { display: flex; gap: 8px; }
    .dm-form-group { display: flex; flex-direction: column; gap: 6px; }
    .dm-form-group--grow { flex: 1 1 240px; min-width: 200px; }
    .dm-label { font-size: .78rem; font-weight: 600; color: var(--text-dim); }

    .dm-input, .dm-select {
        background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 10px; padding: 9px 12px; font-size: .87rem; font-family: inherit;
        outline: none; transition: border-color .2s ease; width: 100%; box-sizing: border-box;
    }
    .dm-input:focus, .dm-select:focus { border-color: var(--accent); }
    .dm-input::placeholder { color: var(--text-faint); }
    .dm-select { min-width: 150px; }

    .dm-table-wrap { overflow-x: hidden; }
    .dm-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: .84rem; }
    .dm-table thead th {
        text-align: left; text-transform: uppercase; letter-spacing: .03em;
        font-size: .64rem; font-weight: 700; color: var(--text-faint);
        padding: 0 8px 10px; border-bottom: 1px solid var(--border);
    }
    .dm-table th.dm-text-end   { text-align: right; }
    .dm-table th.dm-text-center { text-align: center; }
    .dm-table tbody td { padding: 12px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .dm-table tbody tr:last-child td { border-bottom: none; }
    .dm-table tbody tr { transition: background .2s ease; }
    .dm-table tbody tr:hover { background: var(--surface-2); }
    .dm-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .dm-role-badges { display: flex; flex-wrap: wrap; gap: 4px; }

    .dm-pill {
        display: inline-flex; align-items: center; padding: 3px 10px;
        border-radius: 999px; font-size: .66rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
    }
    .dm-pill--muted { background: var(--surface-2); color: var(--text-dim); }
    .dm-pill--good  { background: var(--good-soft); color: var(--good); }
    .dm-pill--bad   { background: var(--bad-soft); color: var(--bad); }

    .dm-empty { text-align: center; padding: 24px 0; color: var(--text-faint); font-size: .85rem; }

    .dm-action-stack { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }

    .dm-btn {
        display: inline-flex; align-items: center; gap: 6px; justify-content: center;
        border: 1px solid var(--border); color: var(--text-dim);
        background: transparent; border-radius: 999px;
        font-size: .78rem; font-weight: 600; padding: 6px 12px;
        text-decoration: none; transition: all .2s ease; cursor: pointer;
    }
    .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .dm-btn--solid { background: var(--accent); border-color: var(--accent); color: #fff; padding: 8px 16px; font-size: .82rem; }
    .dm-btn--solid:hover { background: #7a6af0; border-color: #7a6af0; color: #fff; }
    .dm-btn--block { width: 100%; }
    .dm-btn--bad-outline { border-color: var(--bad); color: var(--bad); }
    .dm-btn--bad-outline:hover { background: var(--bad-soft); }
    .dm-btn--good-outline { border-color: var(--good); color: var(--good); }
    .dm-btn--good-outline:hover { background: var(--good-soft); }

    .dm-pagination-wrap { display: flex; justify-content: center; margin-top: 20px; overflow-x: auto; }
    .dm-pagination { list-style: none; display: flex; gap: 6px; margin: 0; padding: 0; }
    .dm-page-link {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 34px; height: 34px; padding: 0 6px; border-radius: 9px;
        border: 1px solid var(--border); color: var(--text-dim); text-decoration: none;
        font-size: .84rem; font-weight: 600; transition: all .2s ease;
    }
    .dm-page-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .dm-page-link--active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dm-page-link--disabled { opacity: .35; pointer-events: none; }

    @media (max-width: 680px) {
        .dm-table-wrap { overflow-x: auto; }
        .dm-table { table-layout: auto; min-width: 720px; }
        .dm-truncate { white-space: nowrap; overflow: visible; text-overflow: clip; }
    }

    /* ===== Modal xác nhận =====
       Đặt biến màu ngay trên .dm-confirm-overlay vì modal nằm NGOÀI .dm-dash
       (anh em, không phải con) nên không kế thừa được các biến khai báo trong đó. */
    .dm-confirm-overlay {
        display: none; position: fixed; inset: 0; z-index: 1090;
        background: rgba(5,6,10,.62); backdrop-filter: blur(2px);
        align-items: center; justify-content: center; padding: 20px;
        --surface: #12151d; --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.14);
        --text: #f5f6f9; --text-dim: #d3d6e0;
        --accent: #8b7cf6; --accent-soft: rgba(139,124,246,.14);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .dm-confirm-overlay.dm-show { display: flex; }
    .dm-confirm-box {
        background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px;
        padding: 26px 24px; max-width: 360px; width: 100%; text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,.5);
        animation: dmConfirmPop .18s ease-out;
    }
    @keyframes dmConfirmPop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .dm-confirm-icon { font-size: 1.8rem; color: var(--accent); margin-bottom: 10px; }
    .dm-confirm-msg { font-size: .92rem; font-weight: 600; color: var(--text); margin: 0 0 20px; line-height: 1.5; }
    .dm-confirm-actions { display: flex; gap: 10px; justify-content: center; }
    .dm-confirm-actions .dm-btn { flex: 1; padding: 8px 14px; }
</style>

<script>
    (function () {
        const overlay   = document.getElementById('dmConfirmOverlay');
        const msgEl     = document.getElementById('dmConfirmMsg');
        const btnOk     = document.getElementById('dmConfirmOk');
        const btnCancel = document.getElementById('dmConfirmCancel');
        let pendingHref = null;

        function closeModal() {
            overlay.classList.remove('dm-show');
            pendingHref = null;
        }

        document.querySelectorAll('.dm-confirm-trigger').forEach(el => {
            el.addEventListener('click', function (e) {
                e.preventDefault();
                pendingHref = this.getAttribute('href');
                msgEl.textContent = this.dataset.confirmMsg || 'Bạn có chắc chắn?';
                overlay.classList.add('dm-show');
            });
        });

        btnOk.addEventListener('click', function () {
            if (pendingHref) window.location.href = pendingHref;
        });
        btnCancel.addEventListener('click', closeModal);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    })();
</script>

</body>
</html>
