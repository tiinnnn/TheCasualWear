<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Collection</title></head>
<body>

<div class="dm-dash">
    <div class="dm-glow dm-glow--a"></div>
    <div class="dm-glow dm-glow--b"></div>

    <div class="dm-content">

        <!-- ==================== HEADER ==================== -->
        <div class="dm-header">
            <div>
                <p class="dm-eyebrow">Bộ sưu tập</p>
                <h1 class="dm-title"
                    th:text="${collection.id != null} ? 'Sửa Collection' : 'Tạo Collection mới'"></h1>
            </div>
            <a th:href="@{/admin/collections}" class="dm-btn">
                <i class="bi bi-arrow-left"></i>Quay lại
            </a>
        </div>

        <!-- ==================== FORM ==================== -->
        <div class="dm-card dm-card--form">
            <form th:action="${collection.id != null}
                              ? @{'/admin/collections/' + ${collection.id} + '/edit'}
                              : @{/admin/collections/new}"
                  method="post"
                  enctype="multipart/form-data"
                  id="collectionForm">

                <div class="dm-form-group">
                    <label class="dm-label">Tên Collection <span class="dm-required">*</span></label>
                    <input type="text" name="name" th:value="${collection.name}"
                           class="dm-input" required placeholder="VD: Summer 2025"/>
                </div>

                <div class="dm-form-group">
                    <label class="dm-label">Mô tả</label>
                    <textarea name="description" class="dm-input dm-textarea" rows="3"
                              th:text="${collection.description}"
                              placeholder="Mô tả ngắn về collection..."></textarea>
                </div>

                <div class="dm-form-group">
                    <label class="dm-label">Ảnh bìa</label>
                    <input type="file" name="coverFile" accept="image/*"
                           class="dm-input dm-file" id="coverFileInput"
                           onchange="previewCover(this)"/>
                    <img id="coverPreview"
                         th:if="${collection.coverImage != null}"
                         th:src="${collection.coverImage}"
                         class="dm-cover-preview"/>
                    <img id="coverPreview"
                         th:unless="${collection.coverImage != null}"
                         src="" class="dm-cover-preview dm-hidden"/>
                </div>

                <div class="dm-form-row dm-form-row--2">
                    <div class="dm-form-group">
                        <label class="dm-label">Ngày bắt đầu</label>
                        <input type="date" name="startDate" id="collStartDate" class="dm-input"
                               th:value="${collection.startDate}"/>
                        <small class="dm-text-faint" id="collStartErr" style="display:none;color:var(--bad)"></small>
                    </div>
                    <div class="dm-form-group">
                        <label class="dm-label">Ngày kết thúc</label>
                        <input type="date" name="endDate" id="collEndDate" class="dm-input"
                               th:value="${collection.endDate}"/>
                        <small class="dm-text-faint" id="collEndErr" style="display:none;color:var(--bad)"></small>
                    </div>
                </div>

                <div class="dm-form-group">
                    <label class="dm-label">Trạng thái hiển thị</label>
                    <div class="dm-radio-row">
                        <label class="dm-radio">
                            <input type="radio" name="isActive" value="true"
                                   th:checked="${collection.isActive != false}"/>
                            <span>Hiển thị</span>
                        </label>
                        <label class="dm-radio">
                            <input type="radio" name="isActive" value="false"
                                   th:checked="${collection.isActive == false}"/>
                            <span>Ẩn</span>
                        </label>
                    </div>
                </div>

                <div class="dm-form-actions">
                    <button type="submit" class="dm-btn dm-btn--solid">
                        <i class="bi bi-check-lg"></i>Lưu
                    </button>
                    <a th:href="@{/admin/collections}" class="dm-btn">Hủy</a>
                </div>
            </form>
        </div>

    </div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    .dm-dash {
        --bg: #0b0d12;
        --surface: #12151d;
        --surface-2: #1a1e29;
        --border: rgba(255,255,255,.07);
        --border-strong: rgba(255,255,255,.14);
        --text: #f5f6f9;
        --text-dim: #d3d6e0;
        --text-faint: #a6abbd;
        --accent: #8b7cf6;
        --accent-soft: rgba(139,124,246,.14);
        --good: #34d399;
        --good-soft: rgba(52,211,153,.13);
        --bad: #f2637a;
        --bad-soft: rgba(242,99,122,.13);
        --warn: #f5b95c;
        --warn-soft: rgba(245,185,92,.13);
        --radius: 18px;

        position: relative;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        border-radius: 0px;
        padding: 32px;
        margin: -24px -24px 0;
    }
    @media (max-width: 767px) { .dm-dash { padding: 18px; margin: -24px -24px 0; } }

    .dm-glow {
        position: absolute; width: 480px; height: 480px; border-radius: 50%;
        filter: blur(110px); opacity: .16; pointer-events: none;
        animation: dmDrift 14s ease-in-out infinite alternate;
    }
    .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
    .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }
    @keyframes dmDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px, 25px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .dm-glow { animation: none !important; opacity: 1 !important; } }

    .dm-content { position: relative; z-index: 1; }

    .dm-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 12px; flex-wrap: wrap; }
    .dm-eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
    .dm-title { font-size: 1.7rem; font-weight: 800; margin: 0; letter-spacing: -.02em; }

    .dm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; }
    .dm-card--form { max-width: 640px; }

    .dm-form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .dm-label { font-size: .8rem; font-weight: 600; color: var(--text-dim); }
    .dm-required { color: var(--bad); }

    .dm-input {
        background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 10px; padding: 10px 13px; font-size: .9rem; font-family: inherit;
        outline: none; transition: border-color .2s ease, box-shadow .2s ease; width: 100%;
        box-sizing: border-box;
    }
    .dm-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .dm-input::placeholder { color: var(--text-faint); }
    .dm-input--invalid { border-color: var(--bad) !important; box-shadow: 0 0 0 3px var(--bad-soft) !important; }
    .dm-textarea { resize: vertical; min-height: 84px; font-family: inherit; }
    .dm-file { padding: 8px 13px; cursor: pointer; color: var(--text-dim); }
    .dm-file::file-selector-button {
        background: var(--accent-soft); color: var(--accent); border: none; border-radius: 8px;
        padding: 6px 12px; font-size: .8rem; font-weight: 600; margin-right: 10px; cursor: pointer;
    }

    .dm-cover-preview { display: block; margin-top: 10px; height: 120px; width: auto; max-width: 100%; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); }
    .dm-hidden { display: none; }

    .dm-form-row { display: grid; gap: 16px; }
    .dm-form-row--2 { grid-template-columns: repeat(2, 1fr); }
    .dm-form-row .dm-form-group { margin-bottom: 18px; }
    @media (max-width: 600px) { .dm-form-row--2 { grid-template-columns: 1fr; } }

    .dm-radio-row { display: flex; gap: 10px; }
    .dm-radio {
        display: flex; align-items: center; gap: 8px; cursor: pointer;
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
        padding: 8px 16px; font-size: .85rem; color: var(--text-dim); transition: all .2s ease;
    }
    .dm-radio input { accent-color: var(--accent); width: 15px; height: 15px; }
    .dm-radio:has(input:checked) { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }

    .dm-form-actions { display: flex; gap: 10px; margin-top: 6px; }

    .dm-btn {
        display: inline-flex; align-items: center; gap: 6px; justify-content: center;
        border: 1px solid var(--border); color: var(--text-dim);
        background: transparent; border-radius: 999px;
        font-size: .82rem; font-weight: 600; padding: 8px 16px;
        text-decoration: none; transition: all .2s ease; cursor: pointer;
    }
    .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .dm-btn--solid { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dm-btn--solid:hover { background: #7a6af0; border-color: #7a6af0; color: #fff; }
</style>

<script>
    function previewCover(input) {
        const preview = document.getElementById('coverPreview');
        if (input.files && input.files[0]) {
            preview.src = URL.createObjectURL(input.files[0]);
            preview.classList.remove('dm-hidden');
        }
    }
</script>

<script>
    (function () {
        // ══ Validate ngày Collection ══
        // Áp dụng như nhau cho cả TẠO MỚI lẫn SỬA:
        // - Ngày bắt đầu không được sớm hơn hôm nay.
        // - Ngày kết thúc không được sớm hơn ngày bắt đầu.
        const form       = document.getElementById('collectionForm');
        const startInput = document.getElementById('collStartDate');
        const endInput   = document.getElementById('collEndDate');
        const startErr   = document.getElementById('collStartErr');
        const endErr     = document.getElementById('collEndErr');

        function pad(n) { return String(n).padStart(2, '0'); }
        function todayValue() {
            const d = new Date();
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }
        const today = todayValue();

        startInput.min = today;

        function syncEndMin() {
            endInput.min = startInput.value || today;
        }
        startInput.addEventListener('change', syncEndMin);
        syncEndMin();

        function showError(input, errEl, message) {
            input.classList.add('dm-input--invalid');
            errEl.textContent = message;
            errEl.style.display = 'block';
        }
        function clearError(input, errEl) {
            input.classList.remove('dm-input--invalid');
            errEl.style.display = 'none';
        }

        form.addEventListener('submit', function (e) {
            clearError(startInput, startErr);
            clearError(endInput, endErr);

            let hasError = false;

            if (startInput.value && startInput.value < today) {
                showError(startInput, startErr, 'Ngày bắt đầu không được sớm hơn hôm nay!');
                hasError = true;
            }
            if (startInput.value && endInput.value && endInput.value < startInput.value) {
                showError(endInput, endErr, 'Ngày kết thúc không được sớm hơn ngày bắt đầu!');
                hasError = true;
            }

            if (hasError) e.preventDefault();
        });
    })();
</script>

</body>
</html>
