<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Chi tiết Collection</title></head>
<body>

<div class="dm-dash">
    <div class="dm-glow dm-glow--a"></div>
    <div class="dm-glow dm-glow--b"></div>

    <div class="dm-content">

        <!-- ==================== HEADER ==================== -->
        <div class="dm-header">
            <div>
                <p class="dm-eyebrow">Bộ sưu tập</p>
                <h1 class="dm-title">
                    <span th:text="${collection.name}"></span>
                    <span th:if="${collection.isActive}" class="dm-pill dm-pill--good dm-pill--inline">Active</span>
                    <span th:unless="${collection.isActive}" class="dm-pill dm-pill--muted dm-pill--inline">Ẩn</span>
                </h1>
            </div>
            <div class="dm-header-actions">
                <a th:href="@{'/admin/collections/' + ${collection.id} + '/edit'}" class="dm-btn">
                    <i class="bi bi-pencil"></i>Sửa thông tin
                </a>
                <a th:href="@{/admin/collections}" class="dm-btn">
                    <i class="bi bi-arrow-left"></i>Quay lại
                </a>
            </div>
        </div>

        <div class="dm-detail-grid">

            <!-- ==================== SẢN PHẨM TRONG COLLECTION ==================== -->
            <div class="dm-card">
                <div class="dm-section-title">
                    <span><i class="bi bi-box-seam"></i>Sản phẩm trong collection</span>
                    <span class="dm-pill dm-pill--accent" th:text="${collectionProducts.size()}"></span>
                </div>

                <div th:if="${#sets.isEmpty(collectionProducts)}" class="dm-empty">
                    Chưa có sản phẩm nào
                </div>

                <div th:each="p : ${collectionProducts}" class="dm-row-item">
                    <div class="dm-row-left">
                        <img th:if="${p.images != null and !p.images.isEmpty()}"
                             th:src="${p.images[0].imageUrl}" class="dm-thumb"/>
                        <img th:unless="${p.images != null and !p.images.isEmpty()}"
                             src="/images/no-image.png" class="dm-thumb"/>
                        <div>
                            <p class="dm-row-title" th:text="${p.name}"></p>
                            <small class="dm-text-faint" th:text="${p.category != null ? p.category.name : ''}"></small>
                        </div>
                    </div>
                    <div class="dm-row-right">
                        <span class="dm-price" th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + ' đ'}"></span>
                        <a th:href="@{'/admin/collections/' + ${collection.id} + '/products/' + ${p.id} + '/remove'}"
                           class="dm-icon-btn dm-icon-btn--bad" title="Xóa khỏi collection"
                           onclick="return confirm('Xóa sản phẩm này khỏi collection?')">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- ==================== SIDEBAR ==================== -->
            <div class="dm-side-col">

                <!-- Thông tin -->
                <div class="dm-card mb-3">
                    <div class="dm-section-title dm-section-title--sm">
                        <span><i class="bi bi-info-circle"></i>Thông tin</span>
                    </div>
                    <p class="dm-text-dim dm-info-desc" th:text="${collection.description}"></p>
                    <div class="dm-coll-meta" th:if="${collection.startDate != null or collection.endDate != null}">
                        <i class="bi bi-calendar"></i>
                        <span th:if="${collection.startDate != null}" th:text="${#temporals.format(collection.startDate, 'dd/MM/yyyy')}"></span>
                        <span th:if="${collection.startDate != null and collection.endDate != null}">—</span>
                        <span th:if="${collection.endDate != null}" th:text="${#temporals.format(collection.endDate, 'dd/MM/yyyy')}"></span>
                    </div>
                </div>

                <!-- Thêm sản phẩm -->
                <div class="dm-card">
                    <div class="dm-section-title dm-section-title--sm">
                        <span><i class="bi bi-plus-circle"></i>Thêm sản phẩm</span>
                    </div>

                    <div th:if="${#lists.isEmpty(availableProducts)}" class="dm-empty">
                        Tất cả sản phẩm đã có trong collection
                    </div>

                    <form th:if="${!#lists.isEmpty(availableProducts)}"
                          th:action="@{'/admin/collections/' + ${collection.id} + '/products/add'}"
                          method="post">

                        <input type="text" id="searchProduct" class="dm-input mb-2"
                               placeholder="Tìm sản phẩm..."/>

                        <div class="dm-scroll-box">
                            <label th:each="p : ${availableProducts}" class="dm-check-item product-item">
                                <input type="checkbox" name="productIds" th:value="${p.id}" th:id="'p' + ${p.id}"/>
                                <span th:text="${p.name}"></span>
                            </label>
                        </div>

                        <div class="dm-form-actions">
                            <button type="submit" class="dm-btn dm-btn--solid dm-btn--grow">
                                <i class="bi bi-plus-lg"></i>Thêm vào
                            </button>
                            <button type="button" class="dm-btn" onclick="selectAll()">Tất cả</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    .dm-dash {
        --bg: #0b0d12;
        --surface: #12151d;
        --surface-2: #1a1e29;
        --border: rgba(255,255,255,.07);
        --border-strong: rgba(255,255,255,.14);
        --text: #f5f6f9;
        --text-dim: #d3d6e0;
        --text-faint: #a6abbd;
        --accent: #8b7cf6;
        --accent-soft: rgba(139,124,246,.14);
        --good: #34d399;
        --good-soft: rgba(52,211,153,.13);
        --bad: #f2637a;
        --bad-soft: rgba(242,99,122,.13);
        --warn: #f5b95c;
        --warn-soft: rgba(245,185,92,.13);
        --radius: 18px;

        position: relative;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        border-radius: 0px;
        padding: 32px;
        margin: -24px -24px 0;
    }
    @media (max-width: 767px) { .dm-dash { padding: 18px; margin: -24px -24px 0; } }

    .dm-glow {
        position: absolute; width: 480px; height: 480px; border-radius: 50%;
        filter: blur(110px); opacity: .16; pointer-events: none;
        animation: dmDrift 14s ease-in-out infinite alternate;
    }
    .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
    .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }
    @keyframes dmDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px, 25px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .dm-glow { animation: none !important; opacity: 1 !important; } }

    .dm-content { position: relative; z-index: 1; }

    .dm-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 12px; flex-wrap: wrap; }
    .dm-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .dm-eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
    .dm-title { font-size: 1.5rem; font-weight: 800; margin: 0; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .dm-detail-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .dm-detail-grid { grid-template-columns: 1fr; } }
    .dm-side-col { display: flex; flex-direction: column; }
    .mb-3 { margin-bottom: 16px; }
    .mb-2 { margin-bottom: 10px; }

    .dm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .dm-empty { text-align: center; padding: 24px 0; color: var(--text-faint); font-size: .85rem; }

    .dm-section-title {
        display: flex; align-items: center; justify-content: space-between;
        font-weight: 700; font-size: .92rem; margin-bottom: 16px;
        padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .dm-section-title--sm { font-size: .85rem; margin-bottom: 12px; padding-bottom: 10px; }
    .dm-section-title i { margin-right: 8px; color: var(--accent); }

    .dm-row-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 12px; }
    .dm-row-item:last-child { border-bottom: none; }
    .dm-row-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .dm-row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .dm-row-title { margin: 0; font-weight: 600; font-size: .87rem; }
    .dm-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
    .dm-price { color: var(--bad); font-weight: 700; font-size: .85rem; white-space: nowrap; }
    .dm-text-faint { color: var(--text-faint); font-size: .78rem; }
    .dm-text-dim { color: var(--text-dim); font-size: .85rem; }
    .dm-info-desc { margin: 0 0 10px; }
    .dm-coll-meta { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--text-faint); }
    .dm-coll-meta i { color: var(--accent); }

    .dm-input {
        background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 10px; padding: 10px 13px; font-size: .87rem; font-family: inherit;
        outline: none; transition: border-color .2s ease, box-shadow .2s ease; width: 100%; box-sizing: border-box;
    }
    .dm-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .dm-input::placeholder { color: var(--text-faint); }

    .dm-scroll-box {
        max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px;
        padding: 6px; background: var(--surface-2); margin-bottom: 12px;
    }
    .dm-check-item {
        display: flex; align-items: center; gap: 10px; padding: 8px 8px;
        border-radius: 8px; font-size: .84rem; color: var(--text-dim); cursor: pointer;
        transition: background .15s ease;
    }
    .dm-check-item:hover { background: var(--surface); }
    .dm-check-item input { accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; }

    .dm-form-actions { display: flex; gap: 8px; }

    .dm-btn {
        display: inline-flex; align-items: center; gap: 6px; justify-content: center;
        border: 1px solid var(--border); color: var(--text-dim);
        background: transparent; border-radius: 999px;
        font-size: .82rem; font-weight: 600; padding: 8px 16px;
        text-decoration: none; transition: all .2s ease; cursor: pointer;
    }
    .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .dm-btn--solid { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dm-btn--solid:hover { background: #7a6af0; border-color: #7a6af0; color: #fff; }
    .dm-btn--grow { flex-grow: 1; }

    .dm-icon-btn {
        display: inline-flex; align-items: center; justify-content: center;
        flex-shrink: 0; width: 32px; height: 32px; border-radius: 9px;
        border: 1px solid var(--border); color: var(--text-dim); background: transparent;
        text-decoration: none; transition: all .2s ease;
    }
    .dm-icon-btn--bad:hover { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

    .dm-pill {
        display: inline-flex; align-items: center; padding: 3px 11px;
        border-radius: 999px; font-size: .68rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
    }
    .dm-pill--inline { font-size: .62rem; padding: 2px 9px; vertical-align: middle; }
    .dm-pill--muted  { background: var(--surface-2); color: var(--text-dim); }
    .dm-pill--accent { background: var(--accent-soft); color: var(--accent); }
    .dm-pill--good   { background: var(--good-soft); color: var(--good); }
</style>

<script>
    document.getElementById('searchProduct')?.addEventListener('input', function () {
        const q = this.value.toLowerCase();
        document.querySelectorAll('.product-item').forEach(item => {
            const name = item.querySelector('span').textContent.toLowerCase();
            item.style.display = name.includes(q) ? '' : 'none';
        });
    });

    function selectAll() {
        document.querySelectorAll('input[name="productIds"]').forEach(cb => {
            if (cb.closest('.product-item').style.display !== 'none') {
                cb.checked = true;
            }
        });
    }
</script>

</body>
</html>
