<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Quản lý Collection</title></head>
<body>

<div class="dm-dash">
    <div class="dm-glow dm-glow--a"></div>
    <div class="dm-glow dm-glow--b"></div>

    <div class="dm-content">

        <!-- ==================== HEADER ==================== -->
        <div class="dm-header">
            <div>
                <p class="dm-eyebrow">Bộ sưu tập</p>
                <h1 class="dm-title">Quản lý Collection</h1>
            </div>
            <a th:href="@{/admin/collections/new}" class="dm-btn dm-btn--solid">
                <i class="bi bi-plus-lg"></i>Tạo mới
            </a>
        </div>

        <!-- ==================== EMPTY ==================== -->
        <div th:if="${#lists.isEmpty(collections)}" class="dm-card">
            <div class="dm-empty">Chưa có collection nào</div>
        </div>

        <!-- ==================== GRID ==================== -->
        <div class="dm-grid dm-grid--3 dm-stagger" th:unless="${#lists.isEmpty(collections)}">
            <div th:each="c : ${collections}" class="dm-coll-card">

                <img th:if="${c.coverImage != null}" th:src="${c.coverImage}" class="dm-coll-cover"/>
                <div th:unless="${c.coverImage != null}" class="dm-coll-cover dm-coll-cover--empty">
                    <i class="bi bi-image"></i>
                </div>

                <div class="dm-coll-body">
                    <div class="dm-coll-title-row">
                        <h6 class="dm-coll-name" th:text="${c.name}"></h6>
                        <span th:if="${c.isActive}" class="dm-pill dm-pill--good">Active</span>
                        <span th:unless="${c.isActive}" class="dm-pill dm-pill--muted">Ẩn</span>
                    </div>

                    <p class="dm-coll-desc" th:text="${c.description}"></p>

                    <div class="dm-coll-meta">
                        <i class="bi bi-box-seam"></i>
                        <span th:text="${c.products.size()} + ' sản phẩm'"></span>
                    </div>

                    <div class="dm-coll-meta" th:if="${c.startDate != null or c.endDate != null}">
                        <i class="bi bi-calendar"></i>
                        <span th:if="${c.startDate != null}" th:text="${#temporals.format(c.startDate, 'dd/MM/yyyy')}"></span>
                        <span th:if="${c.startDate != null and c.endDate != null}">—</span>
                        <span th:if="${c.endDate != null}" th:text="${#temporals.format(c.endDate, 'dd/MM/yyyy')}"></span>
                    </div>
                </div>

                <div class="dm-coll-footer">
                    <a th:href="@{'/admin/collections/' + ${c.id}}" class="dm-btn dm-btn--grow">
                        <i class="bi bi-pencil"></i>Quản lý
                    </a>
                    <a th:href="@{'/admin/collections/' + ${c.id} + '/toggle'}"
                       th:class="${c.isActive} ? 'dm-icon-btn dm-icon-btn--warn' : 'dm-icon-btn dm-icon-btn--good'"
                       th:title="${c.isActive} ? 'Ẩn collection' : 'Hiển thị collection'">
                        <i th:class="${c.isActive} ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                    </a>
                    <a th:href="@{'/admin/collections/' + ${c.id} + '/delete'}"
                       class="dm-icon-btn dm-icon-btn--bad" title="Xóa"
                       onclick="return confirm('Xóa collection này?')">
                        <i class="bi bi-trash"></i>
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    .dm-dash {
        --bg: #0b0d12;
        --surface: #12151d;
        --surface-2: #1a1e29;
        --border: rgba(255,255,255,.07);
        --border-strong: rgba(255,255,255,.14);
        --text: #f5f6f9;
        --text-dim: #d3d6e0;
        --text-faint: #a6abbd;
        --accent: #8b7cf6;
        --accent-soft: rgba(139,124,246,.14);
        --good: #34d399;
        --good-soft: rgba(52,211,153,.13);
        --bad: #f2637a;
        --bad-soft: rgba(242,99,122,.13);
        --warn: #f5b95c;
        --warn-soft: rgba(245,185,92,.13);
        --radius: 18px;

        position: relative;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        border-radius: 0px;
        padding: 32px;
        margin: -24px -24px 0;
    }
    @media (max-width: 767px) { .dm-dash { padding: 18px; margin: -24px -24px 0; } }

    .dm-glow {
        position: absolute; width: 480px; height: 480px; border-radius: 50%;
        filter: blur(110px); opacity: .16; pointer-events: none;
        animation: dmDrift 14s ease-in-out infinite alternate;
    }
    .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
    .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }
    @keyframes dmDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px, 25px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .dm-glow, .dm-stagger > * { animation: none !important; opacity: 1 !important; } }

    .dm-content { position: relative; z-index: 1; }

    .dm-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 12px; flex-wrap: wrap; }
    .dm-eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
    .dm-title { font-size: 1.7rem; font-weight: 800; margin: 0; letter-spacing: -.02em; }

    .dm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .dm-empty { text-align: center; padding: 28px 0; color: var(--text-faint); font-size: .85rem; }

    .dm-grid { display: grid; gap: 16px; }
    .dm-grid--3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 991px) { .dm-grid--3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .dm-grid--3 { grid-template-columns: 1fr; } }

    .dm-stagger > * { opacity: 0; animation: dmFadeUp .5s ease forwards; }
    .dm-stagger > *:nth-child(n) { animation-delay: calc(.04s * var(--i, 0)); }
    @keyframes dmFadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .dm-coll-card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        overflow: hidden; display: flex; flex-direction: column;
        transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .dm-coll-card:hover { transform: translateY(-3px); border-color: var(--border-strong); box-shadow: 0 16px 40px rgba(0,0,0,.35); }

    .dm-coll-cover { width: 100%; height: 170px; object-fit: cover; display: block; background: var(--surface-2); }
    .dm-coll-cover--empty { display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 2.2rem; }

    .dm-coll-body { padding: 18px; flex-grow: 1; }
    .dm-coll-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .dm-coll-name { font-size: .98rem; font-weight: 700; margin: 0; }
    .dm-coll-desc {
        font-size: .82rem; color: var(--text-dim); margin: 0 0 10px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .dm-coll-meta { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--text-faint); margin-top: 4px; }
    .dm-coll-meta i { color: var(--accent); }

    .dm-coll-footer { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); }

    .dm-btn {
        display: inline-flex; align-items: center; gap: 6px; justify-content: center;
        border: 1px solid var(--border); color: var(--text-dim);
        background: transparent; border-radius: 999px;
        font-size: .82rem; font-weight: 600; padding: 8px 16px;
        text-decoration: none; transition: all .2s ease; cursor: pointer;
    }
    .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .dm-btn--solid { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dm-btn--solid:hover { background: #7a6af0; border-color: #7a6af0; color: #fff; }
    .dm-btn--grow { flex-grow: 1; }

    .dm-icon-btn {
        display: inline-flex; align-items: center; justify-content: center;
        flex-shrink: 0; width: 34px; height: 34px; border-radius: 9px;
        border: 1px solid var(--border); color: var(--text-dim); background: transparent;
        text-decoration: none; transition: all .2s ease;
    }
    .dm-icon-btn--warn:hover { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
    .dm-icon-btn--good:hover { border-color: var(--good); color: var(--good); background: var(--good-soft); }
    .dm-icon-btn--bad:hover { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

    .dm-pill {
        display: inline-flex; align-items: center; padding: 3px 11px;
        border-radius: 999px; font-size: .68rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; flex-shrink: 0;
    }
    .dm-pill--muted { background: var(--surface-2); color: var(--text-dim); }
    .dm-pill--good  { background: var(--good-soft); color: var(--good); }
</style>

</body>
</html>
