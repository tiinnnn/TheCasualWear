<div xmlns:th="http://www.thymeleaf.org">
    <div class="dm-dash">
        <div class="dm-glow dm-glow--a"></div>
        <div class="dm-glow dm-glow--b"></div>

        <div class="dm-content">

            <!-- ==================== HEADER ==================== -->
            <div class="dm-header">
                <div>
                    <p class="dm-eyebrow">Quản lý kho</p>
                    <h1 class="dm-title"><i class="bi bi-truck"></i>Phiếu nhập kho</h1>
                </div>
                <a class="dm-btn dm-btn--solid" th:href="@{/admin/warehouse/receipts/add}">
                    <i class="bi bi-plus-lg"></i>Tạo phiếu nhập
                </a>
            </div>

            <!-- ==================== FILTER ==================== -->
            <div class="dm-card mb-4">
                <form th:action="@{/admin/warehouse/receipts}" method="get" class="dm-filter-row">
                    <div class="dm-form-group">
                        <label class="dm-label">Mã phiếu</label>
                        <input type="text" class="dm-input" name="code" th:value="${code}" placeholder="VD: PN-20260807"/>
                    </div>
                    <div class="dm-form-group">
                        <label class="dm-label">Nhà cung cấp</label>
                        <input type="text" class="dm-input" name="supplierName" th:value="${supplierName}" placeholder="Tên nhà cung cấp"/>
                    </div>
                    <div class="dm-form-group">
                        <label class="dm-label">Từ ngày</label>
                        <input type="date" class="dm-input" name="fromDate" th:value="${fromDate}"/>
                    </div>
                    <div class="dm-form-group">
                        <label class="dm-label">Đến ngày</label>
                        <input type="date" class="dm-input" name="toDate" th:value="${toDate}"/>
                    </div>
                    <div class="dm-filter-actions">
                        <button type="submit" class="dm-btn dm-btn--solid">
                            <i class="bi bi-search"></i>Lọc
                        </button>
                        <a class="dm-btn" th:href="@{/admin/warehouse/receipts}" title="Xóa lọc">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </form>
            </div>

            <!-- ==================== TABLE ==================== -->
            <div class="dm-card">
                <div class="dm-table-wrap">
                    <table class="dm-table">
                        <colgroup>
                            <col style="width:14%">
                            <col style="width:22%">
                            <col style="width:14%">
                            <col style="width:14%">
                            <col style="width:10%">
                            <col style="width:16%">
                            <col style="width:10%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>Mã phiếu</th>
                            <th>Nhà cung cấp</th>
                            <th>Người tạo</th>
                            <th>Ngày tạo</th>
                            <th class="dm-text-end">Tổng SL</th>
                            <th class="dm-text-end">Tổng tiền</th>
                            <th class="dm-text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${receipts}">
                            <td>
                                <a th:href="@{/admin/warehouse/receipts/{id}(id=${r.id})}"
                                   th:text="${r.code}" class="dm-link-strong"></a>
                            </td>
                            <td class="dm-text-dim dm-truncate" th:text="${r.supplierName}"></td>
                            <td class="dm-text-dim dm-truncate" th:text="${r.createdBy != null ? r.createdBy.username : '—'}"></td>
                            <td class="dm-text-dim" th:text="${#temporals.format(r.createdAt, 'HH:mm dd/MM/yyyy')}"></td>
                            <td class="dm-text-end" th:text="${r.items != null ? #aggregates.sum(r.items.![quantity]) : 0}"></td>
                            <td class="dm-text-end dm-cell-strong"
                                th:text="${#numbers.formatDecimal(r.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="dm-text-center">
                                <a class="dm-icon-btn dm-icon-btn--accent" title="Xem chi tiết"
                                   th:href="@{/admin/warehouse/receipts/{id}(id=${r.id})}">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(receipts)}">
                            <td colspan="7" class="dm-empty">Không tìm thấy phiếu nhập kho phù hợp</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

        .dm-dash {
            --bg: #0b0d12; --surface: #12151d; --surface-2: #1a1e29;
            --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.14);
            --text: #f5f6f9; --text-dim: #d3d6e0; --text-faint: #a6abbd;
            --accent: #8b7cf6; --accent-soft: rgba(139,124,246,.14);
            --good: #34d399; --good-soft: rgba(52,211,153,.13);
            --bad: #f2637a; --bad-soft: rgba(242,99,122,.13);
            --warn: #f5b95c; --warn-soft: rgba(245,185,92,.13);
            --radius: 18px;
            position: relative; overflow: hidden; background: var(--bg); color: var(--text);
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 32px; margin: -24px -24px 0;
        }
        @media (max-width: 767px) { .dm-dash { padding: 18px; margin: -24px -24px 0; } }

        .dm-glow { position: absolute; width: 480px; height: 480px; border-radius: 50%; filter: blur(110px); opacity: .16; pointer-events: none; animation: dmDrift 14s ease-in-out infinite alternate; }
        .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
        .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }
        @keyframes dmDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px, 25px) scale(1.12); } }
        @media (prefers-reduced-motion: reduce) { .dm-glow { animation: none !important; opacity: 1 !important; } }

        .dm-content { position: relative; z-index: 1; }

        .dm-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 12px; flex-wrap: wrap; }
        .dm-eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
        .dm-title { font-size: 1.6rem; font-weight: 800; margin: 0; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
        .dm-title i { color: var(--accent); }

        .dm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
        .mb-4 { margin-bottom: 24px; }

        .dm-filter-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
        .dm-filter-actions { display: flex; gap: 8px; }
        .dm-form-group { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
        .dm-label { font-size: .78rem; font-weight: 600; color: var(--text-dim); }

        .dm-input, .dm-select {
            background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
            border-radius: 10px; padding: 9px 12px; font-size: .87rem; font-family: inherit;
            outline: none; transition: border-color .2s ease; width: 100%; box-sizing: border-box;
        }
        .dm-input:focus, .dm-select:focus { border-color: var(--accent); }
        .dm-input::placeholder { color: var(--text-faint); }

        .dm-text-dim { color: var(--text-dim); }
        .dm-text-end { text-align: right; }
        .dm-text-center { text-align: center; }
        .dm-cell-strong { font-weight: 700; }
        .dm-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .dm-link-strong { color: var(--text); font-weight: 700; text-decoration: none; }
        .dm-link-strong:hover { color: var(--accent); text-decoration: underline; }

        .dm-table-wrap { overflow-x: hidden; }
        .dm-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: .86rem; }
        .dm-table thead th {
            text-align: left; text-transform: uppercase; letter-spacing: .03em;
            font-size: .66rem; font-weight: 700; color: var(--text-faint);
            padding: 0 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        /* Độ ưu tiên của ".dm-table thead th" (1 class + 2 thẻ) cao hơn class tiện ích
           ".dm-text-end"/".dm-text-center" (1 class) nên phải viết lại rõ ràng ở đây,
           nếu không header sẽ luôn bị ép căn trái dù đã gắn class căn phải/giữa. */
        .dm-table th.dm-text-end   { text-align: right; }
        .dm-table th.dm-text-center { text-align: center; }
        .dm-table tbody td {
            padding: 13px 10px; border-bottom: 1px solid var(--border);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dm-table tbody tr:last-child td { border-bottom: none; }
        .dm-table tbody tr { transition: background .2s ease; }
        .dm-table tbody tr:hover { background: var(--surface-2); }

        .dm-empty { text-align: center; padding: 28px 0; color: var(--text-faint); font-size: .85rem; white-space: normal; }

        .dm-icon-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 8px;
            border: 1px solid var(--border); color: var(--text-dim); background: transparent;
            text-decoration: none; transition: all .2s ease;
        }
        .dm-icon-btn--accent:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

        .dm-btn {
            display: inline-flex; align-items: center; gap: 6px; justify-content: center;
            border: 1px solid var(--border); color: var(--text-dim);
            background: transparent; border-radius: 999px;
            font-size: .82rem; font-weight: 600; padding: 8px 16px;
            text-decoration: none; transition: all .2s ease; cursor: pointer;
        }
        .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
        .dm-btn--solid { background: var(--accent); border-color: var(--accent); color: #fff; }
        .dm-btn--solid:hover { background: #7a6af0; border-color: #7a6af0; color: #fff; }

        @media (max-width: 680px) {
            .dm-table-wrap { overflow-x: auto; }
            .dm-table { table-layout: auto; min-width: 780px; }
            .dm-table td, .dm-table th { white-space: nowrap; overflow: visible; text-overflow: clip; }
        }
    </style>
</div>
