<div xmlns:th="http://www.thymeleaf.org">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-truck me-2"></i>Phiếu nhập kho</h4>
        <a class="btn btn-dark btn-sm" th:href="@{/admin/warehouse/receipts/add}">
            <i class="bi bi-plus-lg me-1"></i>Tạo phiếu nhập
        </a>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form th:action="@{/admin/warehouse/receipts}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Mã phiếu</label>
                    <input type="text" class="form-control" name="code" th:value="${code}"
                           placeholder="VD: PN-20260807"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nhà cung cấp</label>
                    <input type="text" class="form-control" name="supplierName" th:value="${supplierName}"
                           placeholder="Tên nhà cung cấp"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Từ ngày</label>
                    <input type="date" class="form-control" name="fromDate" th:value="${fromDate}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Đến ngày</label>
                    <input type="date" class="form-control" name="toDate" th:value="${toDate}"/>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-dark flex-fill">
                        <i class="bi bi-search me-1"></i>Lọc
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/warehouse/receipts}">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã phiếu</th>
                    <th>Nhà cung cấp</th>
                    <th>Người tạo</th>
                    <th>Ngày tạo</th>
                    <th class="text-end">Tổng SL</th>
                    <th class="text-end">Tổng tiền</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${receipts}">
                    <td>
                        <a th:href="@{/admin/warehouse/receipts/{id}(id=${r.id})}"
                           th:text="${r.code}" class="fw-semibold text-decoration-none"></a>
                    </td>
                    <td th:text="${r.supplierName}">Nhà cung cấp</td>
                    <td th:text="${r.createdBy != null ? r.createdBy.username : '—'}">Người tạo</td>
                    <td th:text="${#temporals.format(r.createdAt, 'HH:mm dd/MM/yyyy')}">--</td>
                    <td class="text-end"
                        th:text="${r.items != null ? #aggregates.sum(r.items.![quantity]) : 0}">0</td>
                    <td class="text-end fw-semibold"
                        th:text="${#numbers.formatDecimal(r.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>
                    <td class="text-center">
                        <a class="btn btn-sm btn-outline-dark"
                           th:href="@{/admin/warehouse/receipts/{id}(id=${r.id})}">
                            <i class="bi bi-eye"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(receipts)}">
                    <td colspan="7" class="text-center text-muted py-4">Không tìm thấy phiếu nhập kho phù hợp</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
