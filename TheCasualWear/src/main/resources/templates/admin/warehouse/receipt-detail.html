<div xmlns:th="http://www.thymeleaf.org">
    <div class="dm-dash">
        <div class="dm-glow dm-glow--a"></div>
        <div class="dm-glow dm-glow--b"></div>

        <div class="dm-content">

            <!-- ==================== HEADER ==================== -->
            <div class="dm-header">
                <div>
                    <p class="dm-eyebrow">Quản lý kho</p>
                    <h1 class="dm-title"><i class="bi bi-truck"></i>Phiếu nhập <span th:text="${receipt.code}"></span></h1>
                </div>
                <a class="dm-btn" th:href="@{/admin/warehouse/receipts}">
                    <i class="bi bi-arrow-left"></i>Quay lại danh sách
                </a>
            </div>

            <!-- ==================== THÔNG TIN PHIẾU ==================== -->
            <div class="dm-card mb-4">
                <div class="dm-info-grid">
                    <div class="dm-info-item">
                        <div class="dm-info-label">Mã phiếu</div>
                        <div class="dm-info-value" th:text="${receipt.code}"></div>
                    </div>
                    <div class="dm-info-item">
                        <div class="dm-info-label">Nhà cung cấp</div>
                        <div class="dm-info-value" th:text="${receipt.supplierName}"></div>
                    </div>
                    <div class="dm-info-item">
                        <div class="dm-info-label">Người tạo</div>
                        <div class="dm-info-value" th:text="${receipt.createdBy != null ? receipt.createdBy.username : '—'}"></div>
                    </div>
                    <div class="dm-info-item">
                        <div class="dm-info-label">Ngày tạo</div>
                        <div class="dm-info-value" th:text="${#temporals.format(receipt.createdAt, 'HH:mm dd/MM/yyyy')}"></div>
                    </div>
                    <div class="dm-info-item dm-info-item--full" th:if="${receipt.note != null and !#strings.isEmpty(receipt.note)}">
                        <div class="dm-info-label">Ghi chú</div>
                        <div class="dm-info-value dm-text-dim" th:text="${receipt.note}"></div>
                    </div>
                </div>
            </div>

            <!-- ==================== DANH SÁCH SẢN PHẨM ==================== -->
            <div class="dm-card">
                <div class="dm-section-title">
                    <span><i class="bi bi-box-seam"></i>Danh sách sản phẩm nhập</span>
                </div>
                <div class="dm-table-wrap">
                    <table class="dm-table">
                        <colgroup>
                            <col style="width:13%">
                            <col style="width:27%">
                            <col style="width:9%">
                            <col style="width:9%">
                            <col style="width:12%">
                            <col style="width:15%">
                            <col style="width:15%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>SKU</th>
                            <th>Sản phẩm</th>
                            <th>Size</th>
                            <th>Màu</th>
                            <th class="dm-text-end">Số lượng</th>
                            <th class="dm-text-end">Đơn giá</th>
                            <th class="dm-text-end">Thành tiền</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${receipt.items}">
                            <td class="dm-cell-strong" th:text="${item.variant.sku}"></td>
                            <td class="dm-text-dim dm-truncate" th:text="${item.variant.product != null ? item.variant.product.name : '—'}"></td>
                            <td class="dm-text-dim" th:text="${item.variant.size != null ? item.variant.size.name : '—'}"></td>
                            <td class="dm-text-dim" th:text="${item.variant.color != null ? item.variant.color.name : '—'}"></td>
                            <td class="dm-text-end" th:text="${item.quantity}"></td>
                            <td class="dm-text-end" th:text="${#numbers.formatDecimal(item.unitCostPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="dm-text-end dm-cell-strong" th:text="${#numbers.formatDecimal(item.quantity * item.unitCostPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(receipt.items)}">
                            <td colspan="7" class="dm-empty">Phiếu nhập không có sản phẩm</td>
                        </tr>
                        </tbody>
                        <tfoot th:if="${!#lists.isEmpty(receipt.items)}">
                        <tr>
                            <td colspan="6" class="dm-text-end dm-total-label">Tổng cộng</td>
                            <td class="dm-text-end dm-total-value"
                                th:text="${#numbers.formatDecimal(receipt.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

        .dm-dash {
            --bg: #0b0d12; --surface: #12151d; --surface-2: #1a1e29;
            --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.14);
            --text: #f5f6f9; --text-dim: #d3d6e0; --text-faint: #a6abbd;
            --accent: #8b7cf6; --accent-soft: rgba(139,124,246,.14);
            --good: #34d399; --good-soft: rgba(52,211,153,.13);
            --bad: #f2637a; --bad-soft: rgba(242,99,122,.13);
            --warn: #f5b95c; --warn-soft: rgba(245,185,92,.13);
            --radius: 18px;
            position: relative; overflow: hidden; background: var(--bg); color: var(--text);
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 32px; margin: -24px -24px 0;
        }
        @media (max-width: 767px) { .dm-dash { padding: 18px; margin: -24px -24px 0; } }

        .dm-glow { position: absolute; width: 480px; height: 480px; border-radius: 50%; filter: blur(110px); opacity: .16; pointer-events: none; animation: dmDrift 14s ease-in-out infinite alternate; }
        .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
        .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }
        @keyframes dmDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px, 25px) scale(1.12); } }
        @media (prefers-reduced-motion: reduce) { .dm-glow { animation: none !important; opacity: 1 !important; } }

        .dm-content { position: relative; z-index: 1; }

        .dm-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 12px; flex-wrap: wrap; }
        .dm-eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
        .dm-title { font-size: 1.5rem; font-weight: 800; margin: 0; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
        .dm-title i { color: var(--accent); }

        .dm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
        .mb-4 { margin-bottom: 24px; }

        .dm-info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
        .dm-info-item--full { grid-column: 1 / -1; }
        .dm-info-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); margin-bottom: 4px; }
        .dm-info-value { font-size: .92rem; font-weight: 700; }
        @media (max-width: 767px) { .dm-info-grid { grid-template-columns: repeat(2, 1fr); } }

        .dm-section-title {
            display: flex; align-items: center; font-weight: 700; font-size: .92rem;
            margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
        }
        .dm-section-title i { margin-right: 8px; color: var(--accent); }

        .dm-text-dim { color: var(--text-dim); }
        .dm-text-end { text-align: right; }
        .dm-cell-strong { font-weight: 700; }
        .dm-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .dm-table-wrap { overflow-x: hidden; }
        .dm-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: .86rem; }
        .dm-table thead th {
            text-align: left; text-transform: uppercase; letter-spacing: .03em;
            font-size: .66rem; font-weight: 700; color: var(--text-faint);
            padding: 0 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        .dm-table tbody td {
            padding: 13px 10px; border-bottom: 1px solid var(--border);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dm-table tbody tr:last-child td { border-bottom: none; }
        .dm-table tbody tr { transition: background .2s ease; }
        .dm-table tbody tr:hover { background: var(--surface-2); }
        .dm-table tfoot td { padding: 14px 10px 4px; border-bottom: none; }
        .dm-total-label { font-weight: 700; color: var(--text-dim); }
        .dm-total-value { font-weight: 800; font-size: 1rem; color: var(--accent); }

        .dm-empty { text-align: center; padding: 28px 0; color: var(--text-faint); font-size: .85rem; white-space: normal; }

        .dm-btn {
            display: inline-flex; align-items: center; gap: 6px; justify-content: center;
            border: 1px solid var(--border); color: var(--text-dim);
            background: transparent; border-radius: 999px;
            font-size: .82rem; font-weight: 600; padding: 8px 16px;
            text-decoration: none; transition: all .2s ease; cursor: pointer;
        }
        .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

        @media (max-width: 680px) {
            .dm-table-wrap { overflow-x: auto; }
            .dm-table { table-layout: auto; min-width: 680px; }
            .dm-table td, .dm-table th { white-space: nowrap; overflow: visible; text-overflow: clip; }
        }
    </style>
</div>
