<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Quản lý ca làm việc</title></head>
<body>
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h4 class="fw-bold mb-0">
        Ca làm việc
        <small class="text-muted fs-6" th:text="'(' + ${#lists.size(shifts)} + ' ca)'"></small>
    </h4>
    <a th:href="@{/admin/shifts/daily-summary}" class="btn btn-dark btn-sm">
        <i class="bi bi-graph-up me-1"></i>Tổng kết cuối ngày
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-0 table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Quầy</th>
                <th>Thu ngân</th>
                <th>Mở ca</th>
                <th>Đóng ca</th>
                <th>Tiền đầu ca</th>
                <th>Tiền lẽ ra có</th>
                <th>Tiền đếm thực tế</th>
                <th>Chênh lệch</th>
                <th>SL bán</th>
                <th>Trạng thái</th>
                <th>Bàn giao</th>
                <th>Ghi chú</th>
                <th>Chi tiết</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(shifts)}">
                <td colspan="13" class="text-center text-muted py-4">Chưa có ca làm việc nào.</td>
            </tr>
            <tr th:each="s : ${shifts}">
                <td th:text="${s.counter != null ? s.counter.code : '-'}"></td>
                <td th:text="${s.cashier.username}"></td>
                <td th:text="${#temporals.format(s.openedAt, 'HH:mm dd/MM/yyyy')}"></td>
                <td th:text="${s.closedAt != null ? #temporals.format(s.closedAt, 'HH:mm dd/MM/yyyy') : '-'}"></td>
                <td th:text="${#numbers.formatInteger(s.openingCash, 0, 'COMMA') + ' đ'}"></td>
                <td th:text="${s.expectedCash != null ? #numbers.formatInteger(s.expectedCash, 0, 'COMMA') + ' đ' : '-'}"></td>
                <td th:text="${s.actualCash != null ? #numbers.formatInteger(s.actualCash, 0, 'COMMA') + ' đ' : '-'}"></td>
                <td>
                    <span th:if="${s.cashDifference != null}"
                          th:classappend="${s.cashDifference.signum() < 0 ? 'text-danger' : 'text-success'}"
                          class="fw-semibold"
                          th:text="${(s.cashDifference.signum() > 0 ? '+' : '') + #numbers.formatInteger(s.cashDifference, 0, 'COMMA') + ' đ'}"></span>
                    <span th:if="${s.cashDifference == null}">-</span>
                </td>
                <td th:text="${s.itemsSoldCount != null ? s.itemsSoldCount : '-'}"></td>
                <td>
                    <span th:if="${s.status.name() == 'OPEN'}" class="badge bg-success">Đang mở</span>
                    <span th:if="${s.status.name() == 'CLOSED'}" class="badge bg-secondary">Đã đóng</span>
                </td>
                <td>
                    <span th:if="${s.status.name() == 'OPEN'}" class="text-muted small">-</span>
                    <span th:if="${s.status.name() == 'CLOSED' and s.handoverConfirmedBy != null}"
                          class="badge bg-success" th:title="${s.handoverNote}">
                        <i class="bi bi-check2"></i> [[${s.handoverConfirmedBy.username}]]
                    </span>
                    <div th:if="${s.status.name() == 'CLOSED' and s.handoverConfirmedBy == null}">
                        <span class="badge bg-warning text-dark d-block mb-1">Chờ xác nhận</span>
                        <form th:action="@{'/admin/shifts/' + ${s.id} + '/confirm-handover'}"
                              method="post"
                              onsubmit="return confirm('Xác nhận số liệu ca này thay cho ca sau?')">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                Xác nhận (Admin)
                            </button>
                        </form>
                    </div>
                </td>
                <td class="small text-muted" style="max-width: 220px"
                    th:title="${s.note}"
                    th:text="${s.note != null and !s.note.isBlank()
                               ? (s.note.length() > 40 ? s.note.substring(0,40) + '…' : s.note)
                               : '-'}"></td>
                <td>
                    <a th:href="@{'/admin/shifts/' + ${s.id} + '/items'}"
                       class="btn btn-sm btn-outline-primary" title="Xem sản phẩm đã bán">
                        <i class="bi bi-list-ul"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
