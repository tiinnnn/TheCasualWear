<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Quản lý ca làm việc</title></head>
<body>

<div class="dm-dash">
    <div class="dm-glow dm-glow--a"></div>
    <div class="dm-glow dm-glow--b"></div>

    <div class="dm-content">

        <!-- ==================== HEADER ==================== -->
        <div class="dm-header">
            <div>
                <p class="dm-eyebrow">Bán hàng &amp; thu ngân</p>
                <h1 class="dm-title">
                    Ca làm việc
                    <span class="dm-text-faint" style="font-size:1rem;font-weight:600"
                          th:text="'(' + ${#lists.size(shifts)} + ' ca)'"></span>
                </h1>
            </div>
            <a th:href="@{/admin/shifts/daily-summary}" class="dm-btn dm-btn--accent">
                <i class="bi bi-graph-up-arrow me-1"></i>Tổng kết cuối ngày
            </a>
        </div>

        <!-- ==================== BỘ LỌC ==================== -->
        <form method="get" th:action="@{/admin/shifts}" class="dm-filter">
            <div class="dm-filter-field">
                <label>Quầy</label>
                <select name="counterId" class="dm-select">
                    <option value="">Tất cả</option>
                    <option th:each="c : ${counters}" th:value="${c.id}" th:text="${c.code}"
                            th:selected="${counterId != null and counterId == c.id}"></option>
                </select>
            </div>
            <div class="dm-filter-field">
                <label>Nhân viên</label>
                <select name="cashierId" class="dm-select">
                    <option value="">Tất cả</option>
                    <option th:each="u : ${cashiers}" th:value="${u.id}" th:text="${u.username}"
                            th:selected="${cashierId != null and cashierId == u.id}"></option>
                </select>
            </div>
            <div class="dm-filter-field">
                <label>Từ ngày</label>
                <input type="date" name="fromDate" class="dm-input" th:value="${fromDate}">
            </div>
            <div class="dm-filter-field">
                <label>Đến ngày</label>
                <input type="date" name="toDate" class="dm-input" th:value="${toDate}">
            </div>
            <div class="dm-filter-actions">
                <button type="submit" class="dm-btn dm-btn--accent">
                    <i class="bi bi-funnel me-1"></i>Lọc
                </button>
                <a th:href="@{/admin/shifts}" class="dm-btn">Xóa lọc</a>
            </div>
        </form>

        <!-- ==================== BẢNG CA LÀM VIỆC ==================== -->
        <div class="dm-card">
            <div th:if="${#lists.isEmpty(shifts)}" class="dm-empty">Không có ca nào khớp bộ lọc.</div>

            <div class="dm-table-wrap" th:if="${!#lists.isEmpty(shifts)}">
                <table class="dm-table">
                    <thead>
                    <tr>
                        <th>Quầy</th>
                        <th>Thu ngân</th>
                        <th>Mở ca</th>
                        <th>Đóng ca</th>
                        <th class="dm-text-end">Tiền đầu ca</th>
                        <th class="dm-text-end">Tiền lẽ ra có</th>
                        <th class="dm-text-end">Tiền đếm thực tế</th>
                        <th class="dm-text-center">Trạng thái</th>
                        <th>Bàn giao</th>
                        <th class="dm-text-center dm-sticky-right">Chi tiết</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${shifts}">
                        <td class="dm-cell-strong" th:text="${s.counter != null ? s.counter.code : '-'}"></td>
                        <td th:text="${s.cashier.username}"></td>
                        <td class="dm-text-dim" th:text="${#temporals.format(s.openedAt, 'HH:mm dd/MM/yyyy')}"></td>
                        <td class="dm-text-dim"
                            th:text="${s.closedAt != null ? #temporals.format(s.closedAt, 'HH:mm dd/MM/yyyy') : '-'}"></td>
                        <td class="dm-text-end" th:text="${#numbers.formatInteger(s.openingCash, 0, 'COMMA') + ' đ'}"></td>
                        <td class="dm-text-end"
                            th:text="${s.expectedCash != null ? #numbers.formatInteger(s.expectedCash, 0, 'COMMA') + ' đ' : '-'}"></td>
                        <td class="dm-text-end"
                            th:text="${s.actualCash != null ? #numbers.formatInteger(s.actualCash, 0, 'COMMA') + ' đ' : '-'}"></td>
                        <td class="dm-text-center">
                            <span th:if="${s.status.name() == 'OPEN'}" class="dm-pill dm-pill--good">Đang mở</span>
                            <span th:if="${s.status.name() == 'CLOSED'}" class="dm-pill dm-pill--muted">Đã đóng</span>
                        </td>
                        <td>
                            <span th:if="${s.status.name() == 'OPEN'}" class="dm-text-faint">-</span>
                            <span th:if="${s.status.name() == 'CLOSED' and s.handoverConfirmedBy != null}"
                                  class="dm-pill dm-pill--good" th:title="${s.handoverNote}">
                                <i class="bi bi-check2"></i>&nbsp;[[${s.handoverConfirmedBy.username}]]
                            </span>
                            <div th:if="${s.status.name() == 'CLOSED' and s.handoverConfirmedBy == null}">
                                <span class="dm-pill dm-pill--warn d-block mb-1" style="width:fit-content">Chờ xác nhận</span>
                                <form th:action="@{'/admin/shifts/' + ${s.id} + '/confirm-handover'}"
                                      method="post" class="dm-confirm-form"
                                      data-confirm-msg="Xác nhận số liệu ca này thay cho ca sau?">
                                    <button type="submit" class="dm-btn dm-btn--sm dm-btn--confirm">
                                        <i class="bi bi-exclamation-circle-fill me-1"></i>Xác nhận (Admin)
                                    </button>
                                </form>
                            </div>
                        </td>
                        <td class="dm-text-center dm-sticky-right">
                            <a th:href="@{'/admin/shifts/' + ${s.id} + '/items'}"
                               class="dm-btn dm-btn--sm" title="Xem sản phẩm đã bán">
                                <i class="bi bi-list-ul"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- ==================== MODAL XÁC NHẬN (thay cho confirm() của trình duyệt) ==================== -->
<div class="dm-confirm-overlay" id="dmConfirmOverlay">
    <div class="dm-confirm-box">
        <div class="dm-confirm-icon"><i class="bi bi-question-circle-fill"></i></div>
        <p class="dm-confirm-msg" id="dmConfirmMsg">Bạn có chắc chắn?</p>
        <div class="dm-confirm-actions">
            <button type="button" class="dm-btn" id="dmConfirmCancel">Hủy</button>
            <button type="button" class="dm-btn dm-btn--accent" id="dmConfirmOk">Xác nhận</button>
        </div>
    </div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    .dm-dash {
        --bg: #0b0d12;
        --surface: #12151d;
        --surface-2: #1a1e29;
        --border: rgba(255,255,255,.07);
        --border-strong: rgba(255,255,255,.14);
        --text: #eef0f4;
        --text-dim: #8d93a6;
        --text-faint: #5c6178;
        --accent: #8b7cf6;
        --accent-soft: rgba(139,124,246,.14);
        --good: #34d399;
        --good-soft: rgba(52,211,153,.13);
        --bad: #f2637a;
        --bad-soft: rgba(242,99,122,.13);
        --warn: #f5b95c;
        --warn-soft: rgba(245,185,92,.13);
        --radius: 18px;

        position: relative;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 32px;
        margin: -24px -24px 0;
    }
    @media (max-width: 767px) {
        .dm-dash { padding: 18px; margin: -24px -24px 0; }
    }

    .dm-glow {
        position: absolute;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        filter: blur(110px);
        opacity: .16;
        pointer-events: none;
        animation: dmDrift 14s ease-in-out infinite alternate;
    }
    .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
    .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }

    @keyframes dmDrift {
        from { transform: translate(0,0) scale(1); }
        to   { transform: translate(-30px, 25px) scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
        .dm-glow { animation: none !important; }
    }

    .dm-content { position: relative; z-index: 1; }

    .dm-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .dm-eyebrow {
        text-transform: uppercase; letter-spacing: .12em; font-size: .7rem;
        font-weight: 700; color: var(--accent); margin: 0 0 4px;
    }
    .dm-title { font-size: 1.7rem; font-weight: 800; margin: 0; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

    /* ── Bộ lọc ── */
    .dm-filter {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 14px;
        margin-bottom: 20px;
        padding: 16px 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
    }
    .dm-filter-field { display: flex; flex-direction: column; gap: 6px; }
    .dm-filter-field label {
        font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
        color: var(--text-faint); font-weight: 700;
    }
    .dm-select, .dm-input {
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 7px 10px;
        font-size: .82rem;
        font-family: inherit;
        min-width: 130px;
    }
    .dm-select:focus, .dm-input:focus { outline: none; border-color: var(--accent); }
    .dm-filter-actions { display: flex; gap: 8px; }

    .dm-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px;
    }

    .dm-text-faint { color: var(--text-faint); font-size: .78rem; }
    .dm-text-dim { color: var(--text-dim); }
    .dm-text-center { text-align: center; white-space: nowrap; }
    .dm-text-end { text-align: right; white-space: nowrap; }
    .dm-cell-strong { font-weight: 700; }
    .dm-cell-good { color: var(--good); font-weight: 700; }
    .dm-cell-bad { color: var(--bad); font-weight: 700; }

    .dm-btn {
        display: inline-flex; align-items: center; justify-content: center;
        border: 1px solid var(--border); color: var(--text-dim);
        background: transparent; border-radius: 999px;
        font-size: .78rem; font-weight: 600; padding: 6px 14px;
        text-decoration: none; cursor: pointer;
        transition: all .2s ease;
    }
    .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .dm-btn--sm { padding: 3px 10px; font-size: .72rem; }

    .dm-btn--accent {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
    }
    .dm-btn--accent:hover { background: #7a6cf0; border-color: #7a6cf0; color: #fff; }

    /* Nút "Xác nhận (Admin)" — cố tình làm nổi bật vì đây là hành động
       admin đứng ra thay ca sau, cần thu hút chú ý hơn các nút khác. */
    .dm-btn--confirm {
        background: var(--warn);
        border-color: var(--warn);
        color: #1a1300;
        font-weight: 800;
        box-shadow: 0 0 0 3px var(--warn-soft);
        animation: dmPulse 1.6s ease-in-out infinite;
    }
    .dm-btn--confirm:hover {
        background: #ffcb73;
        border-color: #ffcb73;
        color: #1a1300;
    }
    @keyframes dmPulse {
        0%, 100% { box-shadow: 0 0 0 3px var(--warn-soft); }
        50%      { box-shadow: 0 0 0 6px transparent; }
    }
    @media (prefers-reduced-motion: reduce) {
        .dm-btn--confirm { animation: none; }
    }

    .dm-pill {
        display: inline-flex; align-items: center; gap: 4px; padding: 3px 11px;
        border-radius: 999px; font-size: .7rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: .03em;
    }
    .dm-pill--muted  { background: var(--surface-2); color: var(--text-dim); }
    .dm-pill--accent { background: var(--accent-soft); color: var(--accent); }
    .dm-pill--good   { background: var(--good-soft); color: var(--good); }
    .dm-pill--bad    { background: var(--bad-soft); color: var(--bad); }
    .dm-pill--warn   { background: var(--warn-soft); color: var(--warn); }

    .dm-table-wrap {
        overflow-x: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
        padding-bottom: 6px;
    }
    .dm-table-wrap::-webkit-scrollbar { height: 6px; }
    .dm-table-wrap::-webkit-scrollbar-track { background: transparent; }
    .dm-table-wrap::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 999px;
    }
    .dm-table-wrap::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .dm-table { width: 100%; border-collapse: collapse; font-size: .87rem; background: transparent; }
    .dm-dash table, .dm-dash thead, .dm-dash tbody, .dm-dash tfoot,
    .dm-dash tr, .dm-dash th, .dm-dash td {
        background-color: transparent;
        color: inherit;
    }
    .dm-table thead th {
        text-align: left; text-transform: uppercase; letter-spacing: .04em;
        font-size: .68rem; font-weight: 700; color: var(--text-faint);
        padding: 0 10px 10px; border-bottom: 1px solid var(--border);
        white-space: nowrap;
    }
    .dm-table tbody td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
    .dm-table tbody tr:last-child td { border-bottom: none; }
    .dm-table tbody tr { transition: background .2s ease; }
    .dm-table tbody tr:hover { background: var(--surface-2); }

    .dm-sticky-right {
        position: sticky;
        right: 0;
        z-index: 2;
        background-color: var(--surface) !important;
        box-shadow: -6px 0 10px -6px rgba(0,0,0,.45);
    }
    thead .dm-sticky-right { z-index: 3; }

    .dm-empty {
        text-align: center; padding: 28px 0; color: var(--text-faint); font-size: .85rem;
    }

    /* ===== Modal xác nhận =====
       Đặt biến màu ngay trên .dm-confirm-overlay vì modal nằm NGOÀI .dm-dash
       (anh em, không phải con) nên không kế thừa được --surface/--text/--warn...
       khai báo trong .dm-dash — nếu không nền card sẽ trong suốt. */
    .dm-confirm-overlay {
        display: none; position: fixed; inset: 0; z-index: 1090;
        background: rgba(5,6,10,.62); backdrop-filter: blur(2px);
        align-items: center; justify-content: center; padding: 20px;
        --surface: #12151d; --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.14);
        --text: #eef0f4; --text-dim: #8d93a6; --warn: #f5b95c; --warn-soft: rgba(245,185,92,.13);
        --accent: #8b7cf6; --accent-soft: rgba(139,124,246,.14);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .dm-confirm-overlay.dm-show { display: flex; }
    .dm-confirm-box {
        background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px;
        padding: 26px 24px; max-width: 360px; width: 100%; text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,.5);
        animation: dmConfirmPop .18s ease-out;
    }
    @keyframes dmConfirmPop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .dm-confirm-icon { font-size: 1.8rem; color: var(--warn); margin-bottom: 10px; }
    .dm-confirm-msg { font-size: .92rem; font-weight: 600; color: var(--text); margin: 0 0 20px; line-height: 1.5; }
    .dm-confirm-actions { display: flex; gap: 10px; justify-content: center; }
    .dm-confirm-actions .dm-btn { flex: 1; padding: 8px 14px; }
</style>

<script>
    (function () {
        const overlay   = document.getElementById('dmConfirmOverlay');
        const msgEl     = document.getElementById('dmConfirmMsg');
        const btnOk     = document.getElementById('dmConfirmOk');
        const btnCancel = document.getElementById('dmConfirmCancel');
        let pendingForm  = null;
        let pendingHref  = null;

        function openModal(msg) {
            msgEl.textContent = msg || 'Bạn có chắc chắn?';
            overlay.classList.add('dm-show');
        }
        function closeModal() {
            overlay.classList.remove('dm-show');
            pendingForm = null;
            pendingHref = null;
        }

        // Form (vd: nút "Xác nhận (Admin)")
        document.querySelectorAll('form.dm-confirm-form').forEach(form => {
            form.addEventListener('submit', function (e) {
                if (this.dataset.confirmed === 'true') return; // đã xác nhận, cho submit thật
                e.preventDefault();
                pendingForm = this;
                openModal(this.dataset.confirmMsg);
            });
        });

        // Link đơn (vd: nút bật/tắt, xóa...)
        document.querySelectorAll('.dm-confirm-trigger').forEach(el => {
            el.addEventListener('click', function (e) {
                e.preventDefault();
                pendingHref = this.getAttribute('href');
                openModal(this.dataset.confirmMsg);
            });
        });

        btnOk.addEventListener('click', function () {
            if (pendingForm) {
                pendingForm.dataset.confirmed = 'true';
                pendingForm.submit();
            } else if (pendingHref) {
                window.location.href = pendingHref;
            }
            closeModal();
        });
        btnCancel.addEventListener('click', closeModal);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    })();
</script>

</body>
</html>
