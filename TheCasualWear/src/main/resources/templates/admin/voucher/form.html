<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Voucher</title></head>
<body>

<div class="dm-dash">
    <div class="dm-glow dm-glow--a"></div>
    <div class="dm-glow dm-glow--b"></div>

    <div class="dm-content">

        <!-- ==================== HEADER ==================== -->
        <div class="dm-header">
            <div>
                <p class="dm-eyebrow">Khuyến mãi</p>
                <h1 class="dm-title">Thêm voucher mới</h1>
            </div>
            <a th:href="@{/admin/vouchers}" class="dm-btn">
                <i class="bi bi-arrow-left"></i>Quay lại
            </a>
        </div>

        <!-- ==================== FORM ==================== -->
        <div class="dm-card dm-card--form">
            <form th:action="@{/admin/vouchers/save}" method="post" id="voucherForm">

                <div class="dm-form-group">
                    <label class="dm-label">Mã voucher <span class="dm-required">*</span></label>
                    <input type="text" name="code" class="dm-input dm-input--upper" required/>
                </div>

                <div class="dm-form-group">
                    <label class="dm-label">Mô tả</label>
                    <input type="text" name="description" class="dm-input"/>
                </div>

                <div class="dm-form-row dm-form-row--3">
                    <div class="dm-form-group">
                        <label class="dm-label">Phần trăm giảm (%)</label>
                        <input type="number" name="discountPercent" class="dm-input" min="1" max="100"/>
                    </div>
                    <div class="dm-form-group">
                        <label class="dm-label">Giảm tối đa (đ)</label>
                        <input type="number" name="maxDiscount" class="dm-input"/>
                        <small class="dm-text-faint">Trống = không giới hạn</small>
                    </div>
                    <div class="dm-form-group">
                        <label class="dm-label">Giá trị đơn tối thiểu (đ)</label>
                        <input type="number" name="minOrderValue" class="dm-input" value="0" min="0"/>
                    </div>
                </div>

                <div class="dm-form-row dm-form-row--2">
                    <div class="dm-form-group">
                        <label class="dm-label">Giới hạn lượt dùng</label>
                        <input type="number" name="usageLimit" class="dm-input" min="1"/>
                        <small class="dm-text-faint">Trống = không giới hạn</small>
                    </div>
                </div>

                <div class="dm-form-row dm-form-row--2">
                    <div class="dm-form-group">
                        <label class="dm-label">Ngày bắt đầu</label>
                        <input type="datetime-local" name="startDate" id="voucherStartDate" class="dm-input"/>
                        <small class="dm-text-faint" id="voucherStartErr" style="display:none;color:var(--bad)"></small>
                    </div>
                    <div class="dm-form-group">
                        <label class="dm-label">Ngày kết thúc</label>
                        <input type="datetime-local" name="endDate" id="voucherEndDate" class="dm-input"/>
                        <small class="dm-text-faint" id="voucherEndErr" style="display:none;color:var(--bad)"></small>
                    </div>
                </div>

                <div class="dm-form-actions">
                    <button type="submit" class="dm-btn dm-btn--solid">
                        <i class="bi bi-check-lg"></i>Lưu voucher
                    </button>
                    <a th:href="@{/admin/vouchers}" class="dm-btn">Hủy</a>
                </div>

            </form>
        </div>

    </div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    .dm-dash {
        --bg: #0b0d12;
        --surface: #12151d;
        --surface-2: #1a1e29;
        --border: rgba(255,255,255,.07);
        --border-strong: rgba(255,255,255,.14);
        --text: #f5f6f9;
        --text-dim: #d3d6e0;
        --text-faint: #a6abbd;
        --accent: #8b7cf6;
        --accent-soft: rgba(139,124,246,.14);
        --good: #34d399;
        --good-soft: rgba(52,211,153,.13);
        --bad: #f2637a;
        --bad-soft: rgba(242,99,122,.13);
        --warn: #f5b95c;
        --warn-soft: rgba(245,185,92,.13);
        --radius: 18px;

        position: relative;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        border-radius: 0px;
        padding: 32px;
        margin: -24px -24px 0;
    }
    @media (max-width: 767px) {
        .dm-dash { padding: 18px; margin: -24px -24px 0; }
    }

    .dm-glow {
        position: absolute; width: 480px; height: 480px; border-radius: 50%;
        filter: blur(110px); opacity: .16; pointer-events: none;
        animation: dmDrift 14s ease-in-out infinite alternate;
    }
    .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
    .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }
    @keyframes dmDrift {
        from { transform: translate(0,0) scale(1); }
        to   { transform: translate(-30px, 25px) scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) { .dm-glow { animation: none !important; opacity: 1 !important; } }

    .dm-content { position: relative; z-index: 1; }

    .dm-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 12px; flex-wrap: wrap; }
    .dm-eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
    .dm-title { font-size: 1.7rem; font-weight: 800; margin: 0; letter-spacing: -.02em; }

    .dm-card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 26px; transition: border-color .25s ease;
    }
    .dm-card--form { max-width: 640px; }

    .dm-text-faint { color: var(--text-faint); font-size: .78rem; }

    .dm-form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .dm-label { font-size: .8rem; font-weight: 600; color: var(--text-dim); }
    .dm-required { color: var(--bad); }

    .dm-input {
        background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 10px; padding: 10px 13px; font-size: .9rem; font-family: inherit;
        outline: none; transition: border-color .2s ease, box-shadow .2s ease; width: 100%;
        box-sizing: border-box;
    }
    .dm-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .dm-input--upper { text-transform: uppercase; }
    .dm-input::placeholder { color: var(--text-faint); }
    .dm-input--invalid { border-color: var(--bad) !important; box-shadow: 0 0 0 3px var(--bad-soft) !important; }

    .dm-form-row { display: grid; gap: 16px; margin-bottom: 0; }
    .dm-form-row--2 { grid-template-columns: repeat(2, 1fr); }
    .dm-form-row--3 { grid-template-columns: repeat(3, 1fr); }
    .dm-form-row .dm-form-group { margin-bottom: 18px; }
    @media (max-width: 600px) {
        .dm-form-row--2, .dm-form-row--3 { grid-template-columns: 1fr; }
    }

    .dm-form-actions { display: flex; gap: 10px; margin-top: 6px; }

    .dm-btn {
        display: inline-flex; align-items: center; gap: 6px; justify-content: center;
        border: 1px solid var(--border); color: var(--text-dim);
        background: transparent; border-radius: 999px;
        font-size: .82rem; font-weight: 600; padding: 8px 16px;
        text-decoration: none; transition: all .2s ease; cursor: pointer;
    }
    .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .dm-btn--solid { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dm-btn--solid:hover { background: #7a6af0; border-color: #7a6af0; color: #fff; }
</style>

<script>
    (function () {
        // ══ Validate ngày voucher ══
        // - Ngày bắt đầu chỉ cần rơi vào HÔM NAY trở về sau — so sánh theo
        //   NGÀY, không ép đúng giờ:phút hiện tại. Vì vậy admin vẫn có thể
        //   chọn giờ bắt đầu sớm hơn giờ hiện tại, miễn là cùng ngày hôm nay
        //   (VD: bây giờ 15:00 nhưng vẫn chọn được 09:00 hôm nay).
        // - Ngày kết thúc vẫn phải lớn hơn ngày bắt đầu (so theo datetime
        //   đầy đủ, không đổi).
        const form       = document.getElementById('voucherForm');
        const startInput = document.getElementById('voucherStartDate');
        const endInput   = document.getElementById('voucherEndDate');
        const startErr   = document.getElementById('voucherStartErr');
        const endErr     = document.getElementById('voucherEndErr');

        function pad(n) { return String(n).padStart(2, '0'); }

        // Định dạng datetime-local cần "YYYY-MM-DDTHH:mm" theo giờ LOCAL
        // (không dùng toISOString() vì nó trả về UTC, sẽ lệch múi giờ).
        function toLocalInputValue(date) {
            return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
                + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
        }

        function nowValue() { return toLocalInputValue(new Date()); }

        // Mốc "đầu ngày hôm nay" (00:00) — dùng làm min cho ngày bắt đầu,
        // thay vì giờ:phút hiện tại, để cho phép chọn bất kỳ giờ nào trong
        // hôm nay.
        function todayStartValue() {
            const d = new Date();
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T00:00';
        }

        // Lấy phần "YYYY-MM-DD" để so sánh THEO NGÀY, bỏ qua giờ:phút.
        function dateOnly(value) { return value ? value.slice(0, 10) : ''; }

        // min HTML5 chỉ chặn được thao tác chọn qua lịch/picker — vẫn cần
        // check lại lúc submit vì "hôm nay" trôi theo thời gian, và người
        // dùng có thể gõ tay giá trị cũ hơn min ban đầu.
        startInput.min = todayStartValue();

        function syncEndMin() {
            endInput.min = startInput.value || todayStartValue();
        }
        startInput.addEventListener('change', syncEndMin);
        syncEndMin();

        function showError(input, errEl, message) {
            input.classList.add('dm-input--invalid');
            errEl.textContent = message;
            errEl.style.display = 'block';
        }
        function clearError(input, errEl) {
            input.classList.remove('dm-input--invalid');
            errEl.style.display = 'none';
        }

        form.addEventListener('submit', function (e) {
            clearError(startInput, startErr);
            clearError(endInput, endErr);

            let hasError = false;
            const todayDate = dateOnly(todayStartValue());

            // Chỉ chặn khi NGÀY bắt đầu sớm hơn hôm nay — không quan tâm giờ.
            if (startInput.value && dateOnly(startInput.value) < todayDate) {
                showError(startInput, startErr, 'Ngày bắt đầu không được sớm hơn hôm nay!');
                hasError = true;
            }
            if (startInput.value && endInput.value
                && new Date(endInput.value) < new Date(startInput.value)) {
                showError(endInput, endErr, 'Ngày kết thúc không được sớm hơn ngày bắt đầu!');
                hasError = true;
            }

            if (hasError) e.preventDefault();
        });
    })();
</script>

</body>
</html>
