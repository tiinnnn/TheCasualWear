<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Quản lý voucher</title></head>
<body>

<div class="dm-dash">
    <div class="dm-glow dm-glow--a"></div>
    <div class="dm-glow dm-glow--b"></div>

    <div class="dm-content">

        <!-- ==================== HEADER ==================== -->
        <div class="dm-header">
            <div>
                <p class="dm-eyebrow">Khuyến mãi</p>
                <h1 class="dm-title">Quản lý Voucher</h1>
            </div>
            <a th:href="@{/admin/vouchers/edit}" class="dm-btn dm-btn--solid">
                <i class="bi bi-plus-lg"></i>Thêm voucher
            </a>
        </div>

        <!-- ==================== BỘ LỌC ==================== -->
        <div class="dm-card mb-4">
            <form th:action="@{/admin/vouchers}" method="get" class="dm-filter-row">
                <div class="dm-form-group dm-form-group--inline">
                    <label class="dm-label">Trạng thái</label>
                    <select name="status" class="dm-select">
                        <option value="">Tất cả</option>
                        <option value="true" th:selected="${selectedStatus == true}">Đang hoạt động</option>
                        <option value="false" th:selected="${selectedStatus == false}">Tắt</option>
                    </select>
                </div>
                <button type="submit" class="dm-btn">
                    <i class="bi bi-funnel"></i>Lọc
                </button>
            </form>
        </div>

        <!-- ==================== DANH SÁCH VOUCHER ==================== -->
        <div class="dm-card">
            <div class="dm-section-title">
                <span><i class="bi bi-ticket-perforated"></i>Danh sách voucher</span>
                <span class="dm-text-faint" th:text="${#lists.size(vouchers)} + ' voucher'"></span>
            </div>

            <div th:if="${#lists.isEmpty(vouchers)}" class="dm-empty">
                Chưa có voucher nào
            </div>

            <div class="dm-table-wrap" th:if="${!#lists.isEmpty(vouchers)}">
                <table class="dm-table">
                    <colgroup>
                        <col style="width:10%">
                        <col style="width:19%">
                        <col style="width:8%">
                        <col style="width:12%">
                        <col style="width:12%">
                        <col style="width:9%">
                        <col style="width:10%">
                        <col style="width:10%">
                        <col style="width:10%">
                    </colgroup>
                    <thead>
                    <tr>
                        <th>Code</th>
                        <th>Mô tả</th>
                        <th class="dm-text-center">Giảm</th>
                        <th class="dm-text-end">Đơn tối thiểu</th>
                        <th class="dm-text-end">Giảm tối đa</th>
                        <th class="dm-text-center">Lượt dùng</th>
                        <th>Hết hạn</th>
                        <th class="dm-text-center">Trạng thái</th>
                        <th class="dm-text-end">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${vouchers}">
                        <td class="dm-cell-strong dm-truncate" th:text="${v.code}"></td>
                        <td class="dm-text-dim dm-truncate" th:title="${v.description}" th:text="${v.description}"></td>
                        <td class="dm-text-center">
                            <span class="dm-pill dm-pill--accent" th:text="${v.discountPercent + '%'}"></span>
                        </td>
                        <td class="dm-text-end" th:text="${#numbers.formatInteger(v.minOrderValue, 0, 'COMMA') + ' đ'}"></td>
                        <td class="dm-text-end"
                            th:text="${v.maxDiscount != null ? #numbers.formatInteger(v.maxDiscount, 0, 'COMMA') + ' đ' : 'Không giới hạn'}"></td>
                        <td class="dm-text-center">
                            <span th:if="${v.usageLimit != null}"
                                  th:text="${v.usedCount} + ' / ' + ${v.usageLimit}"
                                  th:classappend="${v.usedCount >= v.usageLimit} ? ' dm-cell-bad dm-cell-strong' : ''"></span>
                            <span th:unless="${v.usageLimit != null}"
                                  class="dm-text-dim"
                                  th:text="${v.usedCount} + ' / ∞'"></span>
                        </td>
                        <td class="dm-text-dim"
                            th:text="${v.endDate != null ? #temporals.format(v.endDate, 'dd/MM/yyyy') : '∞'}"></td>
                        <td class="dm-text-center">
                            <span th:if="${v.isActive}" class="dm-pill dm-pill--good">Hoạt động</span>
                            <span th:unless="${v.isActive}" class="dm-pill dm-pill--muted">Tắt</span>
                        </td>
                        <td class="dm-text-end">
                            <div class="dm-action-group">
                                <a th:href="@{'/admin/vouchers/toggle/' + ${v.id}}"
                                   class="dm-icon-btn dm-icon-btn--warn" title="Bật/Tắt">
                                    <i class="bi bi-toggle-on"></i>
                                </a>
                                <a th:href="@{'/admin/vouchers/delete/' + ${v.id}}"
                                   class="dm-icon-btn dm-icon-btn--bad" title="Xóa"
                                   onclick="return confirm('Xóa voucher này?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    .dm-dash {
        --bg: #0b0d12;
        --surface: #12151d;
        --surface-2: #1a1e29;
        --border: rgba(255,255,255,.07);
        --border-strong: rgba(255,255,255,.14);
        --text: #f5f6f9;
        --text-dim: #d3d6e0;
        --text-faint: #a6abbd;
        --accent: #8b7cf6;
        --accent-soft: rgba(139,124,246,.14);
        --good: #34d399;
        --good-soft: rgba(52,211,153,.13);
        --bad: #f2637a;
        --bad-soft: rgba(242,99,122,.13);
        --warn: #f5b95c;
        --warn-soft: rgba(245,185,92,.13);
        --radius: 18px;

        position: relative;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        border-radius: 0px;
        padding: 32px;
        margin: -24px -24px 0;
    }
    @media (max-width: 767px) {
        .dm-dash { padding: 18px; margin: -24px -24px 0; }
    }

    .dm-glow {
        position: absolute; width: 480px; height: 480px; border-radius: 50%;
        filter: blur(110px); opacity: .16; pointer-events: none;
        animation: dmDrift 14s ease-in-out infinite alternate;
    }
    .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
    .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }
    @keyframes dmDrift {
        from { transform: translate(0,0) scale(1); }
        to   { transform: translate(-30px, 25px) scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) { .dm-glow { animation: none !important; opacity: 1 !important; } }

    .dm-content { position: relative; z-index: 1; }

    .dm-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 12px; flex-wrap: wrap; }
    .dm-eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
    .dm-title { font-size: 1.7rem; font-weight: 800; margin: 0; letter-spacing: -.02em; }

    .dm-card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 22px; transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .dm-card:hover { border-color: var(--border-strong); }
    .mb-4 { margin-bottom: 24px; }

    .dm-section-title {
        display: flex; align-items: center; justify-content: space-between;
        font-weight: 700; font-size: .92rem; margin-bottom: 18px;
        padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .dm-section-title i { margin-right: 8px; color: var(--accent); }

    .dm-text-faint { color: var(--text-faint); font-size: .78rem; }
    .dm-text-dim { color: var(--text-dim); }
    .dm-text-center { text-align: center; }
    .dm-text-end { text-align: right; }
    .dm-cell-strong { font-weight: 700; }
    .dm-cell-good { color: var(--good); font-weight: 700; }
    .dm-cell-bad { color: var(--bad); }

    .dm-btn {
        display: inline-flex; align-items: center; gap: 6px; justify-content: center;
        border: 1px solid var(--border); color: var(--text-dim);
        background: transparent; border-radius: 999px;
        font-size: .82rem; font-weight: 600; padding: 8px 16px;
        text-decoration: none; transition: all .2s ease; cursor: pointer;
    }
    .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .dm-btn--solid { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dm-btn--solid:hover { background: #7a6af0; border-color: #7a6af0; color: #fff; }

    .dm-action-group {
        display: flex; align-items: center; justify-content: flex-end;
        gap: 5px; flex-wrap: nowrap;
    }
    .dm-icon-btn {
        display: inline-flex; align-items: center; justify-content: center;
        flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px;
        border: 1px solid var(--border); color: var(--text-dim); background: transparent;
        text-decoration: none; transition: all .2s ease; font-size: .85rem;
    }
    .dm-icon-btn--warn:hover { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
    .dm-icon-btn--bad:hover { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

    .dm-filter-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .dm-form-group { display: flex; flex-direction: column; gap: 6px; }
    .dm-form-group--inline { min-width: 200px; }
    .dm-label { font-size: .78rem; font-weight: 600; color: var(--text-dim); }

    .dm-select, .dm-input {
        background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 10px; padding: 9px 12px; font-size: .87rem; font-family: inherit;
        outline: none; transition: border-color .2s ease;
    }
    .dm-select:focus, .dm-input:focus { border-color: var(--accent); }

    .dm-table-wrap { overflow-x: hidden; }
    .dm-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: .84rem; }
    .dm-table thead th {
        text-align: left; text-transform: uppercase; letter-spacing: .03em;
        font-size: .64rem; font-weight: 700; color: var(--text-faint);
        padding: 0 8px 10px; border-bottom: 1px solid var(--border);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dm-table thead th:last-child { text-align: right; }
    .dm-table tbody td {
        padding: 12px 8px; border-bottom: 1px solid var(--border);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dm-table tbody tr:last-child td { border-bottom: none; }
    .dm-table tbody tr { transition: background .2s ease; }
    .dm-table tbody tr:hover { background: var(--surface-2); }
    .dm-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .dm-pill {
        display: inline-flex; align-items: center; padding: 3px 11px;
        border-radius: 999px; font-size: .7rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
    }
    .dm-pill--muted  { background: var(--surface-2); color: var(--text-dim); }
    .dm-pill--accent { background: var(--accent-soft); color: var(--accent); }
    .dm-pill--good   { background: var(--good-soft); color: var(--good); }
    .dm-pill--bad    { background: var(--bad-soft); color: var(--bad); }
    .dm-pill--warn   { background: var(--warn-soft); color: var(--warn); }

    .dm-empty { text-align: center; padding: 28px 0; color: var(--text-faint); font-size: .85rem; }

    @media (max-width: 680px) {
        .dm-table-wrap { overflow-x: auto; }
        .dm-table { table-layout: auto; min-width: 760px; }
        .dm-table td, .dm-table th { white-space: nowrap; overflow: visible; text-overflow: clip; }
    }
</style>

</body>
</html>
