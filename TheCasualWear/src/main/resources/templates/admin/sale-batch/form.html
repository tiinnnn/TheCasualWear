<div xmlns:th="http://www.thymeleaf.org">
    <div class="dm-dash">
        <div class="dm-glow dm-glow--a"></div>
        <div class="dm-glow dm-glow--b"></div>

        <div class="dm-content">

            <!-- ==================== HEADER ==================== -->
            <div class="dm-header">
                <div>
                    <p class="dm-eyebrow">Khuyến mãi</p>
                    <h1 class="dm-title">Tạo đợt sale mới</h1>
                </div>
                <a th:href="@{/admin/sale-batches}" class="dm-btn">
                    <i class="bi bi-arrow-left"></i>Quay lại
                </a>
            </div>

            <!-- error đã tự hiển thị qua admin-layout (fragments/alerts) -->

            <form th:action="@{/admin/sale-batches}" method="post" id="saleBatchForm">

                <!-- ==================== THÔNG TIN ĐỢT SALE ==================== -->
                <div class="dm-card mb-4">
                    <div class="dm-form-row dm-form-row--4">
                        <div class="dm-form-group">
                            <label class="dm-label">Tên đợt sale <span class="dm-required">*</span></label>
                            <input type="text" name="name" class="dm-input" placeholder="VD: Sale hè 2026" required>
                        </div>
                        <div class="dm-form-group">
                            <label class="dm-label">Giảm giá (%) <span class="dm-required">*</span></label>
                            <input type="number" name="discountPercent" class="dm-input"
                                   min="1" max="90" step="0.5" required>
                        </div>
                        <div class="dm-form-group">
                            <label class="dm-label">Bắt đầu <span class="dm-required">*</span></label>
                            <input type="datetime-local" name="startDate" id="batchStartDate" class="dm-input" required>
                            <small class="dm-text-faint" id="batchStartErr" style="display:none;color:var(--bad)"></small>
                        </div>
                        <div class="dm-form-group">
                            <label class="dm-label">Kết thúc <span class="dm-required">*</span></label>
                            <input type="datetime-local" name="endDate" id="batchEndDate" class="dm-input" required>
                            <small class="dm-text-faint" id="batchEndErr" style="display:none;color:var(--bad)"></small>
                        </div>
                    </div>
                </div>

                <!-- ==================== CHỌN SẢN PHẨM ==================== -->
                <div class="dm-card mb-4">
                    <div class="dm-section-title">
                        <span><i class="bi bi-box-seam"></i>Chọn sản phẩm áp dụng</span>
                        <input type="text" id="productFilter" class="dm-input dm-input--filter"
                               placeholder="Lọc theo tên sản phẩm...">
                    </div>

                    <div class="dm-table-wrap dm-table-wrap--scroll">
                        <table class="dm-table">
                            <colgroup>
                                <col style="width:44px">
                                <col style="width:60px">
                                <col style="width:38%">
                                <col style="width:17%">
                                <col style="width:15%">
                            </colgroup>
                            <thead>
                            <tr>
                                <th class="dm-text-center"><input type="checkbox" id="selectAll" class="dm-checkbox"></th>
                                <th class="dm-text-center">Ảnh</th>
                                <th>Sản phẩm</th>
                                <th>Danh mục</th>
                                <th class="dm-text-end">Giá</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${products}" th:attr="data-name=${#strings.toLowerCase(p.name)}"
                                class="dm-row-clickable">
                                <td class="dm-text-center">
                                    <input type="checkbox" name="productIds" th:value="${p.id}" class="dm-checkbox product-checkbox">
                                </td>
                                <td class="dm-text-center">
                                    <img th:if="${p.images != null and !p.images.isEmpty()}"
                                         th:src="${p.images[0].imageUrl}"
                                         th:alt="${p.name}"
                                         class="dm-thumb"
                                         loading="lazy"
                                         onerror="this.onerror=null;this.src='https://placehold.co/64x64/1a1e29/6b7080?text=%20';">
                                    <div th:if="${p.images == null or p.images.isEmpty()}" class="dm-thumb dm-thumb--empty">
                                        <i class="bi bi-image"></i>
                                    </div>
                                </td>
                                <td class="dm-cell-strong dm-truncate" th:text="${p.name}"></td>
                                <td class="dm-text-dim dm-truncate" th:text="${p.category != null ? p.category.name : ''}"></td>
                                <td class="dm-text-end dm-text-dim"
                                    th:text="${p.price != null ? #numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT') + 'đ' : ''}"></td>
                            </tr>
                            <tr th:if="${products.isEmpty()}">
                                <td colspan="5" class="dm-empty">Không có sản phẩm nào</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="dm-selected-count">
                        <span id="selectedCount">Đã chọn 0 sản phẩm</span>
                    </div>
                </div>

                <div class="dm-form-actions">
                    <button type="submit" class="dm-btn dm-btn--solid">
                        <i class="bi bi-check-lg"></i>Tạo đợt sale
                    </button>
                    <a th:href="@{/admin/sale-batches}" class="dm-btn">Huỷ</a>
                </div>
            </form>

        </div>
    </div>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

        .dm-dash {
            --bg: #0b0d12; --surface: #12151d; --surface-2: #1a1e29;
            --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.14);
            --text: #f5f6f9; --text-dim: #d3d6e0; --text-faint: #a6abbd;
            --accent: #8b7cf6; --accent-soft: rgba(139,124,246,.14);
            --good: #34d399; --good-soft: rgba(52,211,153,.13);
            --bad: #f2637a; --bad-soft: rgba(242,99,122,.13);
            --warn: #f5b95c; --warn-soft: rgba(245,185,92,.13);
            --radius: 18px;
            position: relative; overflow: hidden; background: var(--bg); color: var(--text);
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 32px; margin: -24px -24px 0;
            min-height: calc(100vh - 64px);
        }
        @media (max-width: 767px) { .dm-dash { padding: 18px; margin: -24px -24px 0; min-height: calc(100vh - 56px); } }

        .dm-glow { position: absolute; width: 480px; height: 480px; border-radius: 50%; filter: blur(110px); opacity: .16; pointer-events: none; animation: dmDrift 14s ease-in-out infinite alternate; }
        .dm-glow--a { background: var(--accent); top: -180px; right: -140px; }
        .dm-glow--b { background: var(--good); bottom: -200px; left: -160px; animation-delay: -6s; }
        @keyframes dmDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px, 25px) scale(1.12); } }
        @media (prefers-reduced-motion: reduce) { .dm-glow { animation: none !important; opacity: 1 !important; } }

        .dm-content { position: relative; z-index: 1; }

        .dm-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; gap: 12px; flex-wrap: wrap; }
        .dm-eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
        .dm-title { font-size: 1.6rem; font-weight: 800; margin: 0; letter-spacing: -.02em; }

        .dm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
        .mb-4 { margin-bottom: 22px; }

        .dm-form-row { display: grid; gap: 16px; }
        .dm-form-row--4 { grid-template-columns: 2fr 1fr 1.3fr 1.3fr; }
        @media (max-width: 900px) { .dm-form-row--4 { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 560px) { .dm-form-row--4 { grid-template-columns: 1fr; } }

        .dm-form-group { display: flex; flex-direction: column; gap: 6px; }
        .dm-label { font-size: .8rem; font-weight: 600; color: var(--text-dim); }
        .dm-required { color: var(--bad); }

        .dm-input {
            background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
            border-radius: 10px; padding: 10px 13px; font-size: .88rem; font-family: inherit;
            outline: none; transition: border-color .2s ease, box-shadow .2s ease; width: 100%; box-sizing: border-box;
        }
        .dm-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .dm-input--invalid { border-color: var(--bad) !important; box-shadow: 0 0 0 3px var(--bad-soft) !important; }
        .dm-input::placeholder { color: var(--text-faint); }
        .dm-input--filter { width: auto; min-width: 220px; padding: 7px 12px; font-size: .82rem; }

        .dm-section-title {
            display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
            font-weight: 700; font-size: .92rem;
            margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
        }
        .dm-section-title i { margin-right: 8px; color: var(--accent); }

        .dm-text-dim { color: var(--text-dim); }
        .dm-text-center { text-align: center; }
        .dm-text-end { text-align: right; }
        .dm-cell-strong { font-weight: 700; }
        .dm-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .dm-table-wrap--scroll { max-height: 420px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; }
        .dm-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
        .dm-table thead th {
            position: sticky; top: 0; z-index: 1;
            text-align: left; text-transform: uppercase; letter-spacing: .03em;
            font-size: .66rem; font-weight: 700; color: var(--text-faint);
            padding: 10px; background: var(--surface-2); border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .dm-table th.dm-text-end { text-align: right; }
        .dm-table th.dm-text-center { text-align: center; }
        .dm-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
        .dm-table tbody tr:last-child td { border-bottom: none; }
        .dm-table tbody tr { transition: background .2s ease; }
        .dm-table tbody tr:hover { background: var(--surface-2); }
        .dm-row-clickable { cursor: pointer; }

        .dm-checkbox { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

        .dm-thumb {
            width: 44px; height: 44px; border-radius: 8px; object-fit: cover;
            border: 1px solid var(--border); background: var(--surface-2); display: block; margin: 0 auto;
        }
        .dm-thumb--empty {
            display: flex; align-items: center; justify-content: center;
            color: var(--text-faint); font-size: 1rem;
        }

        .dm-empty { text-align: center; padding: 24px 0; color: var(--text-faint); font-size: .85rem; }

        .dm-selected-count { margin-top: 12px; font-size: .85rem; color: var(--text-dim); }

        .dm-note-box {
            display: flex; align-items: flex-start; gap: 10px; border-radius: 14px;
            padding: 14px 16px; font-size: .85rem; line-height: 1.5;
        }
        .dm-note-box--warn { background: var(--warn-soft); border: 1px solid rgba(245,185,92,.3); color: var(--text); }
        .dm-note-box--warn i { color: var(--warn); margin-top: 2px; flex-shrink: 0; }

        .dm-form-actions { display: flex; gap: 10px; }

        .dm-btn {
            display: inline-flex; align-items: center; gap: 6px; justify-content: center;
            border: 1px solid var(--border); color: var(--text-dim);
            background: transparent; border-radius: 999px;
            font-size: .82rem; font-weight: 600; padding: 8px 16px;
            text-decoration: none; transition: all .2s ease; cursor: pointer;
        }
        .dm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
        .dm-btn--solid { background: var(--accent); border-color: var(--accent); color: #fff; }
        .dm-btn--solid:hover { background: #7a6af0; border-color: #7a6af0; color: #fff; }
    </style>

    <script>
        (function () {
            const filterInput   = document.getElementById('productFilter');
            const selectAll     = document.getElementById('selectAll');
            const checkboxes    = () => Array.from(document.querySelectorAll('.product-checkbox'));
            const selectedCount = document.getElementById('selectedCount');
            const form          = document.getElementById('saleBatchForm');
            const startInput    = document.getElementById('batchStartDate');
            const endInput      = document.getElementById('batchEndDate');
            const startErr      = document.getElementById('batchStartErr');
            const endErr        = document.getElementById('batchEndErr');

            function pad(n) { return String(n).padStart(2, '0'); }
            function toLocalDateTimeString(date) {
                return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
                    + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
            }
            function nowValue() { return toLocalDateTimeString(new Date()); }

            // Không cho chọn ngày bắt đầu bé hơn thời điểm hiện tại (chặn
            // ngay từ lịch chọn ngày — nhưng "hiện tại" trôi theo thời gian
            // nên vẫn cần check lại lúc submit bên dưới).
            startInput.min = nowValue();

            // Khi đổi ngày bắt đầu -> cập nhật min cho ngày kết thúc
            startInput.addEventListener('change', function () {
                endInput.min = startInput.value || nowValue();
                if (endInput.value && endInput.value <= startInput.value) {
                    endInput.value = '';
                }
            });

            function updateCount() {
                const n = checkboxes().filter(cb => cb.checked).length;
                selectedCount.textContent = 'Đã chọn ' + n + ' sản phẩm';
            }

            filterInput.addEventListener('input', function () {
                const q = this.value.trim().toLowerCase();
                document.querySelectorAll('tbody tr[data-name]').forEach(row => {
                    row.style.display = row.getAttribute('data-name').includes(q) ? '' : 'none';
                });
            });

            selectAll.addEventListener('change', function () {
                checkboxes().forEach(cb => {
                    // Chỉ tick/bỏ tick các dòng đang hiển thị (sau filter)
                    const row = cb.closest('tr');
                    if (row.style.display !== 'none') cb.checked = selectAll.checked;
                });
                updateCount();
            });

            document.querySelectorAll('.product-checkbox').forEach(cb =>
                cb.addEventListener('change', updateCount));

            // Click bất kỳ đâu trên dòng (trừ chính checkbox) cũng toggle chọn —
            // hữu ích vì giờ dòng có ảnh + nhiều thông tin hơn, dễ bấm trúng hơn
            document.querySelectorAll('.dm-row-clickable').forEach(row => {
                row.addEventListener('click', function (e) {
                    if (e.target.classList.contains('product-checkbox')) return;
                    const cb = row.querySelector('.product-checkbox');
                    if (!cb) return;
                    cb.checked = !cb.checked;
                    cb.dispatchEvent(new Event('change'));
                });
            });

            function showError(input, errEl, message) {
                input.classList.add('dm-input--invalid');
                errEl.textContent = message;
                errEl.style.display = 'block';
            }
            function clearError(input, errEl) {
                input.classList.remove('dm-input--invalid');
                errEl.style.display = 'none';
            }

            form.addEventListener('submit', function (e) {
                clearError(startInput, startErr);
                clearError(endInput, endErr);

                if (checkboxes().filter(cb => cb.checked).length === 0) {
                    e.preventDefault();
                    alert('Vui lòng chọn ít nhất 1 sản phẩm.');
                    return;
                }

                let hasError = false;
                const now = nowValue();

                // Ngày bắt đầu không được sớm hơn thời điểm hiện tại.
                if (startInput.value && startInput.value < now) {
                    showError(startInput, startErr, 'Ngày bắt đầu không được sớm hơn thời điểm hiện tại!');
                    hasError = true;
                }
                // Ngày kết thúc không được sớm hơn (hoặc bằng) ngày bắt đầu.
                if (startInput.value && endInput.value && endInput.value <= startInput.value) {
                    showError(endInput, endErr, 'Ngày kết thúc phải lớn hơn ngày bắt đầu!');
                    hasError = true;
                }

                if (hasError) e.preventDefault();
            });
        })();
    </script>
</div>
